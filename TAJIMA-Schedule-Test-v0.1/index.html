<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAJIMA 日程管理 TEST v0.1</title><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{height:64px;background:#132033;color:white;display:flex;align-items:center;padding:0 24px;gap:18px}header h1{font-size:20px;margin:0}header small{opacity:.7}
.topbtns{margin-left:auto;display:flex;gap:8px}.topbtns button{border:1px solid #536276;background:#1e2d42;color:white;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}
.layout{display:grid;grid-template-columns:350px minmax(760px,1fr);min-height:calc(100vh - 64px)}
aside{background:#18263a;color:#dce6f3;padding:14px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.nav button{padding:11px;border:0;border-radius:8px;background:#253750;color:white;font-weight:800;cursor:pointer}.nav button.active{background:#3b82f6}
.panel{background:#fff;color:#172033;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px #0001}.panel h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:12px;font-weight:800;margin:9px 0 4px;color:#445066}input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:9px;font:inherit}textarea{min-height:65px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.datecheck{display:flex;gap:7px;align-items:center}.datecheck input[type=checkbox]{width:auto}.datecheck input[type=date]{flex:1}
.colors{display:flex;gap:6px;flex-wrap:wrap}.sw{width:27px;height:27px;border-radius:6px;border:3px solid transparent;cursor:pointer}.sw.none{width:auto;padding:0 8px;background:#eef2f7;border:1px solid #cbd5e1}.sw.sel{outline:3px solid #111827}
.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;padding:10px;border:0;border-radius:7px;font-weight:900;cursor:pointer}.save{background:#2563eb;color:#fff}.complete{background:#16a34a;color:#fff}.delete{background:#ef4444;color:#fff}.cancel{background:#e2e8f0}
main{padding:18px;min-width:0}.calhead{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}.calhead button{padding:7px 12px}.calhead h2{margin:0;min-width:150px;text-align:center}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);background:#cbd5e1;gap:1px;border:1px solid #cbd5e1}.dow,.day{background:#fff}.dow{text-align:center;font-weight:900;padding:8px}.dow:first-child{color:#dc2626}.dow:last-child{color:#2563eb}.day{min-height:125px;padding:5px;overflow:hidden}.day.holiday{background:#fff1f2}.day .num{font-weight:900;font-size:13px}.day.holiday .num{color:#dc2626}
.item{font-size:11px;margin-top:4px;padding:4px 5px;border:1px solid #cbd5e1;border-radius:5px;background:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.item.dragging{opacity:.4}.item.done{opacity:.65}.stamp{color:#b91c1c;font-weight:900}.event{background:#f3f4f6;font-weight:800}
.hint{font-size:12px;color:#64748b;margin-top:8px}.editing{padding:7px;background:#eff6ff;border:1px solid #93c5fd;border-radius:7px;font-size:12px;margin-bottom:8px}
.companylist button{display:block;width:100%;text-align:left;margin:4px 0;padding:8px;border:1px solid #dbe3ed;background:white;border-radius:6px;cursor:pointer}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:10}.modal.show{display:flex}.modalbox{width:min(760px,90vw);max-height:80vh;overflow:auto;background:white;border-radius:12px;padding:18px}.hist{border-bottom:1px solid #ddd;padding:9px}
@media(max-width:1000px){.layout{grid-template-columns:320px 1fr}.day{min-height:105px}}
</style></head><body>
<header><h1>TAJIMA 日程管理 <small>TEST v0.1</small></h1>
<div class="topbtns"><button onclick="window.open('penboard.html','_blank')">ペンボード入力</button><button onclick="window.open('monitor.html','_blank')">工場表示を確認</button></div></header>
<div class="layout"><aside>
<div class="nav"><button class="active" onclick="showJob()">作業登録</button><button onclick="showEvent()">行事・点検登録</button><button onclick="showHoliday()">休日設定</button><button onclick="showCompanies()">会社別履歴</button></div>
<div id="jobPanel" class="panel"><h2>作業登録・編集</h2><div id="editing" style="display:none" class="editing"></div>
<label>会社名</label><input id="company" list="companyList" placeholder="例：○○製作所"><datalist id="companyList"></datalist>
<label>品番</label><input id="part" list="partList" placeholder="例：ABC-123"><datalist id="partList"></datalist>
<label>担当機械</label><input id="machine" list="machineList" placeholder="未定でも登録可能"><datalist id="machineList"></datalist><label><input id="machineUnknown" type="checkbox" style="width:auto"> 未定</label>
<label>日程</label><div class="datecheck"><input id="hasArrival" type="checkbox"><span>入荷日</span><input id="arrival" type="date"></div>
<div class="datecheck" style="margin-top:6px"><input id="hasDue" type="checkbox"><span>納期　</span><input id="due" type="date"></div>
<label>表示強調（基本：なし）</label><div id="colors" class="colors"></div>
<label>メモ（管理カレンダーには表示しません）</label><textarea id="memo" placeholder="特記事項など"></textarea>
<div class="actions"><button id="saveBtn" class="save" onclick="saveJob()">登録</button><button id="completeBtn" class="complete" style="display:none" onclick="completeJob()">完了</button><button id="deleteBtn" class="delete" style="display:none" onclick="deleteJob()">削除</button></div><button id="cancelBtn" class="cancel" style="display:none;width:100%;margin-top:7px;padding:9px;border:0;border-radius:7px" onclick="resetForm()">編集解除</button>
</div>
<div id="eventPanel" class="panel" style="display:none"><h2>行事・点検登録</h2><label>日付</label><input id="eventDate" type="date"><label>内容</label><input id="eventText" placeholder="例：電気設備点検"><label>表示強調</label><div id="eventColors" class="colors"></div><button class="save" style="width:100%;margin-top:12px;padding:10px;border:0;border-radius:7px" onclick="saveEvent()">登録</button></div>
<div id="holidayPanel" class="panel" style="display:none"><h2>休日設定</h2><div class="hint">管理カレンダーの日付をクリックすると会社休日をON/OFFできます。日曜日は自動で休日表示します。</div></div>
<div id="companyPanel" class="panel" style="display:none"><h2>会社別履歴</h2><div id="companies" class="companylist"></div></div>
</aside>
<main><div class="calhead"><button onclick="moveMonth(-1)">◀</button><h2 id="monthTitle"></h2><button onclick="moveMonth(1)">▶</button></div><div id="calendar" class="calendar"></div><div class="hint">予定をクリック＝左の編集欄へ読み込み ／ 入・納の予定をドラッグ＝日付移動（確認後保存）</div></main></div>
<div id="modal" class="modal" onclick="if(event.target===this)this.classList.remove('show')"><div class="modalbox"><div id="modalBody"></div><button onclick="modal.classList.remove('show')">閉じる</button></div></div>
<script>

const C=window.CONFIG||{}, URL=C.SUPABASE_URL||"", KEY=C.SUPABASE_PUBLISHABLE_KEY||C.SUPABASE_ANON_KEY||C.SUPABASE_KEY||"";
const API=n=>`${URL}/rest/v1/${n}`;
const H=()=>({"apikey":KEY,"Authorization":`Bearer ${KEY}`,"Content-Type":"application/json","Prefer":"return=representation"});
const ok=()=>URL&&KEY;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function get(t,q=""){let r=await fetch(API(t)+q,{headers:H()});if(!r.ok)throw Error(await r.text());return r.json()}
async function post(t,row){let r=await fetch(API(t),{method:"POST",headers:H(),body:JSON.stringify(row)});if(!r.ok)throw Error(await r.text());return r.json()}
async function patch(t,id,row){let r=await fetch(`${API(t)}?id=eq.${id}`,{method:"PATCH",headers:H(),body:JSON.stringify(row)});if(!r.ok)throw Error(await r.text());return r.json()}
async function del(t,id){let r=await fetch(`${API(t)}?id=eq.${id}`,{method:"DELETE",headers:H()});if(!r.ok)throw Error(await r.text())}
const ym=(y,m)=>`${y}-${String(m).padStart(2,"0")}`;
const iso=(y,m,d)=>`${ym(y,m)}-${String(d).padStart(2,"0")}`;
const colors=["#ef4444","#f97316","#eab308","#22c55e","#06b6d4","#3b82f6","#8b5cf6","#ec4899"];

let now=new Date(),Y=now.getFullYear(),M=now.getMonth()+1,jobs=[],events=[],holidays=[],editId=null,accent=null,eventAccent=null,holidayMode=false;
function pane(id){["jobPanel","eventPanel","holidayPanel","companyPanel"].forEach(x=>document.getElementById(x).style.display=x===id?"block":"none");holidayMode=id==="holidayPanel";document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"))}
function showJob(){pane("jobPanel")}function showEvent(){pane("eventPanel")}function showHoliday(){pane("holidayPanel")}function showCompanies(){pane("companyPanel");drawCompanies()}
function initColors(id,setter){let e=document.getElementById(id);e.innerHTML=`<button class="sw none sel" data-c="" onclick="${setter}(null,this)">なし</button>`+colors.map(c=>`<button class="sw" style="background:${c}" data-c="${c}" onclick="${setter}('${c}',this)"></button>`).join("")}
function chooseColor(c,el){accent=c;document.querySelectorAll("#colors .sw").forEach(x=>x.classList.remove("sel"));el.classList.add("sel")}
function chooseEventColor(c,el){eventAccent=c;document.querySelectorAll("#eventColors .sw").forEach(x=>x.classList.remove("sel"));el.classList.add("sel")}
function setColorUI(id,c){document.querySelectorAll(`#${id} .sw`).forEach(x=>x.classList.toggle("sel",(x.dataset.c||null)===(c||null)))}
function moveMonth(d){M+=d;if(M<1){M=12;Y--}if(M>12){M=1;Y++}load()}
async function load(){monthTitle.textContent=`${Y}年${M}月`;if(!ok()){alert("config.js を既存TAJIMAと同じ設定で用意してください");return}
let from=`${ym(Y,M)}-01`,ny=M===12?Y+1:Y,nm=M===12?1:M+1,to=`${ym(ny,nm)}-01`;
try{[jobs,events,holidays]=await Promise.all([get("schedule_jobs",`?or=(arrival_date.gte.${from},due_date.gte.${from})&or=(arrival_date.lt.${to},due_date.lt.${to})&select=*&order=created_at.asc`),get("schedule_events",`?event_date=gte.${from}&event_date=lt.${to}&select=*&order=event_date.asc`),get("schedule_holidays",`?holiday_date=gte.${from}&holiday_date=lt.${to}&select=*`)]);draw();await refreshMasters()}catch(e){alert("読込エラー: "+e.message)}}
async function refreshMasters(){let all=await get("schedule_jobs","?select=company_name,part_no,machine_name&order=created_at.desc&limit=1000");let cs=[...new Set(all.map(x=>x.company_name).filter(Boolean))],ms=[...new Set(all.map(x=>x.machine_name).filter(Boolean))];companyList.innerHTML=cs.map(x=>`<option value="${esc(x)}">`).join("");machineList.innerHTML=ms.map(x=>`<option value="${esc(x)}">`).join("");company.oninput=()=>{let c=company.value;let ps=[...new Set(all.filter(x=>x.company_name===c).map(x=>x.part_no).filter(Boolean))];partList.innerHTML=ps.map(x=>`<option value="${esc(x)}">`).join("")}}
function draw(){let dows=["日","月","火","水","木","金","土"],first=new Date(Y,M-1,1),last=new Date(Y,M,0).getDate();let s=dows.map(x=>`<div class="dow">${x}</div>`).join("");for(let i=0;i<first.getDay();i++)s+=`<div class="day"></div>`;
for(let d=1;d<=last;d++){let date=iso(Y,M,d),dow=new Date(Y,M-1,d).getDay(),isHol=dow===0||holidays.some(h=>h.holiday_date===date);let arr=jobs.filter(x=>x.arrival_date===date),duej=jobs.filter(x=>x.due_date===date),ev=events.filter(x=>x.event_date===date);
s+=`<div class="day ${isHol?"holiday":""}" data-date="${date}" ondragover="event.preventDefault()" ondrop="dropItem(event,'${date}')" onclick="holidayClick(event,'${date}',${dow})"><div class="num">${d}</div>`;
for(let x of arr)s+=jobItem(x,"arrival");for(let x of duej)s+=jobItem(x,"due");for(let x of ev)s+=`<div class="item event" style="${x.accent_color?`border:2px solid ${x.accent_color}`:""}" onclick="event.stopPropagation()">◆ ${esc(x.title)}</div>`;s+="</div>"}calendar.innerHTML=s}
function jobItem(x,type){let label=type==="arrival"?"入":"納",done=type==="due"&&x.status==="完了";return `<div class="item ${done?"done":""}" draggable="true" data-id="${x.id}" data-type="${type}" ondragstart="dragStart(event)" style="${x.accent_color?`border:2px solid ${x.accent_color}`:""}" onclick="event.stopPropagation();editJob(${x.id})">${done?'<span class="stamp">㊞</span> ':""}${label} ${esc(x.part_no)} ${esc(x.company_name)} ${esc(x.machine_name||"")}</div>`}
function dragStart(e){e.dataTransfer.setData("text/plain",JSON.stringify({id:Number(e.currentTarget.dataset.id),type:e.currentTarget.dataset.type}));e.currentTarget.classList.add("dragging")}
async function dropItem(e,date){e.preventDefault();e.stopPropagation();let d;try{d=JSON.parse(e.dataTransfer.getData("text/plain"))}catch{return}let x=jobs.find(j=>j.id===d.id);if(!x)return;let old=d.type==="arrival"?x.arrival_date:x.due_date;if(old===date)return;if(!confirm(`${old} → ${date} に変更しますか？`))return;await patch("schedule_jobs",x.id,d.type==="arrival"?{arrival_date:date}:{due_date:date});load()}
async function holidayClick(e,date,dow){if(!holidayMode||e.target.closest(".item"))return;if(dow===0){alert("日曜日は自動休日です");return}let h=holidays.find(x=>x.holiday_date===date);if(h){if(confirm(`${date} の休日設定を解除しますか？`)){await del("schedule_holidays",h.id);load()}}else{if(confirm(`${date} を会社休日にしますか？`)){await post("schedule_holidays",{holiday_date:date,label:"会社休日"});load()}}}
function editJob(id){showJob();let x=jobs.find(j=>j.id===id);if(!x)return;editId=id;editing.style.display="block";editing.textContent=`編集中：${x.company_name} / ${x.part_no}`;company.value=x.company_name||"";part.value=x.part_no||"";machine.value=x.machine_name||"";machineUnknown.checked=!x.machine_name;hasArrival.checked=!!x.arrival_date;arrival.value=x.arrival_date||"";hasDue.checked=!!x.due_date;due.value=x.due_date||"";memo.value=x.memo||"";accent=x.accent_color||null;setColorUI("colors",accent);saveBtn.textContent="更新保存";completeBtn.style.display="block";deleteBtn.style.display="block";cancelBtn.style.display="block"}
function resetForm(){editId=null;editing.style.display="none";company.value=part.value=machine.value=memo.value=arrival.value=due.value="";machineUnknown.checked=false;hasArrival.checked=hasDue.checked=false;accent=null;setColorUI("colors",null);saveBtn.textContent="登録";completeBtn.style.display=deleteBtn.style.display=cancelBtn.style.display="none"}
async function saveJob(){let c=company.value.trim(),p=part.value.trim(),mach=machineUnknown.checked?"":machine.value.trim(),a=hasArrival.checked?arrival.value:null,d=hasDue.checked?due.value:null;if(!c||!p){alert("会社名と品番は入力してください");return}if(!a&&!d){alert("入荷日または納期のどちらかをチェックしてください");return}let row={company_name:c,part_no:p,machine_name:mach||null,arrival_date:a,due_date:d,memo:memo.value.trim(),accent_color:accent,updated_at:new Date().toISOString()};if(editId)await patch("schedule_jobs",editId,row);else await post("schedule_jobs",row);resetForm();load()}
async function completeJob(){if(!editId)return;let x=jobs.find(j=>j.id===editId);if(!x?.due_date){alert("納期が未定のため、先に納期を登録してください");return}if(!confirm("この案件を完了にしますか？ 完了印は納期側に表示されます。"))return;await patch("schedule_jobs",editId,{status:"完了",completed_at:new Date().toISOString()});resetForm();load()}
async function deleteJob(){if(editId&&confirm("この案件を削除しますか？")){await del("schedule_jobs",editId);resetForm();load()}}
async function saveEvent(){if(!eventDate.value||!eventText.value.trim()){alert("日付と内容を入力してください");return}await post("schedule_events",{event_date:eventDate.value,title:eventText.value.trim(),accent_color:eventAccent});eventText.value="";load()}
async function drawCompanies(){let all=await get("schedule_jobs","?select=*&order=created_at.desc");let cs=[...new Set(all.map(x=>x.company_name))];companies.innerHTML=cs.map(c=>`<button onclick='companyHistory(${JSON.stringify(c)})'>${esc(c)} <small>(${all.filter(x=>x.company_name===c).length}件)</small></button>`).join("")||"履歴なし";window._allJobs=all}
function companyHistory(c){let a=(window._allJobs||[]).filter(x=>x.company_name===c);modalBody.innerHTML=`<h2>${esc(c)}</h2>`+a.map(x=>`<div class="hist"><b>${esc(x.part_no)}</b>　${x.status==="完了"?"㊞ 完了":"進行中"}<br>入荷 ${x.arrival_date||"未定"} ／ 納期 ${x.due_date||"未定"} ／ 機械 ${esc(x.machine_name||"未定")}<br>${esc(x.memo||"")}</div>`).join("");modal.classList.add("show")}
initColors("colors","chooseColor");initColors("eventColors","chooseEventColor");load();
</script></body></html>
