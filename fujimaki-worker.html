<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#173b86"><title>藤巻 作業画面</title><script src="config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#16233d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;padding:12px}.head{background:#173b86;color:#fff;border-radius:16px;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:10px}.head b{font-size:22px}.head small{display:block;opacity:.85;margin-top:3px}.sync{font-size:12px;text-align:right}.current,.job,.empty,.error{background:#fff;border:2px solid #bfdbfe;border-radius:17px;padding:15px;margin-top:12px}.current{border-color:#2563eb;box-shadow:0 7px 20px #1d4ed81f}.eyebrow{font-size:13px;color:#1d4ed8;font-weight:900}.urgent{border-left:9px solid #dc2626}.tag{display:inline-block;background:#fee2e2;color:#991b1b;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900}.name{font-size:22px;font-weight:900;color:#173b86;margin-top:7px;overflow-wrap:anywhere}.spec{color:#64748b;font-size:13px;margin-top:3px}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.counts>div{background:#eff6ff;border-radius:11px;padding:9px;text-align:center}.counts span{display:block;color:#64748b;font-size:11px}.counts b{font-size:20px}.progress{height:13px;background:#dbe4f0;border-radius:999px;overflow:hidden}.bar{height:100%;background:#2563eb}.now{text-align:center;font-size:17px;font-weight:900;margin:9px 0}.btn{width:100%;border:0;border-radius:13px;padding:14px 10px;color:#fff;font-size:18px;font-weight:900}.btn small{display:block;font-size:12px;font-weight:600;margin-top:3px;opacity:.92}.complete{background:#16834b}.start{background:#2563eb}.list-title{font-weight:900;margin:18px 3px 4px}.job-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.job .name{font-size:18px}.empty{text-align:center;padding:35px 12px;font-weight:900;color:#475569}.error{border-color:#fecaca;color:#991b1b}.foot{text-align:center;color:#64748b;font-size:11px;margin:15px 0}.busy{opacity:.55;pointer-events:none}@media(min-width:760px){body{max-width:820px;margin:auto;padding:18px}.head b{font-size:26px}.name{font-size:26px}.btn{font-size:20px;padding:17px}}
</style></head><body><div class="head"><div><b>藤巻工範　作業</b><small>Công việc Fujimaki</small></div><div class="sync" id="syncText">読込中<br>Đang tải</div></div><main id="app"><div class="empty">読込中…<br>Đang tải…</div></main><div class="foot">画面は自動更新されます · Màn hình tự động cập nhật</div><script>
const CONFIG=window.TAJIMA_CONFIG||{},URL=CONFIG.SUPABASE_URL||"",KEY=CONFIG.SUPABASE_KEY||"",API=`${URL}/rest/v1/material_work_progress`;let rows=[],saving=false;
const h=()=>({apikey:KEY,Authorization:`Bearer ${KEY}`,"Content-Type":"application/json","Prefer":"return=representation"}),n=v=>Number(v)||0,e=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
async function load(){if(saving)return;try{const r=await fetch(`${API}?status=neq.completed&select=*&order=priority.desc,sort_order.asc,id.asc`,{headers:h(),cache:"no-store"});if(!r.ok)throw new Error(await r.text());rows=await r.json();draw();syncText.innerHTML=`${new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}<br>Đã cập nhật`}catch(x){app.innerHTML=`<div class="error">データを読み込めません<br>Không thể tải dữ liệu<br><small>${e(x.message)}</small></div>`}}
function card(r,current=false){const done=n(r.completed_qty),total=n(r.target_qty),rem=Math.max(0,total-done),pct=total?Math.min(100,done/total*100):0;return `<section class="${current?"current":"job"} ${r.priority?"urgent":""}"><div class="job-top"><div>${r.priority?'<span class="tag">最優先 · Ưu tiên cao nhất</span>':current?'<span class="eyebrow">現在作業中 · Đang thực hiện</span>':""}<div class="name">${e(r.material_name)}</div><div class="spec">${e(r.spec||"")}<br>${e(r.order_no||"")}</div></div></div><div class="counts"><div><span>入荷 · Đã nhận</span><b>${total}</b></div><div><span>完了 · Hoàn thành</span><b>${done}</b></div><div><span>残り · Còn lại</span><b>${rem}</b></div></div>${current?`<div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="now">${done+1}台目を加工中<br><small>Đang gia công sản phẩm thứ ${done+1}</small></div><button class="btn complete" onclick="completeOne(${r.id})">1台完了<small>Hoàn thành 1 sản phẩm</small></button>`:`<button class="btn start" onclick="startWork(${r.id})">作業開始<small>Bắt đầu làm việc</small></button>`}</section>`}
function draw(){const current=rows.find(r=>r.status==="running"),waiting=rows.filter(r=>r.status!=="running");app.innerHTML=(current?card(current,true):'<div class="empty">現在作業中の品目はありません<br>Hiện không có sản phẩm đang gia công</div>')+(waiting.length?'<div class="list-title">作業できる品目 · Sản phẩm có thể gia công</div>'+waiting.map(r=>card(r,false)).join(""):'');}
async function patch(id,row){const r=await fetch(`${API}?id=eq.${id}`,{method:"PATCH",headers:h(),body:JSON.stringify({...row,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error(await r.text())}
async function startWork(id){if(saving)return;const current=rows.find(r=>r.status==="running");if(current&&Number(current.id)!==Number(id)&&!confirm("現在の作業を待機にして、この品目を開始しますか？\n\nTạm dừng công việc hiện tại và bắt đầu sản phẩm này?"))return;saving=true;document.body.classList.add("busy");try{if(current&&Number(current.id)!==Number(id))await patch(current.id,{status:"waiting"});await patch(id,{status:"running",started_at:new Date().toISOString()});}catch(x){alert("更新エラー / Lỗi cập nhật\n"+x.message)}finally{saving=false;document.body.classList.remove("busy");await load()}}
async function completeOne(id){if(saving)return;const row=rows.find(r=>Number(r.id)===Number(id));if(!row)return;if(!confirm(`1台完了にしますか？\n完了 ${n(row.completed_qty)+1} / ${n(row.target_qty)}\n\nXác nhận hoàn thành 1 sản phẩm?`))return;const qty=n(row.completed_qty)+1,all=qty>=n(row.target_qty);saving=true;document.body.classList.add("busy");try{await patch(id,{completed_qty:qty,status:all?"completed":"running",completed_at:all?new Date().toISOString():null})}catch(x){alert("更新エラー / Lỗi cập nhật\n"+x.message)}finally{saving=false;document.body.classList.remove("busy");await load()}}
load();setInterval(load,10000);
</script></body></html>
