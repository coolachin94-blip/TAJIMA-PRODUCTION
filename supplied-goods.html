<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>支給品管理</title>
<script>
(async()=>{if(!("serviceWorker" in navigator)||!navigator.serviceWorker.controller||sessionStorage.getItem("tajima_ocr_sw_reset")==="done")return;sessionStorage.setItem("tajima_ocr_sw_reset","done");const regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs)await reg.unregister();if(window.caches){const keys=await caches.keys();for(const key of keys)await caches.delete(key)}location.reload()})();
</script>
<script src="config.js"></script>
<style>
:root{--blue:#2563eb;--deep:#12345b;--green:#16a34a;--red:#dc2626;--line:#bfdbfe;--bg:#e8f2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#102a50}button,input,select{font:inherit}button{cursor:pointer;font-weight:800}.wrap{max-width:1500px;margin:auto;padding:14px}.head,.panel{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}.head h1{margin:0;text-align:center}.nav,.upload,.filters,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 18px;background:#eaf2ff;color:#12345b}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.red{background:#fee2e2;color:#b91c1c}.purple{background:#7c3aed;color:#fff}.upload .btn{flex:1;min-width:210px;font-size:18px;padding:18px}.hidden{display:none!important}.hint{font-size:13px;color:#64748b;margin-top:7px}.preview-grid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(480px,2fr);gap:12px}canvas{width:100%;max-height:520px;object-fit:contain;background:#eef2f7;border-radius:12px}.mask{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;margin-top:8px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:1100px;background:#fff}th,td{border-bottom:1px solid #dbeafe;padding:7px;text-align:left;white-space:nowrap}th{background:#eff6ff;position:sticky;top:0;z-index:1}td input,td select,.filter{width:100%;min-width:90px;padding:8px;border:1px solid #b9c9df;border-radius:8px}.qty{width:75px}.status{font-weight:900}.ok{color:#15803d}.cancel{color:#b91c1c}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#dbeafe;font-size:12px}.doc{border:2px solid var(--line);border-radius:14px;background:#fff;margin:10px 0;overflow:hidden}.doc summary{padding:14px;font-weight:900;cursor:pointer;display:flex;gap:10px;align-items:center}.doc summary .grow{flex:1}.doc.cancelled{opacity:.7;border-color:#fecaca}.doc-body{padding:0 12px 12px}.filter-grid{display:grid;grid-template-columns:repeat(8,minmax(115px,1fr));gap:6px;margin:10px 0}.filter-grid label{font-size:11px;font-weight:800}.filter-grid select{margin-top:3px}.notice{padding:10px;border-radius:10px;background:#fff7d6;color:#854d0e;font-weight:700}.modal-bg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal-bg.open{display:flex}.modal{background:#fff;border-radius:16px;padding:18px;width:min(620px,100%);max-height:95vh;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form-grid label{font-size:12px;font-weight:800}.form-grid input{width:100%;padding:10px;border:1px solid #aac1df;border-radius:9px;margin-top:3px}.wide{grid-column:1/-1}@media(max-width:850px){.preview-grid{grid-template-columns:1fr}.filter-grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:8px}.head h1{font-size:23px}}
</style>
</head>
<body><div class="wrap">
<div class="head"><h1>支給品管理</h1><div class="nav"><button class="btn" onclick="backToMaterials()">← 材料発注管理</button><button class="btn" onclick="loadData()">再読み込み</button></div><div class="hint">原本画像と指示単価は保存しません。登録前に必ず認識結果を確認してください。</div></div>

<div class="panel">
  <div class="upload"><button class="btn primary" onclick="cameraInput.click()">📷 カメラで撮影</button><button class="btn purple" onclick="albumInput.click()">🖼 アルバムから選択</button></div>
  <input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="albumInput" class="hidden" type="file" accept="image/*">
  <div class="hint">写真を選択すると、指示単価の列を端末内で隠してからOCRへ送信します。</div>
</div>

<div id="previewPanel" class="panel hidden"><div class="preview-grid"><div><canvas id="previewCanvas"></canvas><div class="mask"><input id="maskSlider" type="range" min="75" max="96" value="88"><b id="maskLabel">右端12%除外</b></div><div class="hint">灰色部分はOCRへ送信されません。境界が合わない場合はスライダーで調整してください。</div><button id="ocrBtn" class="btn primary" style="width:100%;margin-top:10px" onclick="runOcr()">文字を読み取る</button></div><div><div id="ocrState" class="notice">写真を確認して「文字を読み取る」を押してください。</div><div id="draftArea" class="hidden"><div class="actions" style="margin:10px 0"><button class="btn" onclick="addDraftRow()">＋ 行追加</button><button class="btn green" onclick="saveDraft()">確認して登録</button><button class="btn red" onclick="closePreview()">取消</button></div><div class="table-wrap"><table><thead><tr><th>発注番号</th><th>物件No.</th><th>納期</th><th>ユニット</th><th>部品コード</th><th>品名</th><th>注文数</th><th></th></tr></thead><tbody id="draftBody"></tbody></table></div></div></div></div></div>

<div class="panel"><div class="filters"><button class="btn" data-view="active" onclick="setView('active')">有効のみ</button><button class="btn primary" data-view="unshipped" onclick="setView('unshipped')">未出荷のみ</button><button class="btn" data-view="shipped" onclick="setView('shipped')">出荷済のみ</button><button class="btn" data-view="cancelled" onclick="setView('cancelled')">取消済み</button><button class="btn" data-view="all" onclick="setView('all')">すべて</button><button class="btn" onclick="clearFilters()">列フィルター解除</button></div><div id="filterGrid" class="filter-grid"></div><div id="countText" class="hint"></div></div>
<div id="documents"></div>
</div>

<div id="editModal" class="modal-bg"><div class="modal"><h2>支給品データ修正</h2><input id="editId" type="hidden"><div id="editFields" class="form-grid"></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="closeEdit()">閉じる</button><button class="btn green" onclick="saveEdit()">修正を保存</button></div></div></div>
<script>
const CONFIG=window.TAJIMA_CONFIG||{},URL=CONFIG.SUPABASE_URL||"",KEY=CONFIG.SUPABASE_KEY||"";
const DOC_API=`${URL}/rest/v1/supplied_documents`,ITEM_API=`${URL}/rest/v1/supplied_items`;
const COLS=[['order_prefix','発注区分'],['order_no_norm','発注番号'],['property_no','物件No.'],['due_date','納期'],['unit_no','ユニット'],['part_code_norm','部品コード'],['item_name','品名'],['shipped','出荷状態']];
let documents=[],items=[],draft=[],view='unshipped',filters={},sourceFile=null,sourceType='album',imageObj=null;
function h(){return {'apikey':KEY,'Authorization':`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':'return=representation'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(v){return String(v??'').normalize('NFKC').replace(/[\s\u3000]+/g,'').replace(/[‐‑‒–—―ー]/g,'-').toUpperCase()}
function prefix(v){const n=norm(v);return /^[A-Z]/.test(n)?n[0]:''}
function backToMaterials(){localStorage.setItem('tajima_section','materials');location.href='index.html'}
if(sessionStorage.getItem('tajima_supplied_goods_admin')!=='yes'){alert('材料管理者モードから開いてください');location.replace('index.html')}
cameraInput.onchange=e=>pickFile(e,'camera');albumInput.onchange=e=>pickFile(e,'album');maskSlider.oninput=()=>{maskLabel.textContent=`右端${100-maskSlider.value}%除外`;drawMaskedPreview()};
function pickFile(e,type){const f=e.target.files?.[0];e.target.value='';if(!f)return;sourceFile=f;sourceType=type;const img=new Image();img.onload=()=>{imageObj=img;previewPanel.classList.remove('hidden');draftArea.classList.add('hidden');ocrState.textContent='写真を確認して「文字を読み取る」を押してください。';drawMaskedPreview();previewPanel.scrollIntoView({behavior:'smooth'})};img.src=globalThis.URL.createObjectURL(f)}
function drawMaskedPreview(){if(!imageObj)return;const max=1800,scale=Math.min(1,max/imageObj.width);previewCanvas.width=Math.round(imageObj.width*scale);previewCanvas.height=Math.round(imageObj.height*scale);const c=previewCanvas.getContext('2d');c.drawImage(imageObj,0,0,previewCanvas.width,previewCanvas.height);const x=previewCanvas.width*Number(maskSlider.value)/100;c.fillStyle='#4b5563';c.fillRect(x,0,previewCanvas.width-x,previewCanvas.height);c.fillStyle='#fff';c.font=`bold ${Math.max(18,previewCanvas.width/45)}px sans-serif`;c.fillText('指示単価 除外',x+8,35)}
function canvasBase64(){const c=document.createElement('canvas');c.width=previewCanvas.width;c.height=previewCanvas.height;const x=c.width*Number(maskSlider.value)/100,g=c.getContext('2d');g.drawImage(imageObj,0,0,c.width,c.height);g.fillStyle='#fff';g.fillRect(x,0,c.width-x,c.height);return c.toDataURL('image/jpeg',.86).split(',')[1]}
async function runOcr(){if(!imageObj)return;ocrBtn.disabled=true;ocrState.textContent='文字を認識しています…';try{const r=await fetch(`${URL}/functions/v1/ocr-supplied-goods`,{method:'POST',headers:h(),body:JSON.stringify({image_base64:canvasBase64(),mime_type:'image/jpeg'})});const text=await r.text();if(!r.ok)throw Error(text);const out=JSON.parse(text);draft=(out.rows||[]).map(cleanDraft);if(!draft.length)addDraftRow();drawDraft();draftArea.classList.remove('hidden');ocrState.textContent=`${draft.length}行を認識しました。内容を修正してから登録してください。`}catch(e){ocrState.innerHTML=`OCRエラー: ${esc(e.message)}<br>Edge FunctionとAzure設定後に利用できます。行を手入力することもできます。`;if(!draft.length)addDraftRow();drawDraft();draftArea.classList.remove('hidden')}finally{ocrBtn.disabled=false}}
function cleanDraft(r={}){return {order_no:r.order_no||'',property_no:r.property_no||'',due_date:dateVal(r.due_date),unit_no:r.unit_no||'',part_code:r.part_code||'',item_name:r.item_name||'',quantity:Number(r.quantity)||1}}
function dateVal(v){const s=String(v||'').trim().replace(/[.\/]/g,'-');let m=s.match(/^(\d{2,4})-(\d{1,2})-(\d{1,2})$/);if(!m)return '';let y=Number(m[1]);if(y<100)y+=2000;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`}
function addDraftRow(){draft.push(cleanDraft());drawDraft()}
function setDraft(i,k,v){draft[i][k]=k==='quantity'?Number(v)||0:v}
function removeDraft(i){draft.splice(i,1);drawDraft()}
function drawDraft(){draftBody.innerHTML=draft.map((r,i)=>`<tr><td><input value="${esc(r.order_no)}" oninput="setDraft(${i},'order_no',this.value)"></td><td><input value="${esc(r.property_no)}" oninput="setDraft(${i},'property_no',this.value)"></td><td><input type="date" value="${esc(r.due_date)}" oninput="setDraft(${i},'due_date',this.value)"></td><td><input value="${esc(r.unit_no)}" oninput="setDraft(${i},'unit_no',this.value)"></td><td><input value="${esc(r.part_code)}" oninput="setDraft(${i},'part_code',this.value)"></td><td><input value="${esc(r.item_name)}" oninput="setDraft(${i},'item_name',this.value)"></td><td><input class="qty" type="number" min="0" step="0.01" value="${r.quantity}" oninput="setDraft(${i},'quantity',this.value)"></td><td><button class="btn red" onclick="removeDraft(${i})">除外</button></td></tr>`).join('')}
async function saveDraft(){const rows=draft.filter(r=>norm(r.order_no)||norm(r.part_code)||r.item_name.trim());if(!rows.length){alert('登録する行がありません');return}const dup=rows.filter(r=>items.some(x=>!x.cancelled_at&&x.order_no_norm===norm(r.order_no)&&x.part_code_norm===norm(r.part_code)));if(dup.length&&!confirm(`同じ発注番号・部品コードが${dup.length}件あります。登録を続けますか？`))return;if(!confirm(`${rows.length}件を登録しますか？`))return;try{const dr=await fetch(DOC_API,{method:'POST',headers:h(),body:JSON.stringify({source_type:sourceType,original_name:sourceFile?.name||null})});if(!dr.ok)throw Error(await dr.text());const doc=(await dr.json())[0];const payload=rows.map(r=>({document_id:doc.id,order_no_raw:r.order_no,order_no_norm:norm(r.order_no),order_prefix:prefix(r.order_no),property_no:r.property_no.trim(),due_date:r.due_date||null,unit_no:r.unit_no.trim(),part_code_raw:r.part_code,part_code_norm:norm(r.part_code),item_name:r.item_name.trim(),quantity:Number(r.quantity)||0}));const ir=await fetch(ITEM_API,{method:'POST',headers:h(),body:JSON.stringify(payload)});if(!ir.ok)throw Error(await ir.text());alert('登録しました');closePreview();await loadData()}catch(e){alert('登録エラー: '+e.message)}}
function closePreview(){previewPanel.classList.add('hidden');sourceFile=null;imageObj=null;draft=[]}
async function get(api){const r=await fetch(api,{headers:h(),cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}
async function loadData(){if(!URL||!KEY){alert('config.jsの設定を確認してください');return}try{[documents,items]=await Promise.all([get(`${DOC_API}?select=*&order=created_at.desc`),get(`${ITEM_API}?select=*&order=created_at.desc`)]);buildFilters();draw()}catch(e){document.getElementById('documents').innerHTML='';alert('支給品データ読み込みエラー: '+e.message)}}
function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('primary',b.dataset.view===v));draw()}
function clearFilters(){filters={};buildFilters();draw()}
function itemValue(x,k){if(k==='shipped')return x.shipped_at?'出荷済':'未出荷';return x[k]??''}
function buildFilters(){filterGrid.innerHTML=COLS.map(([k,label])=>{const vals=[...new Set(items.filter(x=>!x.cancelled_at).map(x=>String(itemValue(x,k))).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));return `<label>${label} ▼<select class="filter" onchange="filters['${k}']=this.value;draw()"><option value="">すべて</option>${vals.map(v=>`<option value="${esc(v)}" ${filters[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}).join('')}
function visibleItem(x){if(view==='active'&&x.cancelled_at)return false;if(view==='unshipped'&&(x.cancelled_at||x.shipped_at))return false;if(view==='shipped'&&(x.cancelled_at||!x.shipped_at))return false;if(view==='cancelled'&&!x.cancelled_at)return false;return Object.entries(filters).every(([k,v])=>!v||String(itemValue(x,k))===v)}
function draw(){const list=items.filter(visibleItem),ids=new Set(list.map(x=>Number(x.document_id)));const docs=documents.filter(d=>ids.has(Number(d.id))||(view==='cancelled'&&d.cancelled_at));countText.textContent=`表示 ${list.length}件 / 全${items.length}件`;document.getElementById('documents').innerHTML=docs.length?docs.map(d=>drawDoc(d,list.filter(x=>Number(x.document_id)===Number(d.id)))).join(''):'<div class="panel">該当データなし</div>'}
function drawDoc(d,rows){const cancelled=!!d.cancelled_at;return `<details class="doc ${cancelled?'cancelled':''}" open><summary><span class="grow">登録 ${new Date(d.created_at).toLocaleString('ja-JP')}　<span class="badge">${rows.length}件</span> ${cancelled?'<span class="status cancel">取消済み</span>':''}</span>${cancelled?`<button class="btn" onclick="event.preventDefault();restoreDoc(${d.id})">復元</button>`:`<button class="btn red" onclick="event.preventDefault();cancelDoc(${d.id})">この登録を取消</button>`}</summary><div class="doc-body"><div class="table-wrap"><table><thead><tr><th>発注番号</th><th>物件No.</th><th>納期</th><th>ユニット</th><th>部品コード</th><th>品名</th><th>注文数</th><th>出荷</th><th>操作</th></tr></thead><tbody>${rows.map(drawItem).join('')}</tbody></table></div></div></details>`}
function drawItem(x){return `<tr class="${x.cancelled_at?'cancelled':''}"><td>${esc(x.order_no_norm)}</td><td>${esc(x.property_no)}</td><td>${esc(x.due_date||'')}</td><td>${esc(x.unit_no)}</td><td>${esc(x.part_code_norm)}</td><td>${esc(x.item_name)}</td><td>${Number(x.quantity)||0}</td><td><button class="btn ${x.shipped_at?'green':''}" ${x.cancelled_at?'disabled':''} onclick="toggleShip(${x.id},${x.shipped_at?'true':'false'})">${x.shipped_at?'O 出荷済':'X 未出荷'}</button><div class="hint">${x.shipped_at?new Date(x.shipped_at).toLocaleDateString('ja-JP'):''}</div></td><td><button class="btn" ${x.cancelled_at?'disabled':''} onclick="openEdit(${x.id})">修正</button> ${x.cancelled_at?`<button class="btn" onclick="restoreItem(${x.id})">復元</button>`:`<button class="btn red" onclick="cancelItem(${x.id})">行取消</button>`}</td></tr>`}
async function patch(api,body){const r=await fetch(api,{method:'PATCH',headers:h(),body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.json()}
async function cancelDoc(id){if(!confirm('この写真から登録した全データを取消しますか？'))return;try{const now=new Date().toISOString();await patch(`${DOC_API}?id=eq.${id}`,{cancelled_at:now,updated_at:now});await patch(`${ITEM_API}?document_id=eq.${id}&cancelled_at=is.null`,{cancelled_at:now,document_cancelled:true,updated_at:now});await loadData()}catch(e){alert(e.message)}}
async function restoreDoc(id){if(!confirm('この登録を復元しますか？'))return;try{const now=new Date().toISOString();await patch(`${DOC_API}?id=eq.${id}`,{cancelled_at:null,updated_at:now});await patch(`${ITEM_API}?document_id=eq.${id}&document_cancelled=eq.true`,{cancelled_at:null,document_cancelled:false,updated_at:now});await loadData()}catch(e){alert(e.message)}}
async function cancelItem(id){if(!confirm('この行を取消しますか？'))return;try{await patch(`${ITEM_API}?id=eq.${id}`,{cancelled_at:new Date().toISOString(),document_cancelled:false,updated_at:new Date().toISOString()});await loadData()}catch(e){alert(e.message)}}
async function restoreItem(id){try{await patch(`${ITEM_API}?id=eq.${id}`,{cancelled_at:null,document_cancelled:false,updated_at:new Date().toISOString()});await loadData()}catch(e){alert(e.message)}}
async function toggleShip(id,isShipped){try{await patch(`${ITEM_API}?id=eq.${id}`,{shipped_at:isShipped?null:new Date().toISOString(),updated_at:new Date().toISOString()});await loadData()}catch(e){alert(e.message)}}
const EDIT=[['order_no_raw','発注番号'],['property_no','物件No.'],['due_date','納期','date'],['unit_no','ユニット'],['part_code_raw','部品コード'],['item_name','品名'],['quantity','注文数','number']];
function openEdit(id){const x=items.find(v=>Number(v.id)===Number(id));if(!x)return;editId.value=x.id;editFields.innerHTML=EDIT.map(([k,l,t])=>`<label class="${k==='item_name'?'wide':''}">${l}<input id="ef-${k}" type="${t||'text'}" value="${esc(x[k]??'')}"></label>`).join('');editModal.classList.add('open')}
function closeEdit(){editModal.classList.remove('open')}
async function saveEdit(){const id=Number(editId.value),old=items.find(v=>Number(v.id)===id),b={};EDIT.forEach(([k])=>b[k]=document.getElementById(`ef-${k}`).value);b.quantity=Number(b.quantity)||0;b.order_no_norm=norm(b.order_no_raw);b.order_prefix=prefix(b.order_no_raw);b.part_code_norm=norm(b.part_code_raw);b.due_date=b.due_date||null;b.updated_at=new Date().toISOString();try{await patch(`${ITEM_API}?id=eq.${id}`,b);closeEdit();await loadData()}catch(e){alert('修正エラー: '+e.message)}}
loadData();
</script></body></html>
