<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>TAJIMA ペンボード TEST v0.24</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:"Yu Gothic",sans-serif;background:#eef2f7}
.frame{height:100%;position:relative;background:#fff;padding-right:54px}
.frame iframe{position:absolute;left:0;top:0;bottom:0;right:54px;border:0;width:calc(100% - 54px);height:100%;z-index:1}
#drawCanvas,#stampCanvas{position:absolute;left:0;top:0;bottom:0;right:54px;width:calc(100% - 54px);height:100%;z-index:5;touch-action:none}
#stampCanvas{pointer-events:none;z-index:6}

.toolbar{position:absolute;right:0;top:0;width:54px;height:100%;z-index:100;background:#132033;color:#fff;display:flex;flex-direction:column;align-items:center;gap:7px;padding:7px 5px;box-shadow:-2px 0 8px #0004;overflow:visible}
.tool{width:42px;height:42px;min-height:42px;border:1px solid #40516a;background:#1b2b42;color:#fff;border-radius:8px;font-weight:900;cursor:pointer;padding:0;font-size:21px;line-height:1;display:grid;place-items:center}
.tool.active{background:#2563eb;border-color:#93c5fd}.tool.stamp-active{background:#b91c1c;border-color:#fca5a5}
.month-label{width:42px;text-align:center;font-size:13px;font-weight:900;padding:1px 0;white-space:nowrap}
.tool-wrap{position:relative;width:42px}
.pop{display:none;position:absolute;right:49px;top:0;background:#132033;border:1px solid #40516a;border-radius:10px;padding:8px;box-shadow:0 4px 14px #0005;z-index:150}
.pop.open{display:grid}
.colors-pop{grid-template-columns:repeat(3,34px);gap:7px}
.color{width:30px;height:30px;border-radius:50%;border:2px solid #cbd5e1;cursor:pointer;justify-self:center;padding:0}
.color.sel{outline:3px solid #fff;outline-offset:1px}
.color-current{width:19px;height:19px;border-radius:50%;background:#111111;border:2px solid #fff;display:block}
.widths-pop{grid-template-columns:1fr;gap:5px}
.widthbtn{width:44px;height:32px;border:1px solid #40516a;background:#1b2b42;border-radius:7px;cursor:pointer;display:grid;place-items:center;padding:0}
.widthbtn.sel{outline:2px solid #fff}
.width-line{width:27px;background:#fff;border-radius:999px;display:block}
.width-current{width:25px;height:3px;background:#fff;border-radius:999px;display:block}
.status{font-size:8px;color:#cbd5e1;text-align:center;margin-top:auto;line-height:1.15;width:44px;overflow:hidden;white-space:nowrap;text-overflow:clip}
.eraser-cursor{cursor:cell!important}.stamp-cursor{cursor:copy!important}
</style></head><body><div class="frame">
<iframe id="monitorFrame" src="about:blank"></iframe>
<canvas id="drawCanvas"></canvas>
<canvas id="stampCanvas"></canvas>
<div class="toolbar">
  <button class="tool" onclick="changeBoardMonth(-1)" title="前月" aria-label="前月">‹</button>
  <div id="boardMonthLabel" class="month-label"></div>
  <button class="tool" onclick="changeBoardMonth(1)" title="次月" aria-label="次月">›</button>

  <button id="penBtn" class="tool active" onclick="setMode('pen')" title="ペン" aria-label="ペン">✎</button>

  <div class="tool-wrap">
    <button id="colorMenuBtn" class="tool" onclick="toggleColorMenu(event)" title="色" aria-label="色"><span id="colorCurrent" class="color-current"></span></button>
    <div id="colorMenu" class="pop colors-pop">
      <button class="color sel" style="background:#111111" data-c="#111111" onclick="setColor(this)"></button>
      <button class="color" style="background:#ef4444" data-c="#ef4444" onclick="setColor(this)"></button>
      <button class="color" style="background:#2563eb" data-c="#2563eb" onclick="setColor(this)"></button>
      <button class="color" style="background:#16a34a" data-c="#16a34a" onclick="setColor(this)"></button>
      <button class="color" style="background:#f59e0b" data-c="#f59e0b" onclick="setColor(this)"></button>
      <button class="color" style="background:#8b5cf6" data-c="#8b5cf6" onclick="setColor(this)"></button>
    </div>
  </div>

  <div class="tool-wrap">
    <button id="widthMenuBtn" class="tool" onclick="toggleWidthMenu(event)" title="太さ" aria-label="太さ"><span id="widthCurrent" class="width-current"></span></button>
    <div id="widthMenu" class="pop widths-pop">
      <button class="widthbtn" data-w="0.8" onclick="setWidth(this)"><span class="width-line" style="height:1px"></span></button>
      <button class="widthbtn sel" data-w="1.3" onclick="setWidth(this)"><span class="width-line" style="height:3px"></span></button>
      <button class="widthbtn" data-w="2" onclick="setWidth(this)"><span class="width-line" style="height:5px"></span></button>
    </div>
  </div>

  <button id="eraserBtn" class="tool" onclick="setMode('eraser')" title="消しゴム" aria-label="消しゴム">◇</button>
  <button class="tool" onclick="undoLast()" title="戻す" aria-label="戻す">↶</button>
  <button id="stampBtn" class="tool" onclick="setMode('stamp')" title="スタンプ" aria-label="スタンプ">♙</button>

  <div id="syncStatus" class="status">接続準備中</div>
</div>
</div>
<script>
const C=window.TAJIMA_CONFIG||window.CONFIG||{},SUPABASE_URL=C.SUPABASE_URL||"",SUPABASE_KEY=C.SUPABASE_PUBLISHABLE_KEY||C.SUPABASE_ANON_KEY||C.SUPABASE_KEY||"";

const APP_VERSION="0.23";
async function checkAppVersion(){
  try{
    const r=await fetch(`version.json?ts=${Date.now()}`,{cache:"no-store"});
    if(!r.ok)return;
    const v=await r.json();
    const latest=String(v.version||"").trim();
    if(latest && latest!==APP_VERSION){
      const u=new URL(location.href);
      u.searchParams.set("v",latest);
      u.searchParams.set("_r",Date.now());
      location.replace(u.toString());
    }
  }catch(e){console.warn("version check failed",e)}
}
checkAppVersion();
setInterval(checkAppVersion,60000);

const ok=()=>SUPABASE_URL&&SUPABASE_KEY;
let sb=null,strokeChannel=null,stampChannel=null,strokes=[],stamps=[],mode="pen",color="#111111",width=1.3,drawing=false,currentPoints=[];
let nowClock=new Date(),boardY=nowClock.getFullYear(),boardM=nowClock.getMonth()+1,lastSystemYM=`${nowClock.getFullYear()}-${nowClock.getMonth()+1}`;
const c=document.getElementById("drawCanvas"),ctx=c.getContext("2d"),sc=document.getElementById("stampCanvas"),sctx=sc.getContext("2d"),statusEl=document.getElementById("syncStatus"),monitorFrame=document.getElementById("monitorFrame");

function boardMonth(){return `${boardY}-${String(boardM).padStart(2,"0")}`}
function refreshBoardMonth(){boardMonthLabel.textContent=`${boardM}月`;monitorFrame.src=`monitor.html?v=0.23&penboard=1&year=${boardY}&month=${boardM}`}
function sizeCanvas(el,context){const r=el.getBoundingClientRect(),dpr=devicePixelRatio||1;el.width=Math.max(1,Math.round(r.width*dpr));el.height=Math.max(1,Math.round(r.height*dpr));context.setTransform(dpr,0,0,dpr,0,0)}
function resize(){sizeCanvas(c,ctx);sizeCanvas(sc,sctx);redraw();redrawStamps()}
function xy(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
function screenPoint(p){const r=c.getBoundingClientRect();return [p[0]*r.width,p[1]*r.height]}
function drawStroke(s){const pts=s.points||[];if(pts.length<2)return;ctx.save();ctx.strokeStyle=s.stroke_color||"#111";ctx.lineWidth=Number(s.stroke_width)||1.3;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();let [x0,y0]=screenPoint(pts[0]);ctx.moveTo(x0,y0);if(pts.length===2){let [x,y]=screenPoint(pts[1]);ctx.lineTo(x,y)}else{for(let i=1;i<pts.length-1;i++){let [x,y]=screenPoint(pts[i]),[nx,ny]=screenPoint(pts[i+1]);ctx.quadraticCurveTo(x,y,(x+nx)/2,(y+ny)/2)}let [lx,ly]=screenPoint(pts[pts.length-1]);ctx.lineTo(lx,ly)}ctx.stroke();ctx.restore()}
function redraw(extra=null){const r=c.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);strokes.filter(s=>!s.deleted).forEach(drawStroke);if(extra&&extra.length>1)drawStroke({points:extra,stroke_color:color,stroke_width:width})}
function redrawStamps(){const r=sc.getBoundingClientRect();sctx.clearRect(0,0,r.width,r.height);stamps.filter(x=>!x.deleted).forEach(st=>{const x=st.x_norm*r.width,y=st.y_norm*r.height;sctx.save();sctx.translate(x,y);sctx.rotate(-0.12);sctx.strokeStyle="#b91c1c";sctx.fillStyle="rgba(255,255,255,.76)";sctx.lineWidth=4/3;sctx.beginPath();sctx.arc(0,0,16,0,Math.PI*2);sctx.fill();sctx.stroke();sctx.fillStyle="#b91c1c";sctx.font="900 10px Yu Gothic";sctx.textAlign="center";sctx.textBaseline="middle";sctx.fillText("出荷",0,0);sctx.restore()})}
function closeToolMenus(){colorMenu.classList.remove("open");widthMenu.classList.remove("open")}
function toggleColorMenu(e){e.stopPropagation();widthMenu.classList.remove("open");colorMenu.classList.toggle("open")}
function toggleWidthMenu(e){e.stopPropagation();colorMenu.classList.remove("open");widthMenu.classList.toggle("open")}
document.addEventListener("click",closeToolMenus);
colorMenu.addEventListener("click",e=>e.stopPropagation());
widthMenu.addEventListener("click",e=>e.stopPropagation());
function setMode(v){mode=v;closeToolMenus();penBtn.classList.toggle("active",v==="pen");eraserBtn.classList.toggle("active",v==="eraser");stampBtn.classList.toggle("stamp-active",v==="stamp");c.classList.toggle("eraser-cursor",v==="eraser");c.classList.toggle("stamp-cursor",v==="stamp")}
function setColor(el){color=el.dataset.c;document.querySelectorAll(".color").forEach(x=>x.classList.toggle("sel",x===el));colorCurrent.style.background=color;setMode("pen")}
function setWidth(el){width=Number(el.dataset.w);document.querySelectorAll(".widthbtn").forEach(x=>x.classList.toggle("sel",x===el));widthCurrent.style.height=width===0.8?"1px":width===1.3?"3px":"5px";setMode("pen")}
function distToSeg(px,py,x1,y1,x2,y2){const A=px-x1,B=py-y1,C=x2-x1,D=y2-y1,den=C*C+D*D;let t=den?Math.max(0,Math.min(1,(A*C+B*D)/den)):0;const x=x1+t*C,y=y1+t*D,dx=px-x,dy=py-y;return Math.sqrt(dx*dx+dy*dy)}
function hitStroke(p){const [px,py]=screenPoint(p);for(let si=strokes.length-1;si>=0;si--){const s=strokes[si];if(s.deleted)continue;const pts=s.points||[];for(let i=0;i<pts.length-1;i++){const [x1,y1]=screenPoint(pts[i]),[x2,y2]=screenPoint(pts[i+1]);if(distToSeg(px,py,x1,y1,x2,y2)<10)return s}}return null}
function hitStamp(p){const r=c.getBoundingClientRect(),px=p[0]*r.width,py=p[1]*r.height;for(let i=stamps.length-1;i>=0;i--){const st=stamps[i];if(st.deleted)continue;const x=st.x_norm*r.width,y=st.y_norm*r.height;if(Math.hypot(px-x,py-y)<30)return st}return null}
async function markStrokeDeleted(s){if(!s||s.deleted)return;s.deleted=true;redraw();if(s.id){const {error}=await sb.from("schedule_pen_strokes").update({deleted:true,updated_at:new Date().toISOString()}).eq("id",s.id);if(error){s.deleted=false;redraw();statusEl.textContent="削除エラー"}}}
async function markStampDeleted(s){if(!s||s.deleted)return;s.deleted=true;redrawStamps();if(s.id){const {error}=await sb.from("schedule_pen_stamps").update({deleted:true,updated_at:new Date().toISOString()}).eq("id",s.id);if(error){s.deleted=false;redrawStamps();statusEl.textContent="削除エラー"}}}
async function undoLast(){const candidates=[...strokes.filter(x=>!x.deleted).map(x=>({...x,_kind:"stroke"})),...stamps.filter(x=>!x.deleted).map(x=>({...x,_kind:"stamp"}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const x=candidates[0];if(!x)return;if(x._kind==="stroke")await markStrokeDeleted(strokes.find(s=>Number(s.id)===Number(x.id))||strokes.find(s=>s.created_at===x.created_at));else await markStampDeleted(stamps.find(s=>Number(s.id)===Number(x.id)))}
async function clearAllBoard(){if(!confirm("今月の手書きと印鑑をすべて消しますか？"))return;const [strokeResult,stampResult]=await Promise.all([sb.from("schedule_pen_strokes").update({deleted:true,updated_at:new Date().toISOString()}).eq("board_month",boardMonth()).eq("deleted",false),sb.from("schedule_pen_stamps").update({deleted:true,updated_at:new Date().toISOString()}).eq("board_month",boardMonth()).eq("deleted",false)]);if(strokeResult.error||stampResult.error){console.error("全消去エラー",strokeResult.error,stampResult.error);statusEl.textContent="全消去エラー";await loadAll();return}await loadAll()}
async function placeStamp(p){const local={id:null,board_month:boardMonth(),x_norm:p[0],y_norm:p[1],deleted:false,created_at:new Date().toISOString()};stamps.push(local);redrawStamps();const {data,error}=await sb.from("schedule_pen_stamps").insert({board_month:local.board_month,x_norm:local.x_norm,y_norm:local.y_norm}).select().single();if(error){stamps=stamps.filter(x=>x!==local);redrawStamps();statusEl.textContent="印鑑保存エラー";return}const serverCopy=stamps.find(x=>x!==local&&Number(x.id)===Number(data.id));if(serverCopy){stamps=stamps.filter(x=>x!==local)}else{local.id=data.id;local.created_at=data.created_at}redrawStamps()}

c.addEventListener("pointerdown",async e=>{c.setPointerCapture?.(e.pointerId);const p=xy(e);if(mode==="eraser"){const st=hitStamp(p);if(st){await markStampDeleted(st);return}const s=hitStroke(p);if(s)await markStrokeDeleted(s);return}if(mode==="stamp"){await placeStamp(p);return}drawing=true;currentPoints=[p];redraw(currentPoints)});
c.addEventListener("pointermove",e=>{if(!drawing||mode!=="pen")return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs){const p=xy(ev),l=currentPoints[currentPoints.length-1];if(!l||Math.hypot((p[0]-l[0])*innerWidth,(p[1]-l[1])*innerHeight)>1.2)currentPoints.push(p)}requestAnimationFrame(()=>redraw(currentPoints))});
async function finish(){if(!drawing)return;drawing=false;if(currentPoints.length<2){currentPoints=[];redraw();return}const local={id:null,board_month:boardMonth(),points:currentPoints.slice(),stroke_color:color,stroke_width:width,deleted:false,created_at:new Date().toISOString()};strokes.push(local);currentPoints=[];redraw();const {data,error}=await sb.from("schedule_pen_strokes").insert({board_month:local.board_month,points:local.points,stroke_color:local.stroke_color,stroke_width:local.stroke_width}).select().single();if(error){strokes=strokes.filter(x=>x!==local);redraw();statusEl.textContent="保存エラー";return}const serverCopy=strokes.find(x=>x!==local&&Number(x.id)===Number(data.id));if(serverCopy){strokes=strokes.filter(x=>x!==local)}else{local.id=data.id;local.created_at=data.created_at}redraw()}
c.addEventListener("pointerup",finish);c.addEventListener("pointercancel",finish);

async function loadAll(){const [a,b]=await Promise.all([sb.from("schedule_pen_strokes").select("*").eq("board_month",boardMonth()).order("created_at"),sb.from("schedule_pen_stamps").select("*").eq("board_month",boardMonth()).order("created_at")]);if(a.error||b.error){statusEl.textContent="読込エラー";return}strokes=a.data||[];stamps=b.data||[];redraw();redrawStamps()}
async function restartRealtime(){if(!sb)return;if(strokeChannel)await sb.removeChannel(strokeChannel);if(stampChannel)await sb.removeChannel(stampChannel);await loadAll();strokeChannel=sb.channel("pen-"+boardMonth()).on("postgres_changes",{event:"*",schema:"public",table:"schedule_pen_strokes",filter:`board_month=eq.${boardMonth()}`},p=>{const r=p.new||p.old;if(!r)return;const i=strokes.findIndex(x=>Number(x.id)===Number(r.id));if(p.eventType==="INSERT"){if(i<0)strokes.push(r);else strokes[i]=r}else if(p.eventType==="UPDATE"){if(i>=0)strokes[i]=r;else strokes.push(r)}else if(p.eventType==="DELETE"&&i>=0)strokes.splice(i,1);redraw()}).subscribe(state=>{if(state==="SUBSCRIBED")statusEl.textContent="Realtime 接続済み"});stampChannel=sb.channel("stamp-"+boardMonth()).on("postgres_changes",{event:"*",schema:"public",table:"schedule_pen_stamps",filter:`board_month=eq.${boardMonth()}`},p=>{const r=p.new||p.old;if(!r)return;const i=stamps.findIndex(x=>Number(x.id)===Number(r.id));if(p.eventType==="INSERT"){if(i<0)stamps.push(r);else stamps[i]=r}else if(p.eventType==="UPDATE"){if(i>=0)stamps[i]=r;else stamps.push(r)}else if(p.eventType==="DELETE"&&i>=0)stamps.splice(i,1);redrawStamps()}).subscribe()}
async function changeBoardMonth(d){boardM+=d;if(boardM<1){boardM=12;boardY--}if(boardM>12){boardM=1;boardY++}refreshBoardMonth();await restartRealtime()}
async function goBoardCurrentMonth(){const d=new Date();boardY=d.getFullYear();boardM=d.getMonth()+1;refreshBoardMonth();await restartRealtime()}
function autoBoardMonthCheck(){const d=new Date(),sys=`${d.getFullYear()}-${d.getMonth()+1}`;if(sys!==lastSystemYM){lastSystemYM=sys;boardY=d.getFullYear();boardM=d.getMonth()+1;refreshBoardMonth();restartRealtime()}}
async function start(){if(!window.supabase||!ok()){statusEl.textContent="configエラー";return}try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{realtime:{params:{eventsPerSecond:20}}});await restartRealtime()}catch(err){console.error(err);statusEl.textContent="接続エラー"}}
addEventListener("resize",resize);refreshBoardMonth();resize();start();setInterval(autoBoardMonthCheck,60000);
</script></body></html>
