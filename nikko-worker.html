<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b86"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ニッコー 作業"><link rel="manifest" href="manifest-nikko.json"><link rel="apple-touch-icon" href="nikko-icon.svg"><title>ニッコー 作業画面</title><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#16233d;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));max-width:860px;margin:auto}.head{background:#173b86;color:#fff;border-radius:16px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.head strong{font-size:22px}.sub{display:block;font-size:12px;opacity:.86;margin-top:3px}.head-right{display:flex;align-items:center;gap:10px}.sync{font-size:12px;text-align:right}.head button{border:1px solid #ffffff99;background:#ffffff1f;color:white;border-radius:10px;padding:8px;font-weight:900}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.tabs button{border:2px solid #bfdbfe;background:white;border-radius:12px;padding:12px;color:#173b86;font-size:16px;font-weight:900}.tabs button.selected{background:#173b86;color:white}.tabs small,.btn small{display:block;font-size:11px;font-weight:500;margin-top:3px}.count{font-weight:900;color:#173b86;margin:8px 3px 14px}.product{background:white;border:2px solid #bfdbfe;border-radius:16px;margin:12px 0;overflow:hidden}.product-head{background:white;color:#16233d;border:0;width:100%;padding:14px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px}.product-head strong{font-size:20px;color:#173b86;overflow-wrap:anywhere}.product-head small{display:block;color:#64748b;margin-top:4px}.product-head .state{white-space:nowrap;text-align:right;font-size:12px;font-weight:900;color:#166534}.product-body{background:#f4f8ff;padding:4px 11px 11px}.job{background:white;border:2px solid #bfdbfe;border-radius:14px;margin-top:9px;padding:13px}.job.running{border-left:8px solid #16a34a}.job.done{border-color:#cbd5e1}.job-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.part{font-size:20px;font-weight:900;color:#173b86;overflow-wrap:anywhere}.badge{border-radius:999px;padding:5px 9px;background:#e2e8f0;white-space:nowrap;font-size:11px;font-weight:900}.badge.running{background:#dcfce7;color:#166534}.badge.done{background:#dbeafe;color:#1e40af}.meta{font-size:12px;color:#64748b;margin:6px 0}.actions{display:flex;gap:8px;margin-top:11px}.btn{flex:1;border:0;border-radius:11px;padding:12px;color:#fff;font-weight:900;font-size:17px}.btn.start{background:#2563eb}.btn.finish{background:#16834b}.btn.stop{background:#64748b}.empty,.error{border:2px solid #bfdbfe;border-radius:14px;background:white;padding:26px 12px;text-align:center;margin-top:12px}.error{border-color:#fecaca;color:#991b1b}.foot{text-align:center;color:#64748b;font-size:11px;margin:15px 0}.busy main,.busy .tabs{opacity:.5;pointer-events:none}.overlay{position:fixed;inset:0;background:#17264199;display:grid;place-items:center;padding:15px;z-index:50}.dialog{background:white;border-radius:17px;padding:18px;width:min(100%,510px)}.dialog h2{margin:0;color:#173b86;font-size:21px}.dialog p{color:#64748b;font-size:13px;margin:6px 0 12px}.choice{display:flex;gap:11px;align-items:center;padding:12px;border:2px solid #bfdbfe;border-radius:12px;margin:8px 0}.choice input{width:22px;height:22px;flex:none}.choice span{overflow-wrap:anywhere}.dialog-actions{display:flex;gap:8px;margin-top:12px}.dialog-actions button{flex:1;padding:11px;border:0;border-radius:10px;font-weight:900}.dialog-actions .cancel{background:#e2e8f0;color:#16233d}.dialog-actions .confirm{background:#2563eb;color:#fff}
</style></head><body><header class="head"><div><strong>ニッコー　作業</strong><small class="sub">Công việc Nikko · v11.38.0</small></div><div class="head-right"><button onclick="manualRefresh()">更新<small class="sub">Làm mới</small></button><div class="sync" id="syncText">読込中<br>Đang tải</div></div></header><nav class="tabs"><button id="activeTab" class="selected" onclick="setView('active')">作業一覧<small>Danh sách công việc</small></button><button id="doneTab" onclick="setView('done')">完了確認<small>Kiểm tra hoàn thành</small></button></nav><div class="count" id="runningCount"></div><main id="app"><div class="empty">読込中…<br>Đang tải…</div></main><div id="dialogHost"></div><footer class="foot">画面は自動更新されます<br>Màn hình tự động cập nhật</footer>
<script>
const CONFIG=window.TAJIMA_CONFIG||{},API=`${CONFIG.SUPABASE_URL||""}/rest/v1/nikko_work_items`,KEY=CONFIG.SUPABASE_KEY||"";let rows=[],saving=false,view="active";
const n=v=>Number(v)||0,esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;"),headers=()=>({apikey:KEY,Authorization:`Bearer ${KEY}`,"Content-Type":"application/json",Prefer:"return=representation"}),key=name=>"tajima_nikko_worker_"+name;
async function getLatest(){const response=await fetch(`${API}?select=*&order=sort_order.asc,id.asc`,{headers:headers(),cache:"no-store"});if(!response.ok)throw new Error(await response.text());return response.json()}
async function load(){if(saving)return;try{rows=await getLatest();draw();syncText.innerHTML=`${new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}<br>Đã cập nhật`}catch(err){app.innerHTML=`<div class="error">データを読み込めません<br>Không thể tải dữ liệu<br><small>${esc(err.message)}</small></div>`}}
function setView(next){view=next;activeTab.classList.toggle("selected",view==="active");doneTab.classList.toggle("selected",view==="done");draw()}
function isGroupOpen(name,items){const saved=localStorage.getItem(key(name));return saved===null?view==="active"&&items.some(x=>x.status==="running"):saved==="yes"}
function toggleGroup(token){const name=decodeURIComponent(token),items=rows.filter(x=>x.product_name===name&&(view==="done"?x.status==="completed":x.status!=="completed"));localStorage.setItem(key(name),isGroupOpen(name,items)?"no":"yes");draw()}
function draw(){
  const count=rows.filter(x=>x.status==="running").length;runningCount.textContent=`進行中 ${count} / 2 · Đang thực hiện ${count} / 2`;
  const shown=rows.filter(x=>view==="done"?x.status==="completed":x.status!=="completed"),groups=new Map();
  for(const item of shown){if(!groups.has(item.product_name))groups.set(item.product_name,[]);groups.get(item.product_name).push(item)}
  const entries=[...groups.entries()].sort((a,b)=>Math.min(...a[1].map(x=>n(x.sort_order)))-Math.min(...b[1].map(x=>n(x.sort_order)))||a[0].localeCompare(b[0],"ja"));
  app.innerHTML=entries.length?entries.map(([name,items])=>{
    items.sort((a,b)=>n(a.sort_order)-n(b.sort_order)||n(a.id)-n(b.id));
    const open=isGroupOpen(name,items),numRunning=items.filter(x=>x.status==="running").length;
    return `<section class="product"><button class="product-head" onclick="toggleGroup('${encodeURIComponent(name).replaceAll("'","%27")}')"><span><strong>${esc(name)}</strong><small>${items.length}件 · ${items.length} mã sản phẩm</small></span><span class="state">${numRunning&&view==="active"?`● 進行中 ${numRunning}件<br>Đang thực hiện: ${numRunning}`:""}<br>${open?"▲":"▼"}</span></button>${open?`<div class="product-body">${items.map(x=>`<article class="job ${x.status==="running"?"running":x.status==="completed"?"done":""}"><div class="job-top"><div><div class="part">${esc(x.part_no)}</div><div class="meta">${esc(name)}</div></div><span class="badge ${x.status==="running"?"running":x.status==="completed"?"done":""}">${x.status==="running"?"進行中 · Đang thực hiện":x.status==="completed"?"完了 · Hoàn thành":"作業待ち · Đang chờ"}</span></div>${x.status==="completed"?`<div class="meta">完了日時 ${esc(x.completed_at?new Date(x.completed_at).toLocaleString("ja-JP"):"日時不明")} · Thời gian hoàn thành</div>`:x.status==="running"?`<div class="actions"><button class="btn finish" onclick="finishWork(${x.id})">作業完了<small>Hoàn thành</small></button><button class="btn stop" onclick="stopWork(${x.id})">作業停止<small>Tạm dừng</small></button></div>`:`<div class="actions"><button class="btn start" onclick="startWork(${x.id})">作業開始<small>Bắt đầu làm việc</small></button></div>`}</article>`).join("")}</div>`:""}</section>`;
  }).join(""):view==="done"?'<div class="empty">完了した品番はありません<br>Chưa có mã sản phẩm hoàn thành</div>':'<div class="empty">作業待ちの品番はありません<br>Không có mã sản phẩm đang chờ</div>';
}
async function patch(id,value,expected){const r=await fetch(`${API}?id=eq.${id}&status=eq.${expected}`,{method:"PATCH",headers:headers(),body:JSON.stringify({...value,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error(await r.text());if(!(await r.json()).length)throw new Error("作業状況が変更されました。更新してください。 / Trạng thái đã thay đổi. Hãy làm mới.")}
function chooseReplacement(items,target){return new Promise(resolve=>{dialogHost.innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>どの作業と交代しますか？</h2><p>${esc(target.product_name)} · ${esc(target.part_no)}<br>Chọn công việc cần thay thế</p>${items.map(x=>`<label class="choice"><input type="radio" name="replacement" value="${x.id}"><span><strong>${esc(x.product_name)}</strong><br>${esc(x.part_no)}</span></label>`).join("")}<div class="dialog-actions"><button class="cancel" id="cancelReplace">取消<small> Hủy</small></button><button class="confirm" id="confirmReplace">交代して開始<small> Thay thế và bắt đầu</small></button></div></div></div>`;const close=id=>{dialogHost.innerHTML="";resolve(id)};cancelReplace.onclick=()=>close(null);confirmReplace.onclick=()=>{const selected=dialogHost.querySelector('input[name="replacement"]:checked');if(!selected){alert("交代する作業を選んでください。 / Hãy chọn công việc cần thay thế.");return}close(n(selected.value))}})}
async function startWork(id){if(saving)return;saving=true;document.body.classList.add("busy");try{const latest=await getLatest(),target=latest.find(x=>n(x.id)===n(id));if(!target||target.status!=="waiting")return;const running=latest.filter(x=>x.status==="running");if(running.length>=2){const chosen=await chooseReplacement(running,target);if(!chosen)return;const fresh=await getLatest();if(fresh.find(x=>n(x.id)===n(id))?.status!=="waiting"||fresh.find(x=>n(x.id)===chosen)?.status!=="running")throw new Error("作業状況が変更されました。更新してください。 / Trạng thái đã thay đổi. Hãy làm mới.");await patch(chosen,{status:"waiting"},"running")}await patch(id,{status:"running",started_at:new Date().toISOString()},"waiting")}catch(err){alert("更新エラー / Lỗi cập nhật\n"+err.message)}finally{saving=false;document.body.classList.remove("busy");await load()}}
async function stopWork(id){if(saving)return;if(!confirm("この作業を停止しますか？\n\nTạm dừng công việc này?"))return;saving=true;document.body.classList.add("busy");try{await patch(id,{status:"waiting"},"running")}catch(err){alert("更新エラー / Lỗi cập nhật\n"+err.message)}finally{saving=false;document.body.classList.remove("busy");await load()}}
async function finishWork(id){if(saving)return;if(!confirm("この品番の作業を完了しますか？\n\nXác nhận hoàn thành mã sản phẩm này?"))return;saving=true;document.body.classList.add("busy");try{await patch(id,{status:"completed",completed_at:new Date().toISOString()},"running")}catch(err){alert("更新エラー / Lỗi cập nhật\n"+err.message)}finally{saving=false;document.body.classList.remove("busy");await load()}}
async function manualRefresh(){syncText.innerHTML="更新中…<br>Đang làm mới…";await load()}
let pullStart=0,pullDistance=0,pulling=false;addEventListener("touchstart",ev=>{if(scrollY===0&&ev.touches.length===1){pullStart=ev.touches[0].clientY;pullDistance=0;pulling=true}},{passive:true});addEventListener("touchmove",ev=>{if(pulling)pullDistance=ev.touches[0].clientY-pullStart},{passive:true});addEventListener("touchend",async()=>{if(!pulling)return;const refresh=pullDistance>80&&scrollY===0;pulling=false;pullDistance=0;if(refresh)await manualRefresh()},{passive:true});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});load();setInterval(load,10000);
</script></body></html>
