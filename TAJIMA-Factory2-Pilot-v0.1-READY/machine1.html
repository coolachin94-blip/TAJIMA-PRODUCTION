<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TAJIMA 第2工場 一号機 v1.4</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TAJIMA 1号機">
<meta name="theme-color" content="#102b4e">
<link rel="manifest" href="manifest-machine1.json">

<link rel="stylesheet" href="common.css">
<style>
  .home{grid-template-columns:1fr 1fr}
  .big{min-height:110px;font-size:20px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .toolbar input{flex:1;min-width:180px}
  .tool-table{width:100%;border-collapse:separate;border-spacing:0 7px}
  .tool-table th{font-size:12px;color:#64748b;text-align:left;padding:0 8px 3px}
  .tool-row td{background:#fff;border-top:1px solid #d7e0eb;border-bottom:1px solid #d7e0eb;padding:6px 8px}
  .tool-row td:first-child{border-left:1px solid #d7e0eb;border-radius:10px 0 0 10px;width:86px}
  .tool-row td:last-child{border-right:1px solid #d7e0eb;border-radius:0 10px 10px 0;width:120px}
  .tbtn{width:68px;padding:10px 6px;background:#102b4e;color:#fff}
  .tool-name{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
  .tool-name:focus{outline:2px solid #93c5fd;border-color:#2563eb}
  .status{font-size:12px;font-weight:800}
  .status.warn{color:#c2410c}
  .status.ok{color:#15803d}
  .tool-row.attn td{background:#fff7ed}
  .tool-row.away td{background:#fffbea}
  .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
  .action-btn{min-height:54px;font-size:16px}
  .jobs .btn{width:100%;text-align:left;margin-top:7px}
  select,input{font:inherit}
  .form-control{width:100%;padding:11px;margin:6px 0;border:1px solid #ccd5e1;border-radius:9px}
  #modal{position:fixed;bottom:8px;left:8px;right:8px;max-width:680px;margin:auto;z-index:20;border:2px solid #102b4e;box-shadow:0 10px 30px #0003}
  @media(max-width:650px){
    .home{grid-template-columns:1fr}
    .big{min-height:88px}
    .tool-row td:first-child{width:76px}
    .tool-row td:last-child{width:88px}
    .tbtn{width:60px}
    .actions{grid-template-columns:1fr 1fr}
    .wrap{padding:8px}
  }

  body{font-size:18px}
  .wrap{max-width:1200px;padding:16px}
  .big{min-height:132px;font-size:26px;border-radius:16px}
  .btn{font-size:18px;padding:16px 18px;border-radius:14px}
  .toolbar{gap:12px}
  .form-control{min-height:58px;font-size:20px;padding:14px 16px}
  .tool-table{border-spacing:0 11px}
  .tool-table th{font-size:15px;padding:0 10px 5px}
  .tool-row td{padding:10px 12px}
  .tool-row td:first-child{width:120px}
  .tool-row td:last-child{width:170px}
  .tbtn{width:96px;min-height:64px;font-size:22px}
  .tool-name{min-height:60px;font-size:20px;padding:14px}
  .status{font-size:16px}
  .actions{gap:12px}
  .action-btn{min-height:72px;font-size:20px}
  .panel-head{display:flex;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:56px;z-index:4;background:#f3f6fb;padding:8px 0 10px}
  .back-big{min-width:150px;min-height:58px;background:#102b4e;color:white;font-size:19px}
  .jobs .btn{min-height:62px;font-size:20px;padding:16px}
  .jobs{display:grid;gap:10px}
  @media(max-width:700px){
    body{font-size:17px}.wrap{padding:10px}.big{min-height:112px;font-size:23px}
    .tool-row td:first-child{width:105px}.tool-row td:last-child{width:135px}
    .tbtn{width:84px;min-height:62px;font-size:21px}.tool-name{min-height:58px;font-size:19px}
    .action-btn{min-height:68px;font-size:19px}.back-big{min-width:130px}
  }


  /* v0.5 dedicated iPad terminal feel */
  html,body{overscroll-behavior:none}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,select,textarea{ -webkit-user-select:text; user-select:text }
  @media (display-mode: standalone){
    .top{padding-top:calc(14px + env(safe-area-inset-top))}
    .wrap{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  }


  .last-change{font-size:15px;font-weight:700;line-height:1.35;white-space:nowrap}
  .last-change .kind{display:block;color:#334155}
  .last-change .when{display:block;color:#64748b;font-size:14px;margin-top:2px}
  .last-change.none{color:#94a3b8;font-weight:600}
  .tool-table th:nth-child(3),.tool-row td:nth-child(3){width:190px}
  @media(max-width:700px){
    .tool-table th:nth-child(3),.tool-row td:nth-child(3){width:160px}
    .last-change{font-size:14px}.last-change .when{font-size:13px}
  }

  .usage-box{
    margin-top:14px;padding:14px;border:1px solid #cbd5e1;border-radius:14px;background:#f8fafc
  }
  .usage-label{font-size:17px;font-weight:900;margin-bottom:8px;color:#102b4e}
  .auto-usage{padding:16px;border:1px solid #bfdbfe;border-radius:14px;background:linear-gradient(145deg,#f8fbff,#eff6ff)}.usage-tags{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}.usage-tag{display:inline-flex;padding:8px 11px;border-radius:10px;background:#fff;border:1px solid #bfdbfe;color:#102b4e;font-weight:900}.usage-meter-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:8px}.usage-count{font-size:28px;font-weight:900;color:#102b4e}.usage-target{font-size:14px;color:#64748b;font-weight:800}.usage-meter{height:18px;background:#dbe5f1;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(15,23,42,.12)}.usage-meter-fill{height:100%;width:0;border-radius:999px;transition:width .25s ease,background .25s ease}

  .process-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .process-choice{min-height:100px;font-size:24px;font-weight:900}
  .process-choice.warn{border:2px solid #f59e0b}
  .register-big{width:100%;min-height:88px;font-size:26px}
  .worker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.worker-btn{min-height:62px;font-size:19px;font-weight:900}.worker-btn.selected{background:#2563eb;color:#fff;border-color:#2563eb}.pull-indicator{position:fixed;top:8px;left:50%;transform:translate(-50%,-70px);z-index:50;background:#102b4e;color:#fff;border-radius:999px;padding:10px 18px;font-weight:900;transition:transform .18s}.pull-indicator.show{transform:translate(-50%,0)}.undo-bar{position:fixed;left:10px;right:10px;bottom:10px;max-width:760px;margin:auto;z-index:25;background:#fff;border:2px solid #2563eb;border-radius:15px;padding:13px;box-shadow:0 10px 30px #0004}.undo-row{display:flex;gap:10px;align-items:center}.undo-row>div{flex:1}.daily-overlay{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;padding:16px}.daily-card{width:min(720px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 20px 55px #0006}.daily-title{font-size:28px;font-weight:900;color:#102b4e;text-align:center}.daily-worker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.daily-confirm{width:100%;min-height:76px;font-size:23px}
  @media(max-width:800px){.process-grid{grid-template-columns:repeat(2,1fr)}.worker-grid,.daily-worker-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="top">
  <div><b>TAJIMA 第2工場　<span id="machineNameTop">1号機</span></b><div class="muted" style="color:#cbd5e1">現場タブレット</div></div>
  <span>PILOT v1.4</span>
</div>
<div id="pullIndicator" class="pull-indicator">↓ 引っ張って更新</div>

<div class="wrap">
  <div id="err" class="card alert hidden"></div>

  <div id="home" class="grid home">
    <button class="card btn big" onclick="openPanel('tools')">🔧 工具管理 <b id="ta"></b></button>
    <button class="card btn primary big" onclick="openPanel('process')">▶ 作業登録</button>
  </div>

  <section id="tools" class="hidden">
    <div class="panel-head">
      <button class="btn back-big" onclick="openPanel('home')">← 戻る</button>
      <div class="title" style="font-size:22px"><span id="machineNameTools">1号機</span> 工具管理</div>
    </div>
    <div class="card">
      <div class="title">T1〜T80 工具一覧</div>
      <div class="muted">工具名はその場で入力・変更。T番号を押すと交換・移動などのクイック登録が開きます。</div>
      <div class="toolbar" style="margin-top:12px">
        <input id="search" class="form-control" placeholder="T番号 / 工具名で検索" oninput="renderTools()">
      </div>
    </div>

    <div style="overflow:auto">
      <table class="tool-table">
        <thead><tr><th>T番号</th><th>工具名</th><th>最終交換</th><th>状態</th></tr></thead>
        <tbody id="toolList"></tbody>
      </table>
    </div>
  </section>

  <section id="process" class="hidden">
    <div class="panel-head">
      <button class="btn back-big" onclick="processBack()">← 戻る</button>
      <div class="title" style="font-size:22px"><span id="machineNameWork">1号機</span> 作業登録</div>
    </div>
    <div class="card"><div class="title" id="processTitle">製品を選択</div><div class="muted" id="processGuide">管理ページで登録された製品だけ表示します。</div></div>
    <div id="processButtons" class="process-grid"></div>
    <div id="registerCard" class="card hidden">
      <div id="registerSummary" class="title"></div>
      <div class="usage-label" style="margin-top:14px">作業者を選択</div><div id="workWorkerButtons" class="worker-grid"></div>
      <label style="display:block;margin:14px 0"><input style="width:auto;transform:scale(1.5);margin-right:10px" type="checkbox" id="variation"> ⚠ 変動事項あり</label>
      <button class="btn primary register-big" onclick="registerWork()" disabled>この作業を登録</button>
    </div>
  </section>

  <div id="modal" class="card hidden">
    <div id="mt" class="title" style="font-size:18px"></div>
    <div id="ms" class="muted"></div>
    <div class="actions">
      <button class="btn primary action-btn" onclick="toolAction('工具交換')">🔄 工具交換</button>
      <button class="btn primary action-btn" onclick="toolAction('チップ交換')">🧩 チップ交換</button>
      <button class="btn warn action-btn" onclick="toolAction('注意事項')">⚠ 注意事項</button>
      <button class="btn action-btn" onclick="moveTool()">↗ 他機械へ移動</button>
      <button class="btn action-btn" onclick="clearAttention()">✓ 注意解除</button>
      <button class="btn action-btn" onclick="document.getElementById('modal').classList.add('hidden')">✕ 閉じる</button>
    </div>
    <div class="usage-box">
      <div class="auto-usage"><div class="usage-label">使用対象</div><div id="autoUsageList" class="usage-tags"><span class="usage-tag">未設定</span></div><div class="usage-meter-head"><div><span id="toolUseCount" class="usage-count">0</span><span class="usage-target"> 回 / 目標 <span id="toolUseTarget">50</span>回</span></div><span id="toolUsePercent" class="usage-target">0%</span></div><div class="usage-meter"><div id="toolUseMeter" class="usage-meter-fill"></div></div></div>
    </div>
  </div>
  <div id="undoBar" class="undo-bar hidden"><div class="undo-row"><div><b>作業を登録しました</b><div id="undoSummary" class="muted"></div></div><button class="btn warn" onclick="cancelLastWork()">直前の登録を取消</button></div></div>
</div>

<div id="dailyCheckModal" class="daily-overlay hidden"><div class="daily-card"><div class="daily-title">本日の工具を確認しましたか？</div><div class="muted" style="text-align:center;margin-top:7px">確認した作業者を選択してください</div><div id="dailyWorkerButtons" class="daily-worker-grid"></div><button id="dailyConfirmBtn" class="btn primary daily-confirm" onclick="confirmDailyToolCheck()" disabled>本日の工具確認を登録</button></div></div>

<script src="config.js"></script>
<script>
const Q=new URLSearchParams(location.search),M=Number(1);
const U=window.TAJIMA_SUPABASE_URL,K=window.TAJIMA_SUPABASE_ANON_KEY;
let MACHINE_NAME=M+"号機";
const H={"apikey":K,"Authorization":"Bearer "+K,"Content-Type":"application/json","Prefer":"return=representation"};
let toolData=[],toolLogs=[],sel=null,products=[],processMaster=[],processRoutes=[],processItems=[],processLogs=[],machineProcessAssignments=[],toolProcessAssignments=[],toolUsageLogs=[],workers=[],toolCheckSetting=null,dailyToolChecks=[],chosenProduct=null,chosenProcess=null,chosenItem=null,selectedWorkWorker=null,selectedDailyWorker=null,lastRegistered=null,undoTimer=null,pullStart=null;

async function api(p,o={}){
  let r=await fetch(U+"/rest/v1/"+p,{...o,headers:{...H,...(o.headers||{})}});
  if(!r.ok) throw Error(await r.text());
  let t=await r.text(); return t?JSON.parse(t):[];
}
async function apiAll(p){let out=[],offset=0;for(;;){let a=await api(`${p}${p.includes("?")?"&":"?"}limit=1000&offset=${offset}`);out.push(...a);if(a.length<1000)return out;offset+=1000}}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function fail(e){const box=document.getElementById("err");box.textContent="通信エラー: "+e.message;box.classList.remove("hidden")}
function fmtToolTime(v){
  if(!v)return "";
  const d=new Date(v);
  const p=n=>String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function lastChangeFor(toolId){
  return toolLogs.find(x=>x.tool_id==toolId && (x.action==="工具交換" || x.action==="チップ交換")) || null;
}
function openPanel(x){
  document.getElementById("home").classList.toggle("hidden",x!=="home");
  document.getElementById("tools").classList.toggle("hidden",x!=="tools");
  document.getElementById("process").classList.toggle("hidden",x!=="process");
}
async function load(){
  try{
    const mm=await api(`f2_machines?machine_no=eq.${M}&active=eq.true`);
    if(mm[0]) MACHINE_NAME=mm[0].machine_name;
    document.getElementById("machineNameTop").textContent=MACHINE_NAME;
    document.getElementById("machineNameTools").textContent=MACHINE_NAME;
    document.getElementById("machineNameWork").textContent=MACHINE_NAME;
    document.title="TAJIMA "+MACHINE_NAME;
  }catch(e){}

  try{
    [toolData,toolLogs]=await Promise.all([
      api(`f2_tools?machine_no=eq.${M}&order=t_no.asc`),
      api(`f2_tool_logs?machine_no=eq.${M}&select=id,tool_id,action,created_at&action=in.(工具交換,チップ交換)&order=created_at.desc`)
    ]);
    [products,processMaster,processRoutes,processItems,processLogs,machineProcessAssignments,toolProcessAssignments,toolUsageLogs,workers,toolCheckSetting,dailyToolChecks]=await Promise.all([
      api("f2_products?active=eq.true&order=product_name.asc"),
      api("f2_process_master?active=eq.true&order=product_id,sort_order,id"),
      api("f2_process_routes?select=*"),
      api("f2_items?select=*,f2_shapes(shape_name)&shipped=eq.false&arrival_cancelled_at=is.null&order=part_no.asc"),
      apiAll("f2_process_logs?cancelled_at=is.null&select=id,item_id,process_id,machine_no,worker_id,attention,created_at"),
      api(`f2_machine_process_assignments?machine_no=eq.${M}&select=process_id`).catch(()=>[]),
      api(`f2_tool_process_assignments?machine_no=eq.${M}&select=tool_id,process_id`).catch(()=>[]),
      apiAll(`f2_tool_usage_logs?machine_no=eq.${M}&select=tool_id,process_id,item_id,created_at&order=created_at.desc`).catch(()=>[]),
      api("f2_workers?active=eq.true&select=*&order=sort_order,worker_name").catch(()=>[]),
      api(`f2_tool_check_settings?machine_no=eq.${M}&select=*`).then(x=>x[0]||null).catch(()=>null),
      api(`f2_daily_tool_checks?machine_no=eq.${M}&checked_on=eq.${localDateKey()}&select=*`).catch(()=>[])
    ]);
    if(machineProcessAssignments.length){const assigned=new Set(machineProcessAssignments.map(x=>Number(x.process_id)));processMaster=processMaster.filter(x=>assigned.has(Number(x.id)));products=products.filter(x=>processMaster.some(p=>p.product_id==x.id))}
    renderTools(); renderProductButtons();checkDailyToolPrompt();
  }catch(e){fail(e)}
}
function renderTools(){
  let q=document.getElementById("search").value.trim().toLowerCase();
  let rows=toolData.filter(x=>(`t${x.t_no} ${x.tool_name||""}`).toLowerCase().includes(q));
  document.getElementById("toolList").innerHTML=rows.map(x=>{
    let away=x.current_machine_no!=M;
    let status=x.attention?"⚠ 注意あり":away?`${x.current_machine_no}号機で使用中`:"正常";
    let cls=x.attention?"attn":away?"away":"";
    let sc=x.attention||away?"warn":"ok";
    let lc=lastChangeFor(x.id);
    let lastHtml=lc
      ? `<span class="last-change"><span class="kind">${esc(lc.action)}</span><span class="when">${fmtToolTime(lc.created_at)}</span></span>`
      : `<span class="last-change none">交換記録なし</span>`;
    return `<tr class="tool-row ${cls}">
      <td><button class="btn tbtn" onclick="openTool(${x.id})">T${x.t_no}</button></td>
      <td><input class="tool-name" value="${esc(x.tool_name||"")}" placeholder="工具名を入力" onchange="saveToolName(${x.id},this.value)"></td>
      <td>${lastHtml}</td>
      <td><span class="status ${sc}">${esc(status)}</span></td>
    </tr>`;
  }).join("");
  document.getElementById("ta").textContent=toolData.some(x=>x.attention||x.current_machine_no!=M)?"❗":"";
}
async function saveToolName(id,name){
  try{
    await api(`f2_tools?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({tool_name:name.trim()||null})});
    let x=toolData.find(v=>v.id==id); if(x)x.tool_name=name.trim()||null;
  }catch(e){fail(e)}
}
function openTool(id){
  sel=toolData.find(x=>x.id==id);
  document.getElementById("mt").textContent=`T${sel.t_no}　${sel.tool_name||"工具名未登録"}`;
  document.getElementById("ms").textContent=sel.current_machine_no==M?MACHINE_NAME+"にセット":"現在 "+sel.current_machine_no+"号機で使用中";
  const linked=toolProcessAssignments.filter(x=>x.tool_id==sel.id).map(x=>{const p=processMaster.find(z=>z.id==x.process_id),product=products.find(z=>z.id==p?.product_id);return p&&product?`${product.product_name} / ${p.process_name}`:""}).filter(Boolean);
  const lastExchange=toolLogs.find(x=>x.tool_id==sel.id&&(x.action==="工具交換"||x.action==="チップ交換")),since=lastExchange?new Date(lastExchange.created_at).getTime():0,count=toolUsageLogs.filter(x=>x.tool_id==sel.id&&new Date(x.created_at).getTime()>since).length;
  const target=Number(sel.usage_target)||50,percent=Math.min(100,Math.round(count/target*100)),color=`hsl(${Math.max(0,210-percent*2.1)} 82% 47%)`;
  document.getElementById("autoUsageList").innerHTML=linked.length?linked.map(x=>`<span class="usage-tag">${esc(x)}</span>`).join(""):'<span class="usage-tag">未設定</span>';
  document.getElementById("toolUseCount").textContent=count;document.getElementById("toolUseTarget").textContent=target;document.getElementById("toolUsePercent").textContent=Math.round(count/target*100)+"%";document.getElementById("toolUseMeter").style.cssText=`width:${percent}%;background:${color}`;
  document.getElementById("modal").classList.remove("hidden");
}

async function toolAction(a){
  try{
    const saved=await api("f2_tool_logs",{method:"POST",body:JSON.stringify({tool_id:sel.id,machine_no:M,action:a})});
    if((a==="工具交換"||a==="チップ交換") && saved?.[0]){
      toolLogs.unshift(saved[0]);
    }
    if(a==="注意事項"){
      await api(`f2_tools?id=eq.${sel.id}`,{method:"PATCH",body:JSON.stringify({attention:true})});
      sel.attention=true;
    }
    document.getElementById("modal").classList.add("hidden"); renderTools();
  }catch(e){fail(e)}
}
async function clearAttention(){
  if(!sel)return;
  try{
    await api("f2_tool_logs",{method:"POST",body:JSON.stringify({tool_id:sel.id,machine_no:M,action:"注意解除"})});
    await api(`f2_tools?id=eq.${sel.id}`,{method:"PATCH",body:JSON.stringify({attention:false})});
    sel.attention=false; document.getElementById("modal").classList.add("hidden"); renderTools();
  }catch(e){fail(e)}
}
async function moveTool(){
  let n=Number(prompt("移動先の号機を入力してください (2〜5)"));
  if(![2,3,4,5].includes(n))return;
  try{
    await api("f2_tool_logs",{method:"POST",body:JSON.stringify({tool_id:sel.id,machine_no:M,action:"他機械へ移動",target_machine_no:n})});
    await api(`f2_tools?id=eq.${sel.id}`,{method:"PATCH",body:JSON.stringify({current_machine_no:n})});
    sel.current_machine_no=n; document.getElementById("modal").classList.add("hidden"); renderTools();
  }catch(e){fail(e)}
}

function processBack(){
  if(chosenItem){chosenItem=null;showItemButtons();return}
  if(chosenProcess){chosenProcess=null;showProcessButtons();return}
  if(chosenProduct){chosenProduct=null;renderProductButtons();return}
  openPanel("home");
}
function renderProductButtons(){
  chosenProduct=chosenProcess=chosenItem=null;
  document.getElementById("processTitle").textContent="製品を選択";
  document.getElementById("processGuide").textContent="管理ページで登録された製品だけ表示します。";
  document.getElementById("registerCard").classList.add("hidden");
  document.getElementById("processButtons").innerHTML=products.map(p=>`<button class="btn process-choice" onclick="chooseProduct(${p.id})">${esc(p.product_name)}</button>`).join("")||'<div class="card muted">製品マスタなし</div>';
}
function chooseProduct(id){chosenProduct=products.find(x=>x.id==id);showProcessButtons()}
function showProcessButtons(){
  chosenProcess=chosenItem=null;
  const ps=processMaster.filter(x=>x.product_id==chosenProduct.id);
  document.getElementById("processTitle").textContent=chosenProduct.product_name+"　工程を選択";
  document.getElementById("processGuide").textContent="この製品に登録された工程だけ表示します。";
  document.getElementById("registerCard").classList.add("hidden");
  document.getElementById("processButtons").innerHTML=ps.map(p=>`<button class="btn process-choice" onclick="chooseProcess(${p.id})">${esc(p.process_name)}</button>`).join("")||'<div class="card muted">工程マスタなし</div>';
}
function chooseProcess(id){chosenProcess=processMaster.find(x=>x.id==id);showItemButtons()}
function hasDone(itemId,pid){return processLogs.some(l=>l.item_id==itemId&&l.process_id==pid)}
function eligible(item){
  if(hasDone(item.id,chosenProcess.id))return false;
  const pres=processRoutes.filter(r=>r.process_id==chosenProcess.id).map(r=>r.prerequisite_process_id).filter(Boolean);
  if(!pres.length)return true;
  return pres.some(pid=>hasDone(item.id,pid));
}
function showItemButtons(){
  chosenItem=null;
  document.getElementById("processTitle").textContent=`${chosenProduct.product_name} / ${chosenProcess.process_name}　品番を選択`;
  document.getElementById("processGuide").textContent="この工程に進める品番だけ表示しています。";
  document.getElementById("registerCard").classList.add("hidden");
  let a=processItems.filter(x=>x.product_id==chosenProduct.id&&eligible(x));
  document.getElementById("processButtons").innerHTML=a.map(x=>`<button class="btn process-choice ${x.attention?'warn':''}" style="position:relative" onclick="chooseItem(${x.id})">${x.f2_shapes?.shape_name?`<span style="position:absolute;left:7px;top:6px;font-size:11px;font-weight:900;background:#102b4e;color:white;border-radius:6px;padding:2px 6px">${esc(x.f2_shapes.shape_name)}</span>`:""}${esc(x.part_no)}${x.attention?'<br>⚠ 注意あり':''}</button>`).join("")||'<div class="card muted">現在この工程に進める品番はありません</div>';
}
function chooseItem(id){
  chosenItem=processItems.find(x=>x.id==id);
  document.getElementById("registerSummary").textContent=`${chosenProduct.product_name} / ${chosenItem.part_no} / ${chosenProcess.process_name}`;
  document.getElementById("registerCard").classList.remove("hidden");
  document.getElementById("processButtons").innerHTML="";
  document.getElementById("processTitle").textContent="登録内容を確認";
  document.getElementById("processGuide").textContent="間違いなければ下の登録ボタンを押してください。";
  selectedWorkWorker=null;renderWorkWorkers();
}
function renderWorkWorkers(){const box=document.getElementById("workWorkerButtons");box.innerHTML=workers.map(w=>`<button class="btn worker-btn ${w.id==selectedWorkWorker?'selected':''}" onclick="selectWorkWorker(${w.id})">${esc(w.worker_name)}</button>`).join("")||'<div class="muted">管理ページで作業者を登録してください</div>';document.querySelector(".register-big").disabled=!selectedWorkWorker}
function selectWorkWorker(id){selectedWorkWorker=id;renderWorkWorkers()}
async function registerWork(){
  if(!chosenItem||!chosenProcess||!selectedWorkWorker)return alert("作業者を選択してください");
  const btn=document.querySelector(".register-big");btn.disabled=true;
  try{
    const attention=document.getElementById("variation").checked;
    const item=chosenItem,process=chosenProcess,product=chosenProduct,workerId=selectedWorkWorker;
    const saved=await api("f2_process_logs",{method:"POST",body:JSON.stringify({item_id:item.id,machine_no:M,worker_id:workerId,step_no:1,process_id:process.id,attention})});
    if(saved?.[0]){processLogs.unshift(saved[0]);toolProcessAssignments.filter(x=>x.process_id==chosenProcess.id).forEach(x=>toolUsageLogs.unshift({tool_id:x.tool_id,process_id:chosenProcess.id,item_id:chosenItem.id,created_at:saved[0].created_at||new Date().toISOString()}))}
    if(attention && !chosenItem.attention){
      await api(`f2_items?id=eq.${chosenItem.id}`,{method:"PATCH",body:JSON.stringify({attention:true})});
      chosenItem.attention=true;
    }
    document.getElementById("variation").checked=false;
    lastRegistered=saved?.[0]?{id:saved[0].id,itemId:item.id,processId:process.id,workerId,createdAt:saved[0].created_at||new Date().toISOString(),summary:`${product.product_name} / ${item.part_no} / ${process.process_name} / ${workerName(workerId)}`} : null;
    chosenItem=null;showItemButtons();showUndoBar();
  }catch(e){fail(e)}finally{btn.disabled=false}
}

function workerName(id){return workers.find(x=>x.id==id)?.worker_name||"未登録"}
function localDateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function showUndoBar(){clearTimeout(undoTimer);if(!lastRegistered)return;document.getElementById("undoSummary").textContent=lastRegistered.summary;document.getElementById("undoBar").classList.remove("hidden");undoTimer=setTimeout(hideUndoBar,300000)}
function hideUndoBar(){document.getElementById("undoBar").classList.add("hidden");lastRegistered=null}
async function cancelLastWork(){if(!lastRegistered)return;const x=lastRegistered;if(Date.now()-new Date(x.createdAt).getTime()>300000){hideUndoBar();return alert("取消可能な5分を過ぎました。管理ページで確認してください。")}if(!confirm("直前に登録した作業を取消しますか？\n記録は取消済みとして保存します。"))return;try{const [latest,shipped]=await Promise.all([api(`f2_process_logs?item_id=eq.${x.itemId}&cancelled_at=is.null&order=created_at.desc&limit=1`),api(`f2_shipments?item_id=eq.${x.itemId}&cancelled_at=is.null&limit=1`)]);if(!latest[0]||latest[0].id!=x.id)return alert("後続の作業が登録されているため取消できません。");if(shipped.length)return alert("出荷済みのため取消できません。先に管理ページで出荷を確認してください。");await api(`f2_process_logs?id=eq.${x.id}`,{method:"PATCH",body:JSON.stringify({cancelled_at:new Date().toISOString(),cancelled_by_worker_id:x.workerId})});hideUndoBar();await load();alert("直前の作業登録を取消しました") }catch(e){fail(e)}}
function checkDailyToolPrompt(){const modal=document.getElementById("dailyCheckModal");if(!toolCheckSetting?.enabled||dailyToolChecks.length)return modal.classList.add("hidden");const now=new Date(),current=now.getHours()*60+now.getMinutes(),parts=String(toolCheckSetting.check_time||"08:00").split(":"),due=Number(parts[0])*60+Number(parts[1]);if(current<due||!modal.classList.contains("hidden"))return;selectedDailyWorker=null;renderDailyWorkers();modal.classList.remove("hidden")}
function renderDailyWorkers(){document.getElementById("dailyWorkerButtons").innerHTML=workers.map(w=>`<button class="btn worker-btn ${w.id==selectedDailyWorker?'selected':''}" onclick="selectDailyWorker(${w.id})">${esc(w.worker_name)}</button>`).join("")||'<div class="muted">管理ページで作業者を登録してください</div>';document.getElementById("dailyConfirmBtn").disabled=!selectedDailyWorker}
function selectDailyWorker(id){selectedDailyWorker=id;renderDailyWorkers()}
async function confirmDailyToolCheck(){if(!selectedDailyWorker)return;const btn=document.getElementById("dailyConfirmBtn");btn.disabled=true;try{const saved=await api("f2_daily_tool_checks",{method:"POST",body:JSON.stringify({machine_no:M,worker_id:selectedDailyWorker,checked_on:localDateKey()})});if(saved?.[0])dailyToolChecks=[saved[0]];document.getElementById("dailyCheckModal").classList.add("hidden");alert("本日の工具確認を登録しました")}catch(e){await load();if(dailyToolChecks.length)document.getElementById("dailyCheckModal").classList.add("hidden");else fail(e)}finally{btn.disabled=false}}
async function refreshTablet(){const el=document.getElementById("pullIndicator");el.textContent="更新中…";el.classList.add("show");await load();el.textContent="✓ 更新しました";setTimeout(()=>{el.classList.remove("show");el.textContent="↓ 引っ張って更新"},900)}
document.addEventListener("touchstart",e=>{if(scrollY===0&&document.getElementById("process").classList.contains("hidden")&&document.getElementById("modal").classList.contains("hidden")&&document.getElementById("dailyCheckModal").classList.contains("hidden"))pullStart=e.touches[0].clientY;else pullStart=null},{passive:true});
document.addEventListener("touchmove",e=>{if(pullStart===null)return;const d=e.touches[0].clientY-pullStart;if(d>20){const el=document.getElementById("pullIndicator");el.textContent=d>=75?"離して更新":"↓ 引っ張って更新";el.classList.add("show")}},{passive:true});
document.addEventListener("touchend",e=>{if(pullStart===null)return;const d=e.changedTouches[0].clientY-pullStart;pullStart=null;if(d>=75)refreshTablet();else document.getElementById("pullIndicator").classList.remove("show")},{passive:true});
setInterval(checkDailyToolPrompt,60000);

load();
</script>
</body>
</html>
