<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAJIMA 第2工場 管理</title><link rel="stylesheet" href="common.css"><style>.machines{grid-template-columns:repeat(5,1fr)}.cols{grid-template-columns:1fr 1fr}@media(max-width:800px){.machines,.cols{grid-template-columns:1fr 1fr}}</style></head><body><div class="top"><b>TAJIMA 第2工場 管理</b><span>PILOT v0.1</span></div><div class="wrap"><div id="err" class="card alert" style="display:none"></div><div class="card"><div class="title">機械状況</div><div class="muted">現在は1号機タブレットのみ連動する実験版</div></div><div id="machines" class="grid machines"></div><div class="grid cols"><div class="card"><div class="title">生産・工程履歴</div><div id="pl"></div></div><div class="card"><div class="title">工具履歴</div><div id="tl"></div></div></div><div class="card"><div class="title">⚠ 未解決の注意事項</div><div id="alerts"></div></div></div><script src="config.js"></script><script>
const U=window.TAJIMA_SUPABASE_URL,K=window.TAJIMA_SUPABASE_ANON_KEY,H={"apikey":K,"Authorization":"Bearer "+K};async function api(p){let r=await fetch(U+"/rest/v1/"+p,{headers:H});if(!r.ok)throw Error(await r.text());return r.json()}function e(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}function d(s){return new Date(s).toLocaleString("ja-JP")}
async function load(){try{let [p,t,i,o]=await Promise.all([api("f2_process_logs?select=*,f2_items(part_no,f2_products(product_name))&order=created_at.desc&limit=50"),api("f2_tool_logs?select=*,f2_tools(t_no,tool_name)&order=created_at.desc&limit=50"),api("f2_items?select=*,f2_products(product_name)&shipped=eq.false"),api("f2_tools?select=*&order=machine_no.asc,t_no.asc")]);let latest={};p.forEach(x=>latest[x.machine_no]??=x);machines.innerHTML=[1,2,3,4,5].map(n=>{let x=latest[n];return `<div class="card"><b>${n}号機</b><br>${x?`${e(x.f2_items?.f2_products?.product_name)} / ${e(x.f2_items?.part_no)}<br><span class="pill">${x.step_no}工程</span><br><span class="muted">${d(x.created_at)}</span>`:'<span class="muted">記録なし</span>'}</div>`}).join("");pl.innerHTML=p.map(x=>`<div class="log">${d(x.created_at)} <b>${x.machine_no}号機</b> ${e(x.f2_items?.f2_products?.product_name)} / ${e(x.f2_items?.part_no)} ${x.step_no}工程 ${x.attention?'⚠':''}</div>`).join("")||"記録なし";tl.innerHTML=t.map(x=>`<div class="log">${d(x.created_at)} <b>${x.machine_no}号機</b> T${String(x.f2_tools?.t_no??"").padStart(2,"0")} ${e(x.f2_tools?.tool_name)} ${e(x.action)} ${x.target_machine_no?'→'+x.target_machine_no+'号機':''}</div>`).join("")||"記録なし";let a=[...i.filter(x=>x.attention).map(x=>`⚠ ${e(x.f2_products?.product_name)} / ${e(x.part_no)} 変動事項`),...o.filter(x=>x.attention||x.current_machine_no!=x.machine_no).map(x=>`⚠ ${x.machine_no}号機 T${String(x.t_no).padStart(2,"0")} ${e(x.tool_name)} ${x.current_machine_no!=x.machine_no?'→'+x.current_machine_no+'号機':''}`)];alerts.innerHTML=a.map(x=>`<div class="log">${x}</div>`).join("")||"現在なし"}catch(x){err.style.display="block";err.textContent="通信エラー: "+x.message}}load();setInterval(load,10000);
</script></body></html>
