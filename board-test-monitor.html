<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAJIMA 工場表示 TEST v11.27</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fafc;font-family:"Yu Gothic",Meiryo,sans-serif;color:#0f172a}.screen{height:100%;display:grid;grid-template-columns:4fr 1fr}.main{display:flex;flex-direction:column;min-width:0}.title{height:7vh;display:flex;align-items:center;justify-content:center;font-size:3.2vh;font-weight:900;background:#0f3d91;color:#fff;position:relative}.clock{position:absolute;right:1.2vw;font-size:1.5vh}.rows{height:86vh;display:grid;grid-template-rows:1fr 1fr;gap:.7vh;padding:.7vh}.calrow{display:grid;gap:.25vw}.day{background:#fff;border:1px solid #cbd5e1;border-radius:.35vw;min-width:0;overflow:hidden;display:flex;flex-direction:column}.day.off{background:#fff1f2;border-color:#fca5a5}.date{font-size:1.45vh;font-weight:900;padding:.28vh .18vw;text-align:center;background:#eff6ff;border-bottom:1px solid #dbeafe;white-space:nowrap}.off .date{background:#fee2e2;color:#b91c1c}.items{padding:.24vh .16vw;display:flex;flex-direction:column;gap:.22vh;overflow:hidden}.item{font-size:1.05vh;line-height:1.22;padding:.34vh .25vw;border:1.7px solid transparent;border-radius:.28vw;background:#f8fafc;overflow:visible;font-weight:800;word-break:break-word}.item .company{display:block;white-space:normal;font-weight:900;border-bottom:1px solid #cbd5e1;padding-bottom:.18vh;margin-bottom:.18vh}.item .part{display:block;white-space:normal;font-weight:700}.item .machine{display:block;white-space:normal;font-size:.9em;color:inherit;margin-top:.12vh}.item.done{opacity:.55}.stamp{font-size:.8em;color:#b91c1c}.event{background:#fefce8}.side{border-left:.25vw solid #0f3d91;background:#fff;display:flex;flex-direction:column}.side h2{font-size:2.1vh;margin:0;padding:1.2vh 1vw;background:#eff6ff;color:#0f3d91}.notice{padding:1.2vh 1vw;font-size:1.55vh;line-height:1.65;white-space:pre-wrap;overflow:hidden}.legend{margin-top:auto;padding:1vh 1vw;font-size:1.05vh;color:#64748b;border-top:1px solid #e2e8f0}.bottomLegend{height:7vh;margin:.2vh .7vh .7vh;padding:.5vh .8vw;background:#fff;border:1px solid #dbeafe;border-radius:.35vw;display:flex;align-items:center;justify-content:space-around;gap:.7vw;font-size:1.15vh;font-weight:800}.lg{display:flex;align-items:center;gap:.3vw;white-space:nowrap}.sym{display:inline-flex;align-items:center;justify-content:center;min-width:1.7vw;height:2.6vh;border-radius:.25vw;border:1px solid #cbd5e1}.ship{color:#15803d;border-color:#22c55e}.arr{color:#1d4ed8;border-color:#3b82f6}.evt{color:#7e22ce;border:0}.hol{color:#dc2626;border-color:#ef4444;background:#fff1f2}.doneSym{color:#111827;border-radius:999px}.ink{position:fixed;inset:0;pointer-events:none}
/* v11.16 凡例と実表示を統一 */
.item.job-in{border-color:#3b82f6}
.item.job-out{border-color:#22c55e}
.item.event{border-color:#7c3aed}
.kind-badge{display:inline-flex;align-items:center;justify-content:center;min-width:1.25em;height:1.25em;margin-right:.2em;border-radius:.18em;font-size:.9em;font-weight:900;background:#fff}
.job-in .kind-badge{color:#1d4ed8;border:1px solid #3b82f6}
.job-out .kind-badge{color:#15803d;border:1px solid #22c55e}
.done .kind-badge{color:#b91c1c;border:1px solid #ef4444;border-radius:999px}


.syncStatus{position:absolute;right:8.7vw;top:.75vh;font-size:1.0vh;font-weight:800;display:flex;gap:.35vw;align-items:center;opacity:.95}
.syncDot{width:.55vw;height:.55vw;min-width:7px;min-height:7px;border-radius:50%;background:#22c55e;display:inline-block}
.syncStatus.error .syncDot{background:#ef4444}.syncStatus.error{color:#fecaca}
.memo{display:block;white-space:normal;font-size:.88em;color:inherit;margin-top:.16vh;line-height:1.15}
</style></head><body><div class="screen"><main class="main"><div class="title"><span id="monthTitle"></span><span style="position:absolute;left:1vw;font-size:1vh;opacity:.7">TEST v11.27</span><span id="syncStatus" class="syncStatus"><span>最終更新 <span id="syncTime">--:--:--</span></span><span class="syncDot"></span><span id="syncText">正常</span></span><span id="clock" class="clock"></span></div><div class="rows"><div id="top" class="calrow"></div><div id="bottom" class="calrow"></div></div><div class="bottomLegend">
<span class="lg"><span class="sym ship">出</span> 出荷予定</span>
<span class="lg"><span class="sym arr">入</span> 入荷予定</span>
<span class="lg"><span class="sym evt">◆</span> 行事・点検・イベント</span>
<span class="lg"><span class="sym hol">休</span> 会社休み（日曜・祝日・指定休）</span>
<span class="lg"><span class="sym doneSym">済</span> 完了（履歴表示）</span>
<span class="lg">※土曜日は営業日 / 休日指定日は赤表示</span>
</div></main><aside class="side"><h2>連絡事項</h2><div id="notice" class="notice"></div><div class="legend">入＝入荷　出＝納期/出荷　済＝完了<br>赤背景＝休日</div></aside></div><canvas id="ink" class="ink"></canvas><script src="config.js"></script><script>
const C=window.TAJIMA_CONFIG||{},URL=C.SUPABASE_URL||"",KEY=C.SUPABASE_KEY||"",H={"apikey":KEY,"Authorization":`Bearer ${KEY}`,"Content-Type":"application/json"},api=n=>`${URL}/rest/v1/${n}`;const topEl=document.getElementById("top"),bottomEl=document.getElementById("bottom"),monthTitleEl=document.getElementById("monthTitle"),clockEl=document.getElementById("clock"),noticeEl=document.getElementById("notice"),inkEl=document.getElementById("ink"),syncStatusEl=document.getElementById("syncStatus"),syncTimeEl=document.getElementById("syncTime"),syncTextEl=document.getElementById("syncText");
const params=new URLSearchParams(location.search),browseMode=params.get("office")==="1"||params.get("browse")==="1";
const qYear=parseInt(params.get("year")||"",10),qMonth=parseInt(params.get("month")||"",10),initialNow=new Date();
let Y=Number.isFinite(qYear)?qYear:initialNow.getFullYear(),M=Number.isFinite(qMonth)&&qMonth>=1&&qMonth<=12?qMonth:initialNow.getMonth()+1;
let jobs=[],events=[],holidays=[],strokes=[];const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function get(n,q=""){const r=await fetch(api(n)+(q?"?"+q:""),{headers:H});if(!r.ok)throw Error(await r.text());return r.json()}function dk(d){return `${Y}-${String(M).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
function monthKey(){return `${Y}-${String(M).padStart(2,"0")}`}
function postDisplayedMonth(){if(window.parent!==window)window.parent.postMessage({type:"TAJIMA_DISPLAY_MONTH",year:Y,month:M},"*")}function isOff(d){const k=dk(d);return new Date(Y,M-1,d).getDay()===0||holidays.some(x=>x.holiday_date===k)}
function itemsFor(d){const k=dk(d),a=[];jobs.forEach(j=>{if(j.arrival_date===k)a.push({kind:"入",company:j.company_name,part:j.part_no,machine:j.machine_name||"",memo:j.memo||"",c:j.highlight_color,done:j.status==="done"});if(j.due_date===k)a.push({kind:"出",company:j.company_name,part:j.part_no,machine:j.machine_name||"",memo:j.memo||"",c:j.highlight_color,done:j.status==="done"})});events.filter(e=>e.event_date===k).forEach(e=>a.push({event:true,text:e.event_text,c:e.highlight_color}));return a}
function itemHtml(x){
  if(x.event){
    const fontStyle=x.c?`color:${x.c}`:"";
    return `<div class="item event" style="border:2px solid #7c3aed;${fontStyle}">◆ ${esc(x.text)}</div>`;
  }
  const kindClass=x.kind==="入"?"job-in":"job-out";
  const defaultBorder=x.kind==="入"?"#3b82f6":"#22c55e";
  const fontStyle=x.c?`color:${x.c}`:"";
  return `<div class="item ${kindClass} ${x.done?"done":""}" style="border:2px solid ${defaultBorder};${fontStyle}">
    <span class="company"><span class="kind-badge">${x.done?"済":x.kind}</span>${esc(x.company)}</span>
    <span class="part">${esc(x.part)}</span>
    ${x.machine?`<span class="machine">${esc(x.machine)}</span>`:""}
    ${x.memo?`<span class="memo">${esc(x.memo)}</span>`:""}
  </div>`;
}
function cell(d){const a=itemsFor(d);return `<div class="day ${isOff(d)?"off":""}"><div class="date">${d}日</div><div class="items">${a.slice(0,7).map(itemHtml).join("")}${a.length>7?`<div class="item">＋${a.length-7}件</div>`:""}</div></div>`}function draw(){const days=new Date(Y,M,0).getDate(),split=15;topEl.style.gridTemplateColumns=`repeat(${split},1fr)`;bottomEl.style.gridTemplateColumns=`repeat(${days-split},1fr)`;topEl.innerHTML=Array.from({length:split},(_,i)=>cell(i+1)).join("");bottomEl.innerHTML=Array.from({length:days-split},(_,i)=>cell(i+16)).join("");monthTitleEl.textContent=`${Y}年 ${M}月　入荷・納期予定`;postDisplayedMonth()}
function resizeInk(){const r=document.body.getBoundingClientRect();inkEl.width=r.width*devicePixelRatio;inkEl.height=r.height*devicePixelRatio;inkEl.style.width=r.width+"px";inkEl.style.height=r.height+"px";const x=inkEl.getContext("2d");x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);drawInk()}function drawInk(){const x=inkEl.getContext("2d"),r=inkEl.getBoundingClientRect();x.clearRect(0,0,r.width,r.height);strokes.forEach(s=>{const p=s.stroke_data||s;if(!p.points?.length)return;x.strokeStyle=p.color||"#111";x.lineWidth=p.width||3;x.lineCap="round";x.lineJoin="round";x.beginPath();p.points.forEach((q,i)=>i?x.lineTo(q.x*r.width,q.y*r.height):x.moveTo(q.x*r.width,q.y*r.height));x.stroke()})}
function setSyncState(ok){
  const d=new Date();
  syncTimeEl.textContent=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
  syncStatusEl.classList.toggle("error",!ok);
  syncTextEl.textContent=ok?"正常":"通信エラー";
}
async function load(){
  try{
    const a=`${Y}-${String(M).padStart(2,"0")}-01`,b=M===12?`${Y+1}-01-01`:`${Y}-${String(M+1).padStart(2,"0")}-01`,m=`${Y}-${String(M).padStart(2,"0")}`;
    const [j,e,h,n,s]=await Promise.all([
      get("board_test_jobs","select=*"),
      get("board_test_events",`select=*&event_date=gte.${a}&event_date=lt.${b}`),
      get("board_test_holidays",`select=*&holiday_date=gte.${a}&holiday_date=lt.${b}`),
      get("board_test_notices",`select=*&id=eq.${Y*100+M}`),
      get("board_test_strokes",`select=*&month_key=eq.${m}&order=id.asc`)
    ]);
    jobs=j;events=e;holidays=h;strokes=s;noticeEl.textContent=n[0]?.content||"";draw();
    try{drawInk()}catch(inkErr){console.error("ink draw",inkErr)}
    setSyncState(true);
  }catch(err){
    console.error(err);setSyncState(false);
  }
}
function tick(){
  const d=new Date();
  clockEl.textContent=d.toLocaleString("ja-JP",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  if(!browseMode){
    const ny=d.getFullYear(),nm=d.getMonth()+1;
    if(ny!==Y||nm!==M){Y=ny;M=nm;load()}
  }
}
// Render the calendar shell immediately. Network or handwriting failures must never blank the calendar.
draw();
tick();
setInterval(tick,30000);
try{resizeInk()}catch(e){console.error("ink init",e)}
addEventListener("resize",()=>{try{resizeInk()}catch(e){console.error("ink resize",e)}});
load();
setInterval(load,15000);
</script></body></html>
