<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>TAJIMA ペンボード TEST v0.5</title><script src="config.js"></script>
<style>html,body{margin:0;height:100%;font-family:"Yu Gothic",sans-serif;background:#eef2f7}.bar{height:54px;background:#132033;color:#fff;display:flex;align-items:center;padding:0 14px;gap:8px}.bar button{padding:7px 12px;border:1px solid #40516a;background:#1b2b42;color:#fff;border-radius:7px;font-weight:800}.frame{height:calc(100% - 54px);position:relative}.frame iframe{border:0;width:100%;height:100%}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.hint{margin-left:auto;font-size:12px;opacity:.8}</style></head><body><div class="bar"><b>ペンボード入力</b><button onclick="mode=!mode;c.style.pointerEvents=mode?'auto':'none'">ペン ON/OFF</button><button onclick="ctx.clearRect(0,0,c.width,c.height)">全消去</button><span class="hint">会議中の自由書き込み用（TEST v0.5）</span></div><div class="frame"><iframe src="monitor.html?v=0.5&penboard=1"></iframe><canvas id="c"></canvas></div><script>
let c=document.getElementById("c"),ctx=c.getContext("2d"),down=false,mode=true;function size(){let r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=3;ctx.lineCap="round"}size();addEventListener("resize",size);c.onpointerdown=e=>{down=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)};c.onpointermove=e=>{if(down){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()}};c.onpointerup=()=>down=false;c.onpointerleave=()=>down=false;
</script></body></html>
