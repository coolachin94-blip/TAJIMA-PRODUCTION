<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#173b86"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="藤巻 作業"><link rel="manifest" href="manifest-fujimaki.json"><link rel="apple-touch-icon" href="fujimaki-icon.svg"><title>藤巻 作業画面</title><script src="config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#16233d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}.head{background:#173b86;color:#fff;border-radius:16px;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:10px}.head b{font-size:22px}.head small,.sub{display:block;font-size:12px;opacity:.86;margin-top:3px}.head-right{display:flex;align-items:center;gap:9px}.sync{font-size:12px;text-align:right}.refresh{border:1px solid #ffffff99;background:#ffffff1f;color:#fff;border-radius:10px;padding:7px 10px;font-weight:900}.refresh small{display:block;font-size:10px}.product{margin-top:12px}.product-head{width:100%;border:2px solid #bfdbfe;background:#fff;border-radius:16px;padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;color:#16233d}.product-name{font-size:21px;font-weight:900;color:#173b86;overflow-wrap:anywhere}.product-info{font-size:12px;color:#64748b;margin-top:5px}.product-status{text-align:right;font-size:13px;font-weight:900;white-space:nowrap}.product-body{padding-left:11px}.job,.empty,.error{background:#fff;border:2px solid #bfdbfe;border-radius:16px;padding:14px;margin-top:9px}.job.running{border-left:9px solid #16a34a}.tag{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;color:#fff}.tag.green{background:#16a34a}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:5px;vertical-align:-1px}.dot.green{background:#16a34a}.order-date{font-size:18px;font-weight:900;color:#173b86;margin-top:7px}.spec{color:#64748b;font-size:12px;margin-top:3px;overflow-wrap:anywhere}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0}.counts>div{background:#eff6ff;border-radius:11px;padding:8px;text-align:center}.counts span{display:block;color:#64748b;font-size:11px}.counts b{font-size:19px}.progress{height:12px;background:#dbe4f0;border-radius:999px;overflow:hidden}.bar{height:100%;background:#16a34a}.now{text-align:center;font-size:17px;font-weight:900;margin:9px 0}.btn{width:100%;border:0;border-radius:12px;padding:13px 9px;color:#fff;font-size:17px;font-weight:900}.btn small{display:block;font-size:12px;font-weight:600;margin-top:3px;opacity:.92}.work-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.complete{background:#16834b}.stop{background:#64748b}.start{background:#2563eb}.empty{text-align:center;padding:30px 12px;font-weight:900;color:#475569}.error{border-color:#fecaca;color:#991b1b}.foot{text-align:center;color:#64748b;font-size:11px;margin:15px 0}.busy{opacity:.55;pointer-events:none}@media(min-width:760px){body{max-width:860px;margin:auto;padding-left:18px;padding-right:18px}.head b{font-size:26px}.product-name{font-size:24px}.btn{font-size:19px;padding:16px}}
</style></head><body><div class="head"><div><b>藤巻工範　作業</b><small>Công việc Fujimaki</small></div><div class="head-right"><button class="refresh" onclick="manualRefresh()">更新<small>Làm mới</small></button><div class="sync" id="syncText">読込中<br>Đang tải</div></div></div><main id="app"><div class="empty">読込中…<br>Đang tải…</div></main><div class="foot">画面は自動更新されます<br>Màn hình tự động cập nhật</div><script>
const CONFIG=window.TAJIMA_CONFIG||{},URL=CONFIG.SUPABASE_URL||"",KEY=CONFIG.SUPABASE_KEY||"",API=`${URL}/rest/v1/material_work_progress`;let rows=[],saving=false;
const h=()=>({apikey:KEY,Authorization:`Bearer ${KEY}`,"Content-Type":"application/json","Prefer":"return=representation"}),n=v=>Number(v)||0,e=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"),groupKey=r=>`${r.material_name||"不明"}|||${r.spec||""}`;
const dateLabel=r=>{if(!r.ordered_at)return "発注日なし · Không có ngày đặt hàng";const d=new Date(r.ordered_at);return Number.isNaN(d.getTime())?"発注日なし · Không có ngày đặt hàng":`${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}発注分 · Đơn đặt hàng ngày ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`};
const token=s=>encodeURIComponent(s).replaceAll("'","%27"),openKey=s=>"tajima_worker_group_"+s;
function groupState(rs){const count=rs.filter(r=>r.status==="running").length;return count?{c:"green",ja:`進行中 ${count}件`,vi:`Đang thực hiện: ${count}`}:null}
async function load(){if(saving)return;try{const r=await fetch(`${API}?status=neq.completed&select=*&order=ordered_at.asc.nullslast,id.asc`,{headers:h(),cache:"no-store"});if(!r.ok)throw new Error(await r.text());rows=await r.json();draw();syncText.innerHTML=`${new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}<br>Đã cập nhật`}catch(x){app.innerHTML=`<div class="error">データを読み込めません<br>Không thể tải dữ liệu<br><small>${e(x.message)}</small></div>`}}
function toggleGroup(t){const k=decodeURIComponent(t),s=openKey(k);localStorage.setItem(s,localStorage.getItem(s)==="yes"?"no":"yes");draw()}
function jobCard(r){const done=n(r.completed_qty),total=n(r.target_qty),rem=Math.max(0,total-done),pct=total?Math.min(100,done/total*100):0,isRun=r.status==="running",cls=isRun?"running":"",tag=isRun?'<span class="tag green">進行中 · Đang thực hiện</span>':"";return `<article class="job ${cls}">${tag}<div class="order-date">${dateLabel(r)}</div><div class="spec">${e(r.order_no||"")}</div><div class="counts"><div><span>入荷 · Đã nhận</span><b>${total}</b></div><div><span>完了 · Hoàn thành</span><b>${done}</b></div><div><span>残り · Còn lại</span><b>${rem}</b></div></div>${isRun?`<div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="now">${done+1}台目を加工中<span class="sub">Đang gia công sản phẩm thứ ${done+1}</span></div><div class="work-buttons"><button class="btn complete" onclick="completeOne(${r.id})">1台完了<small>Hoàn thành 1 sản phẩm</small></button><button class="btn stop" onclick="stopWork(${r.id})">作業を停止<small>Tạm dừng công việc</small></button></div>`:`<button class="btn start" onclick="startWork(${r.id})">作業開始<small>Bắt đầu làm việc</small></button>`}</article>`}
function draw(){const groups={};for(const r of rows)(groups[groupKey(r)]||(groups[groupKey(r)]=[])).push(r);const entries=Object.entries(groups).sort((a,b)=>{const rank=rs=>rs.some(r=>r.status==="running")?1:0;return rank(b[1])-rank(a[1])||String(a[1][0].material_name).localeCompare(String(b[1][0].material_name),"ja")});if(!entries.length){app.innerHTML='<div class="empty">作業待ちの品目はありません<br>Không có sản phẩm đang chờ xử lý</div>';return}app.innerHTML=entries.map(([k,rs])=>{rs.sort((a,b)=>new Date(a.ordered_at||0)-new Date(b.ordered_at||0)||n(a.id)-n(b.id));const st=groupState(rs),total=rs.reduce((a,r)=>a+n(r.target_qty),0),done=rs.reduce((a,r)=>a+n(r.completed_qty),0),isOpen=localStorage.getItem(openKey(k))==="yes"||rs.some(r=>r.status==="running");return `<section class="product"><button class="product-head" onclick="toggleGroup('${token(k)}')"><div><div class="product-name">${e(rs[0].material_name)}</div><div class="product-info">完了 ${done}/${total} · Hoàn thành ${done}/${total}　　残り ${Math.max(0,total-done)} · Còn lại ${Math.max(0,total-done)}</div></div><div class="product-status">${st?`<span class="dot ${st.c}"></span>${st.ja}<span class="sub">${st.vi}</span>`:""}${isOpen?"▲":"▼"}</div></button>${isOpen?`<div class="product-body">${rs.map(jobCard).join("")}</div>`:""}</section>`}).join("")}
async function patch(id,row){const r=await fetch(`${API}?id=eq.${id}`,{method:"PATCH",headers:h(),body:JSON.stringify({...row,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error(await r.text())}
async function startWork(id){
  if(saving)return;
  saving=true;document.body.classList.add("busy");
  try{
    const response=await fetch(`${API}?status=neq.completed&select=id,status&order=id.asc`,{headers:h(),cache:"no-store"});
    if(!response.ok)throw new Error(await response.text());
    const latest=await response.json(),target=latest.find(r=>n(r.id)===n(id));
    if(!target||target.status!=="waiting")return;
    if(latest.filter(r=>r.status==="running").length>=2){
      alert("同時に作業できるのは2件までです。別の作業を停止してください。\n\nChỉ có thể làm tối đa 2 công việc cùng lúc. Hãy tạm dừng một công việc.");
      return;
    }
    await patch(id,{status:"running",priority:0,started_at:new Date().toISOString()});
  }catch(x){alert("更新エラー / Lỗi cập nhật\n"+x.message)}
  finally{saving=false;document.body.classList.remove("busy");await load()}
}
async function stopWork(id){if(saving)return;if(!confirm("この作業を停止して作業待ちに戻しますか？\n\nTạm dừng công việc này và đưa về trạng thái chờ?"))return;saving=true;document.body.classList.add("busy");try{await patch(id,{status:"waiting",priority:0})}catch(x){alert("更新エラー / Lỗi cập nhật\n"+x.message)}finally{saving=false;document.body.classList.remove("busy");await load()}}
async function completeOne(id){
  if(saving)return;
  const row=rows.find(r=>n(r.id)===n(id));
  if(!row||row.status!=="running")return;
  if(!confirm(`1台完了にしますか？\n完了 ${n(row.completed_qty)+1} / ${n(row.target_qty)}\n\nXác nhận hoàn thành 1 sản phẩm?`))return;
  saving=true;document.body.classList.add("busy");
  try{
    const qty=n(row.completed_qty)+1,all=qty>=n(row.target_qty);
    await patch(id,{completed_qty:qty,status:all?"completed":"running",priority:0,completed_at:all?new Date().toISOString():null});
  }catch(x){alert("更新エラー / Lỗi cập nhật\n"+x.message)}
  finally{saving=false;document.body.classList.remove("busy");await load()}
}
async function manualRefresh(){syncText.innerHTML="更新中…<br>Đang làm mới…";await load()}
let pullStart=0,pullDistance=0,pulling=false;
addEventListener("touchstart",ev=>{if(scrollY===0&&ev.touches.length===1){pullStart=ev.touches[0].clientY;pullDistance=0;pulling=true}},{passive:true});
addEventListener("touchmove",ev=>{if(!pulling)return;pullDistance=ev.touches[0].clientY-pullStart;if(pullDistance>35)syncText.innerHTML=pullDistance>80?"離して更新<br>Thả để làm mới":"下に引いて更新<br>Kéo xuống để làm mới"},{passive:true});
addEventListener("touchend",async()=>{if(!pulling)return;const refresh=pullDistance>80&&scrollY===0;pulling=false;pullDistance=0;if(refresh)await manualRefresh();else syncText.innerHTML="自動更新<br>Tự động cập nhật"},{passive:true});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});load();setInterval(load,10000);
</script></body></html>
