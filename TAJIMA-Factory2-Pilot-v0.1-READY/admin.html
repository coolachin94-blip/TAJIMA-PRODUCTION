<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAJIMA 第2工場 管理 v1.0</title><link rel="stylesheet" href="common.css">
<style>
.wrap{max-width:1500px}.hidden{display:none!important}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.nav .btn{min-height:48px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fc{width:100%;min-height:46px;padding:9px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:#fff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row .btn{flex:0 0 auto}
.box{border:1px solid #dbe3ec;border-radius:10px;padding:10px;margin:8px 0;background:#fff}.tag{display:inline-block;padding:5px 8px;border-radius:8px;background:#e8eef7;margin:3px;font-weight:700}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.big{font-size:18px;min-height:54px}
.stat{font-size:28px;font-weight:900}.warnrow{background:#fff7ed}.timeline{border-left:4px solid #102b4e;padding-left:14px;margin-left:8px}.event{margin:12px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:78px;border:1px solid #dbe3ec;border-radius:8px;padding:5px;background:#fff}.day b{display:block}.dot{font-size:12px;margin-top:3px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.cal{grid-template-columns:repeat(7,1fr);font-size:12px}}
@media print{.top,.nav,.no-print,#err{display:none!important}.wrap{max-width:none}.card{box-shadow:none;border:0}}

.top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.top-actions{display:flex;align-items:center;gap:14px}
.machine-launch-btn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:7px 13px;border:1px solid rgba(255,255,255,.28);border-radius:9px;background:#2563eb;color:#fff;font-size:13px;font-weight:900;text-decoration:none;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.machine-launch-btn:hover{filter:brightness(.97)}
.ship-layout{display:grid;grid-template-columns:minmax(360px,.9fr) minmax(520px,1.35fr);gap:12px}
.ship-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ship-month-nav{display:flex;align-items:center;gap:7px}
.ship-month-title{min-width:120px;text-align:center;font-weight:900;color:#102b4e}
.ship-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.ship-dow{text-align:center;font-size:12px;font-weight:900;color:#64748b;padding:4px 0}
.ship-day{min-height:68px;border:1px solid #dbe3ec;border-radius:9px;background:#fff;padding:6px;text-align:left;cursor:pointer;position:relative}
.ship-day:hover{border-color:#93c5fd;background:#f8fbff}
.ship-day.selected{border:2px solid #2563eb;background:#eff6ff}
.ship-day.empty{border-color:transparent;background:transparent;cursor:default}
.ship-day .num{font-weight:900;font-size:13px}
.ship-day .count{margin-top:7px;font-size:12px;color:#2563eb;font-weight:900}
.ship-day.sun .num{color:#dc2626}.ship-day.sat .num{color:#2563eb}
.ship-day-list .box{margin:6px 0}
.ship-day-summary{font-weight:900;color:#102b4e;margin-bottom:7px}
@media(max-width:900px){.ship-layout{grid-template-columns:1fr}.top{align-items:flex-start}.top-actions{gap:7px;flex-wrap:wrap;justify-content:flex-end}.machine-launch-btn{font-size:12px}}

</style></head><body>
<div class="top"><b>TAJIMA 第2工場 管理</b><div class="top-actions"><a class="machine-launch-btn" href="index.html">各号機 タブレット画面へ</a><span>PILOT v1.0</span></div></div>
<div class="wrap"><div id="err" class="card alert hidden"></div>
<div class="nav no-print">
<button class="btn primary" onclick="view('dash')">ダッシュボード</button><button class="btn" onclick="view('machines')">機械・工具管理</button>
<button class="btn" onclick="view('master')">製品・工程マスタ</button><button class="btn" onclick="view('arrival')">一括入荷</button>
<button class="btn" onclick="view('records')">工程記録 修正</button><button class="btn" onclick="view('shipping')">出荷登録</button>
<button class="btn" onclick="view('history')">履歴</button><button class="btn" onclick="view('trace')">品番履歴・印刷</button></div>

<section id="dash"><div class="grid3"><div class="card"><div class="muted">稼働機械</div><div id="dMachines" class="stat">-</div></div><div class="card"><div class="muted">工具注意</div><div id="dWarnings" class="stat">-</div></div><div class="card"><div class="muted">本日の作業登録</div><div id="dToday" class="stat">-</div></div></div>
<div class="card"><div class="title">機械状況・工具情報</div><div id="machineDash" class="grid3"></div></div>
<div class="grid2"><div class="card"><div class="title">最近の作業</div><div id="recentWork"></div></div><div class="card"><div class="title">最近の工具履歴</div><div id="recentTools"></div></div></div></section>

<section id="machines" class="hidden"><div class="grid2"><div class="card"><div class="title">機械登録</div><div class="row"><input id="machineName" class="fc" placeholder="例：1号機 / MPE"><input id="machineSlots" type="number" class="fc" value="80" min="1" max="300"><button class="btn primary" onclick="addMachine()">機械追加</button></div><div id="machineList"></div></div>
<div class="card"><div class="title">工具表 Excel 一括登録</div><select id="toolMachine" class="fc"></select><input id="toolFile" type="file" class="fc" accept=".xlsx,.xls,.csv" style="margin-top:8px"><div class="muted">先頭2列：T番号 / 名称。従来のExcel様式をそのまま使用。</div><textarea id="toolPaste" class="fc" style="height:110px;margin-top:8px" placeholder="Excelの2列をここへ貼付でもOK"></textarea><button class="btn" onclick="parsePaste()">貼付を読込</button><div id="toolPreview"></div><button class="btn primary big" onclick="applyTools()">選択機械へ工具表を反映</button></div></div>
<div class="card"><div class="title">機械別 工具台帳</div><select id="ledgerMachine" class="fc" onchange="renderLedger()"></select><div id="ledger"></div></div></section>

<section id="master" class="hidden"><div class="grid2"><div class="card"><div class="title">製品</div><div class="row"><input id="newProduct" class="fc" placeholder="KMX"><button class="btn primary" onclick="addProduct()">追加</button></div><div id="productList"></div></div>
<div class="card"><div class="title">工程</div><select id="masterProduct" class="fc" onchange="renderProcesses()"></select><div class="row"><input id="newProcess" class="fc" placeholder="MPE工程 / 荒引きからMPH工程"><input id="newOrder" type="number" class="fc" value="10"><button class="btn primary" onclick="addProcess()">追加</button></div><div id="processList"></div></div></div></section>

<section id="arrival" class="hidden"><div class="card"><div class="title">材料・品番 一括入荷</div><div class="row"><select id="arrProduct" class="fc"></select><input id="arrFrom" class="fc" inputmode="numeric" placeholder="開始 443"><input id="arrTo" class="fc" inputmode="numeric" placeholder="終了 470"><button class="btn primary big" onclick="batchArrival()">一括登録</button></div></div><div class="card"><div id="arrivalList"></div></div></section>

<section id="records" class="hidden"><div class="card"><div class="title">工程記録の追加・修正</div><div class="row"><select id="recProduct" class="fc" onchange="fillRecordItems()"></select><select id="recItem" class="fc"></select><select id="recProcess" class="fc"></select><select id="recMachine" class="fc"></select><input id="recTime" type="datetime-local" class="fc"><button class="btn primary" onclick="manualLog()">記録追加</button></div></div><div class="card"><div id="recordList"></div></div></section>

<section id="shipping" class="hidden">
<div class="ship-layout">
  <div class="card">
    <div class="title">出荷登録</div>
    <div class="muted" style="margin-bottom:8px">最終工程が完了した品番を出荷登録します。登録日時は自動保存されます。</div>
    <div id="shipList"></div>
  </div>
  <div class="card">
    <div class="ship-head">
      <div class="title" style="margin:0">出荷履歴（日別）</div>
      <div class="ship-month-nav">
        <button class="btn" onclick="changeShipMonth(-1)">◀</button>
        <div id="shipMonthTitle" class="ship-month-title"></div>
        <button class="btn" onclick="changeShipMonth(1)">▶</button>
        <button class="btn" onclick="shipToday()">今日</button>
      </div>
    </div>
    <div id="shipCalendar" class="ship-cal"></div>
    <div style="height:12px"></div>
    <div id="shipDayTitle" class="ship-day-summary"></div>
    <div id="shipDayList" class="ship-day-list"></div>
  </div>
</div>
</section>

<section id="history" class="hidden"><div class="card no-print"><div class="title">工場履歴</div><div class="row"><select id="hy" class="fc" onchange="renderHistory()"></select><select id="hm" class="fc" onchange="renderHistory()"></select><select id="hMachine" class="fc" onchange="renderHistory()"></select><select id="hType" class="fc" onchange="renderHistory()"><option value="all">すべて</option><option value="work">作業</option><option value="tool">工具</option><option value="arrival">入荷</option><option value="ship">出荷</option></select><select id="hView" class="fc" onchange="renderHistory()"><option value="list">月別一覧</option><option value="calendar">日別カレンダー</option></select></div></div><div class="card"><div id="historyBody"></div></div></section>

<section id="trace" class="hidden"><div class="card no-print"><div class="title">品番履歴・印刷</div><div class="row"><select id="traceProduct" class="fc" onchange="fillTraceItems()"></select><select id="traceItem" class="fc"></select><button class="btn primary" onclick="showTrace()">表示</button><button class="btn" onclick="window.print()">印刷</button></div></div><div id="tracePaper" class="card">製品・品番を選択してください。</div></section>
</div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const U=window.TAJIMA_SUPABASE_URL,K=window.TAJIMA_SUPABASE_ANON_KEY,H={"apikey":K,"Authorization":"Bearer "+K,"Content-Type":"application/json","Prefer":"return=representation"};
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])),dt=s=>s?new Date(s).toLocaleString("ja-JP"):"";
let machines=[],products=[],processes=[],routes=[],items=[],logs=[],tools=[],toolLogs=[],shipments=[],importRows=[];
let shipViewDate=new Date(),shipSelectedDate=new Date();
async function api(p,o={}){let r=await fetch(U+"/rest/v1/"+p,{...o,headers:{...H,...(o.headers||{})}});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):[]}
function fail(e){$("err").textContent="通信エラー: "+e.message;$("err").classList.remove("hidden")}
function view(id){["dash","machines","master","arrival","records","shipping","history","trace"].forEach(x=>$(x).classList.toggle("hidden",x!==id));if(id==="shipping")renderShippingHistory();if(id==="history")renderHistory();if(id==="trace")fillTraceItems()}
function opt(el,a,label,val="id",all=false){el.innerHTML=(all?'<option value="all">すべて</option>':'')+a.map(x=>`<option value="${x[val]}">${esc(label(x))}</option>`).join("")}
async function load(){
 try{
 [machines,products,processes,routes,items,logs,tools,toolLogs,shipments]=await Promise.all([
 api("f2_machines?active=eq.true&order=machine_no"),api("f2_products?active=eq.true&order=product_name"),api("f2_process_master?active=eq.true&order=product_id,sort_order,id"),api("f2_process_routes?select=*"),
 api("f2_items?select=*,f2_products(product_name)&order=arrival_at.desc"),api("f2_process_logs?select=*,f2_items(part_no,product_id,f2_products(product_name)),f2_process_master(process_name,is_final)&order=created_at.desc&limit=1000"),
 api("f2_tools?select=*&order=machine_no,t_no"),api("f2_tool_logs?select=*&order=created_at.desc&limit=1000"),api("f2_shipments?select=*&order=shipped_at.desc")]);
 fill();renderDash();renderMachines();renderLedger();renderProducts();renderProcesses();renderArrivals();fillRecordItems();renderRecords();renderShipping();renderShippingHistory();initHistory();
 }catch(e){fail(e)}
}
function fill(){for(const id of ["masterProduct","arrProduct","recProduct","traceProduct"])opt($(id),products,x=>x.product_name);for(const id of ["toolMachine","ledgerMachine","recMachine"])opt($(id),machines,x=>x.machine_name,"machine_no");opt($("hMachine"),machines,x=>x.machine_name,"machine_no",true)}
function mname(n){return machines.find(x=>x.machine_no==n)?.machine_name||n+"号機"}
function renderDash(){
 let today=new Date().toDateString();$("dMachines").textContent=machines.length;$("dWarnings").textContent=tools.filter(x=>x.attention||x.current_machine_no!=x.machine_no).length;$("dToday").textContent=logs.filter(x=>new Date(x.created_at).toDateString()==today).length;
 $("machineDash").innerHTML=machines.map(m=>{let l=logs.find(x=>x.machine_no==m.machine_no),ts=tools.filter(x=>x.machine_no==m.machine_no),warn=ts.filter(x=>x.attention||x.current_machine_no!=m.machine_no).length,ex=toolLogs.find(x=>x.machine_no==m.machine_no);return `<div class="box"><b>${esc(m.machine_name)}</b><br>${l?`${esc(l.f2_items?.f2_products?.product_name)} / ${esc(l.f2_items?.part_no)} / ${esc(l.f2_process_master?.process_name||"工程")}`:'<span class="muted">作業記録なし</span>'}<hr><span>工具 ${ts.length}本　⚠ ${warn}</span><br><span class="muted">${ex?"工具最終: "+dt(ex.created_at):"工具履歴なし"}</span></div>`}).join("");
 $("recentWork").innerHTML=logs.slice(0,20).map(x=>`<div class="box">${dt(x.created_at)}　<b>${esc(mname(x.machine_no))}</b>　${esc(x.f2_items?.f2_products?.product_name)} / ${esc(x.f2_items?.part_no)} / ${esc(x.f2_process_master?.process_name||"工程")}</div>`).join("");
 $("recentTools").innerHTML=toolLogs.slice(0,20).map(x=>{let t=tools.find(z=>z.id==x.tool_id);return `<div class="box">${dt(x.created_at)}　<b>${esc(mname(x.machine_no))}</b>　T${t?.t_no||"?"} ${esc(t?.tool_name||"")}　<span class="tag">${esc(x.action)}</span></div>`}).join("");
}
function renderMachines(){$("machineList").innerHTML=machines.map(m=>`<div class="box row"><div><b>${esc(m.machine_name)}</b>　No.${m.machine_no} / T1〜T${m.tool_slots}</div><a class="btn" href="machine.html?machine=${m.machine_no}" target="_blank">タブレット画面</a></div>`).join("")}
async function addMachine(){let name=$("machineName").value.trim(),slots=Math.max(1,Math.min(300,Number($("machineSlots").value)||80));if(!name)return;let no=machines.length?Math.max(...machines.map(x=>x.machine_no))+1:1;try{await api("f2_machines",{method:"POST",body:JSON.stringify({machine_no:no,machine_name:name,tool_slots:slots})});let rows=[];for(let t=1;t<=slots;t++)rows.push({machine_no:no,t_no:t,current_machine_no:no});await api("f2_tools?on_conflict=machine_no,t_no",{method:"POST",headers:{"Prefer":"resolution=ignore-duplicates,return=minimal"},body:JSON.stringify(rows)});$("machineName").value="";await load()}catch(e){fail(e)}}
document.getElementById("toolFile").addEventListener("change",async e=>{let f=e.target.files[0];if(!f)return;try{let b=await f.arrayBuffer(),wb=XLSX.read(b),ws=wb.Sheets[wb.SheetNames[0]],a=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});parseRows(a)}catch(e){fail(e)}});
function parseRows(a){importRows=[];for(let r of a){let raw=String(r[0]??"").trim(),name=String(r[1]??"").trim(),mm=raw.match(/(?:T)?\s*(\d{1,3})/i);if(mm){let n=Number(mm[1]);if(n>=1&&n<=300)importRows.push({t_no:n,tool_name:name})}}importRows=[...new Map(importRows.map(x=>[x.t_no,x])).values()].sort((a,b)=>a.t_no-b.t_no);$("toolPreview").innerHTML=`<div class="box"><b>${importRows.length}件 読込</b><br>${importRows.slice(0,12).map(x=>`T${x.t_no} ${esc(x.tool_name)}`).join(" / ")}${importRows.length>12?" ...":""}</div>`}
function parsePaste(){parseRows($("toolPaste").value.split(/\n/).map(x=>x.split(/\t|,/)))}
async function applyTools(){let no=Number($("toolMachine").value);if(!importRows.length)return alert("先にExcelまたは貼付データを読込してください");if(!confirm(`${mname(no)}へ ${importRows.length}件を反映しますか？`))return;try{for(const x of importRows){let ex=tools.find(t=>t.machine_no==no&&t.t_no==x.t_no);if(ex)await api(`f2_tools?id=eq.${ex.id}`,{method:"PATCH",body:JSON.stringify({tool_name:x.tool_name||null})});else await api("f2_tools",{method:"POST",body:JSON.stringify({machine_no:no,t_no:x.t_no,tool_name:x.tool_name||null,current_machine_no:no})})}await load();alert("工具表を反映しました")}catch(e){fail(e)}}
function renderLedger(){let no=Number($("ledgerMachine").value),a=tools.filter(x=>x.machine_no==no);$("ledger").innerHTML=`<table class="table"><tr><th>T</th><th>工具名</th><th>使用製品・工程</th><th>最終交換</th><th>状態</th></tr>${a.map(t=>{let l=toolLogs.find(x=>x.tool_id==t.id&&(x.action=="工具交換"||x.action=="チップ交換"));return `<tr class="${t.attention?"warnrow":""}"><td>T${t.t_no}</td><td>${esc(t.tool_name||"")}</td><td>${esc(t.usage_note||"")}</td><td>${l?esc(l.action)+" "+dt(l.created_at):"記録なし"}</td><td>${t.attention?"⚠ 注意":t.current_machine_no!=no?esc(mname(t.current_machine_no))+"で使用中":"正常"}</td></tr>`}).join("")}</table>`}
function renderProducts(){$("productList").innerHTML=products.map(x=>`<div class="box"><b>${esc(x.product_name)}</b></div>`).join("")}
async function addProduct(){let n=$("newProduct").value.trim();if(!n)return;try{await api("f2_products",{method:"POST",body:JSON.stringify({product_name:n})});$("newProduct").value="";await load()}catch(e){fail(e)}}
function renderProcesses(){let pid=Number($("masterProduct").value),ps=processes.filter(x=>x.product_id==pid);$("processList").innerHTML=ps.map(p=>{let ch=ps.filter(x=>x.id!=p.id).map(x=>`<label class="tag"><input type="checkbox" ${routes.some(r=>r.process_id==p.id&&r.prerequisite_process_id==x.id)?"checked":""} onchange="route(${p.id},${x.id},this.checked)"> ${esc(x.process_name)}</label>`).join("");return `<div class="box"><div class="row"><input class="fc" value="${esc(p.process_name)}" onchange="patchProcess(${p.id},'process_name',this.value)"><input class="fc" type="number" value="${p.sort_order}" onchange="patchProcess(${p.id},'sort_order',Number(this.value))"><label><input type="checkbox" ${p.is_final?"checked":""} onchange="patchProcess(${p.id},'is_final',this.checked)"> 最終工程</label><button class="btn" style="background:#fee2e2;color:#b91c1c;border-color:#fecaca" onclick="deleteProcess(${p.id},'${esc(p.process_name)}')">工程削除</button></div><div class="muted">進入条件（複数ならどれか1つ完了で可）</div>${ch}</div>`}).join("")}
async function addProcess(){let product_id=Number($("masterProduct").value),process_name=$("newProcess").value.trim(),sort_order=Number($("newOrder").value)||10;if(!process_name)return;try{await api("f2_process_master",{method:"POST",body:JSON.stringify({product_id,process_name,sort_order})});$("newProcess").value="";await load()}catch(e){fail(e)}}
async function patchProcess(id,k,v){try{await api(`f2_process_master?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({[k]:v})});await load()}catch(e){fail(e)}}
async function deleteProcess(id,name){
 if(!confirm(`「${name}」を削除しますか？\n過去の加工履歴は残ります。`))return;
 try{
  await api(`f2_process_routes?process_id=eq.${id}`,{method:"DELETE"});
  await api(`f2_process_routes?prerequisite_process_id=eq.${id}`,{method:"DELETE"});
  await api(`f2_process_master?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({active:false,is_final:false})});
  await load();
 }catch(e){fail(e)}
}
async function route(process_id,prerequisite_process_id,on){try{if(on)await api("f2_process_routes",{method:"POST",body:JSON.stringify({process_id,prerequisite_process_id})});else await api(`f2_process_routes?process_id=eq.${process_id}&prerequisite_process_id=eq.${prerequisite_process_id}`,{method:"DELETE"});await load()}catch(e){fail(e)}}
async function batchArrival(){let product_id=Number($("arrProduct").value),a=Number($("arrFrom").value),b=Number($("arrTo").value);if(!a||!b||b<a||b-a>1000)return alert("番号を確認してください");let rows=[];for(let n=a;n<=b;n++)rows.push({product_id,part_no:String(n),current_step:0,shipped:false,arrival_at:new Date().toISOString()});try{await api("f2_items?on_conflict=product_id,part_no",{method:"POST",headers:{"Prefer":"resolution=ignore-duplicates,return=minimal"},body:JSON.stringify(rows)});await load()}catch(e){fail(e)}}
function renderArrivals(){$("arrivalList").innerHTML=items.slice(0,100).map(x=>`<div class="box">${dt(x.arrival_at||x.created_at)}　<b>${esc(x.f2_products?.product_name)} / ${esc(x.part_no)}</b></div>`).join("")}
function fillRecordItems(){let pid=Number($("recProduct").value);opt($("recItem"),items.filter(x=>x.product_id==pid),x=>x.part_no);opt($("recProcess"),processes.filter(x=>x.product_id==pid),x=>x.process_name)}
$("recProduct").addEventListener("change",fillRecordItems);
async function manualLog(){let item_id=Number($("recItem").value),process_id=Number($("recProcess").value),machine_no=Number($("recMachine").value),created_at=$("recTime").value?new Date($("recTime").value).toISOString():new Date().toISOString();try{await api("f2_process_logs",{method:"POST",body:JSON.stringify({item_id,process_id,machine_no,step_no:1,created_at})});await load()}catch(e){fail(e)}}
function renderRecords(){$("recordList").innerHTML=logs.slice(0,100).map(x=>`<div class="box row"><div>${dt(x.created_at)}　<b>${esc(mname(x.machine_no))}</b>　${esc(x.f2_items?.f2_products?.product_name)} / ${esc(x.f2_items?.part_no)} / ${esc(x.f2_process_master?.process_name||"工程")}</div><button class="btn" onclick="editLog(${x.id})">修正</button><button class="btn" onclick="delLog(${x.id})">削除</button></div>`).join("")}
async function editLog(id){let x=logs.find(z=>z.id==id),t=prompt("日時 YYYY-MM-DD HH:MM",new Date(x.created_at).toLocaleString("sv-SE").slice(0,16).replace("T"," "));if(!t)return;let n=Number(prompt("機械番号",x.machine_no));try{await api(`f2_process_logs?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({created_at:new Date(t.replace(" ","T")).toISOString(),machine_no:n})});await load()}catch(e){fail(e)}}
async function delLog(id){if(!confirm("削除しますか？"))return;try{await api(`f2_process_logs?id=eq.${id}`,{method:"DELETE"});await load()}catch(e){fail(e)}}
function done(i,p){return logs.some(x=>x.item_id==i&&x.process_id==p)}
function renderShipping(){let finals=processes.filter(x=>x.is_final);$("shipList").innerHTML=items.filter(i=>!i.shipped&&finals.some(p=>p.product_id==i.product_id&&done(i.id,p.id))).map(i=>`<div class="box row"><b>${esc(i.f2_products?.product_name)} / ${esc(i.part_no)}</b><button class="btn primary" onclick="ship(${i.id})">出荷登録</button></div>`).join("")||"出荷可能品なし"}
async function ship(id){if(!confirm("出荷登録しますか？"))return;try{let n=new Date().toISOString();await api("f2_shipments",{method:"POST",body:JSON.stringify({item_id:id,shipped_at:n})});await api(`f2_items?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({shipped:true})});await load()}catch(e){fail(e)}}

function shipDateKey(v){let d=new Date(v);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function shipToday(){shipViewDate=new Date();shipSelectedDate=new Date();renderShippingHistory()}
function changeShipMonth(n){
 shipViewDate=new Date(shipViewDate.getFullYear(),shipViewDate.getMonth()+n,1);
 shipSelectedDate=new Date(shipViewDate.getFullYear(),shipViewDate.getMonth(),1);
 renderShippingHistory();
}
function selectShipDay(y,m,d){shipSelectedDate=new Date(y,m-1,d);renderShippingHistory()}
function renderShippingHistory(){
 if(!$("shipCalendar"))return;
 const y=shipViewDate.getFullYear(),m=shipViewDate.getMonth()+1;
 $("shipMonthTitle").textContent=`${y}年 ${m}月`;
 const first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();
 let html=["日","月","火","水","木","金","土"].map(x=>`<div class="ship-dow">${x}</div>`).join("");
 for(let i=0;i<first;i++)html+='<div class="ship-day empty"></div>';
 for(let d=1;d<=days;d++){
   const key=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
   const count=shipments.filter(x=>shipDateKey(x.shipped_at)===key).length;
   const selected=shipSelectedDate.getFullYear()===y&&shipSelectedDate.getMonth()+1===m&&shipSelectedDate.getDate()===d;
   const dow=new Date(y,m-1,d).getDay();
   html+=`<button class="ship-day ${selected?"selected":""} ${dow===0?"sun":dow===6?"sat":""}" onclick="selectShipDay(${y},${m},${d})"><span class="num">${d}</span>${count?`<div class="count">${count}件</div>`:""}</button>`;
 }
 $("shipCalendar").innerHTML=html;
 renderShipDayList();
}
function renderShipDayList(){
 const key=shipDateKey(shipSelectedDate);
 const a=shipments.filter(x=>shipDateKey(x.shipped_at)===key).sort((x,y)=>new Date(x.shipped_at)-new Date(y.shipped_at));
 $("shipDayTitle").textContent=`${shipSelectedDate.getFullYear()}年${shipSelectedDate.getMonth()+1}月${shipSelectedDate.getDate()}日　出荷 ${a.length}件`;
 $("shipDayList").innerHTML=a.map(x=>{
   const i=items.find(z=>z.id==x.item_id);
   const t=new Date(x.shipped_at).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
   return `<div class="box row"><div><b>${t}</b>　${esc(i?.f2_products?.product_name||"")} / ${esc(i?.part_no||"")}</div></div>`;
 }).join("")||'<div class="muted">この日の出荷登録はありません。</div>';
}

function initHistory(){let y=new Date().getFullYear();$("hy").innerHTML=Array.from({length:7},(_,i)=>`<option ${y-i==y?"selected":""}>${y-i}</option>`).join("");$("hm").innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1==new Date().getMonth()+1?"selected":""}>${i+1}月</option>`).join("");renderHistory()}
function histEvents(){
 let y=Number($("hy").value),m=Number($("hm").value),mn=$("hMachine").value,type=$("hType").value,a=[];
 if(type=="all"||type=="work") logs.forEach(x=>a.push({date:x.created_at,type:"作業",machine:x.machine_no,text:`${x.f2_items?.f2_products?.product_name||""} / ${x.f2_items?.part_no||""} / ${x.f2_process_master?.process_name||"工程"}`}));
 if(type=="all"||type=="tool") toolLogs.forEach(x=>{let t=tools.find(z=>z.id==x.tool_id);a.push({date:x.created_at,type:x.action,machine:x.machine_no,text:`T${t?.t_no||"?"} ${t?.tool_name||""}`})});
 if(type=="all"||type=="arrival") items.forEach(x=>a.push({date:x.arrival_at||x.created_at,type:"入荷",machine:null,text:`${x.f2_products?.product_name||""} / ${x.part_no}`}));
 if(type=="all"||type=="ship") shipments.forEach(x=>{let i=items.find(z=>z.id==x.item_id);a.push({date:x.shipped_at,type:"出荷",machine:null,text:`${i?.f2_products?.product_name||""} / ${i?.part_no||""}`})});
 return a.filter(e=>{let d=new Date(e.date);return d.getFullYear()==y&&d.getMonth()+1==m&&(mn=="all"||e.machine==Number(mn))}).sort((a,b)=>new Date(b.date)-new Date(a.date));
}
function renderHistory(){if(!$("hy").value)return;let a=histEvents();if($("hView").value=="list"){$("historyBody").innerHTML=a.map(e=>`<div class="box">${dt(e.date)}　<span class="tag">${esc(e.type)}</span>　${e.machine?`<b>${esc(mname(e.machine))}</b>　`:""}${esc(e.text)}</div>`).join("")||"記録なし";return}let y=Number($("hy").value),m=Number($("hm").value),days=new Date(y,m,0).getDate(),first=new Date(y,m-1,1).getDay(),h=["日","月","火","水","木","金","土"].map(x=>`<div><b>${x}</b></div>`).join("")+Array(first).fill("<div></div>").join("");for(let d=1;d<=days;d++){let ev=a.filter(e=>new Date(e.date).getDate()==d);h+=`<div class="day"><b>${d}</b>${ev.slice(0,5).map(e=>`<div class="dot">${esc(e.type)} ${esc(e.text)}</div>`).join("")}${ev.length>5?`<div class="dot">+${ev.length-5}</div>`:""}</div>`}$("historyBody").innerHTML=`<div class="cal">${h}</div>`}
function fillTraceItems(){let pid=Number($("traceProduct").value);opt($("traceItem"),items.filter(x=>x.product_id==pid),x=>x.part_no)}
async function showTrace(){let id=Number($("traceItem").value),i=items.find(x=>x.id==id);if(!i)return;let a=logs.filter(x=>x.item_id==id).sort((x,y)=>new Date(x.created_at)-new Date(y.created_at)),s=shipments.find(x=>x.item_id==id);$("tracePaper").innerHTML=`<h2>TAJIMA 第2工場 加工履歴票</h2><table class="table"><tr><th>製品</th><td>${esc(i.f2_products?.product_name)}</td><th>品番</th><td>${esc(i.part_no)}</td></tr><tr><th>入荷</th><td>${dt(i.arrival_at||i.created_at)}</td><th>出荷</th><td>${s?dt(s.shipped_at):"未出荷"}</td></tr></table><h3>工程履歴</h3><div class="timeline">${a.map(x=>`<div class="event"><b>${dt(x.created_at)}</b><br>${esc(x.f2_process_master?.process_name||"工程")} / ${esc(mname(x.machine_no))}${x.attention?" ⚠変動事項あり":""}</div>`).join("")||"工程記録なし"}</div>`}
load();
</script></body></html>
