<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>TAJIMA 工場表示 TEST v0.24</title><script src="config.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8;font-family:"Yu Gothic",sans-serif;color:#111;font-weight:600}.wrap{height:100vh;padding:8px;display:grid;grid-template-columns:4fr 1fr;gap:8px}.board{display:grid;grid-template-rows:auto 1fr 1fr;gap:5px}.title{text-align:center;font-size:24px;font-weight:900}.half{display:grid;gap:3px}.day{border:1px solid #6b7280;background:white;min-width:0;overflow:hidden}.day.holiday{background:#fee2e2}.num{text-align:center;font-weight:900;border-bottom:1px solid #bbb;padding:2px;font-size:13px}.holiday .num{color:#b91c1c}.it{font-size:10px;line-height:1.15;font-weight:800;padding:2px 3px;margin:2px;border:1px solid #aaa;border-radius:3px;overflow:hidden}.stamp{color:#b91c1c;font-weight:900}.memo{font-size:9px;font-weight:600;margin-top:1px;white-space:normal;color:#2563eb}.side{border:1px solid #64748b;background:#fff;padding:10px;overflow:hidden}.side h2{text-align:center;margin:0 0 10px}.notice{padding:7px 4px;border-bottom:1px solid #ddd;font-weight:700}


/* ===== v0.9 shared-board readability =====
   Each scheduled job owns its own black framed writing area. */
.it{
  border:1.5px solid #111 !important;
  border-radius:4px !important;
  background:#fff !important;
  margin:2px 0 5px !important;
  padding:3px 4px !important;
  min-height:0 !important;
  line-height:1.18 !important;
  font-weight:800 !important;
  position:relative !important;
  overflow:hidden !important;
}
.it:last-child{margin-bottom:2px !important}


/* v0.14: compact job text to prevent clipping */
.it{font-size:10px !important;line-height:1.15 !important;font-weight:600 !important;white-space:normal !important;overflow-wrap:anywhere !important;word-break:break-word !important}
.it .company{font-size:10px;font-weight:700;line-height:1.15}
.it .part{font-size:10px;font-weight:700;line-height:1.15;margin-top:1px}
.it .machine{font-size:9px;font-weight:600;line-height:1.15;margin-top:1px;color:#2563eb}

/* v0.19: busy-day automatic vertical compression */
.day.compress-1 .it{margin:1px 0 2px !important;padding:2px 3px !important}
.day.compress-1 .it .company,.day.compress-1 .it .part{line-height:1.08}
.day.compress-1 .it .machine,.day.compress-1 .it .memo{line-height:1.08}

.day.compress-2 .it{margin:1px 0 1px !important;padding:1px 2px !important}
.day.compress-2 .it,.day.compress-2 .it .company,.day.compress-2 .it .part{font-size:9px !important;line-height:1.02}
.day.compress-2 .it .machine,.day.compress-2 .it .memo{font-size:8px !important;line-height:1.02}

.day.compress-3 .it{margin:0 !important;padding:1px 1px !important;border-width:1px !important}
.day.compress-3 .it,.day.compress-3 .it .company,.day.compress-3 .it .part{font-size:8px !important;line-height:1}
.day.compress-3 .it .machine,.day.compress-3 .it .memo{font-size:7px !important;line-height:1}

</style></head><body>
<div class="wrap"><div class="board"><div id="title" class="title"></div><div id="boardTop" class="half"></div><div id="boardBottom" class="half"></div></div><div class="side"><h2>連絡事項</h2><div id="syncStatus" style="font-size:9px;color:#64748b;text-align:center;margin-bottom:6px"></div><div id="notices"></div></div></div>
<script>
const C=window.TAJIMA_CONFIG||window.CONFIG||{}, SUPABASE_URL=C.SUPABASE_URL||"", SUPABASE_KEY=C.SUPABASE_PUBLISHABLE_KEY||C.SUPABASE_ANON_KEY||C.SUPABASE_KEY||"";
const API=n=>`${SUPABASE_URL}/rest/v1/${n}`;
const H=()=>({"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json","Prefer":"return=representation"});
const ok=()=>SUPABASE_URL&&SUPABASE_KEY;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function get(t,q=""){let r=await fetch(API(t)+q,{headers:H(),cache:"no-store"});if(!r.ok)throw Error(await r.text());return r.json()}
async function post(t,row){let r=await fetch(API(t),{method:"POST",headers:H(),body:JSON.stringify(row)});if(!r.ok)throw Error(await r.text());return r.json()}
async function patch(t,id,row){let r=await fetch(`${API(t)}?id=eq.${id}`,{method:"PATCH",headers:H(),body:JSON.stringify(row)});if(!r.ok)throw Error(await r.text());return r.json()}
async function del(t,id){let r=await fetch(`${API(t)}?id=eq.${id}`,{method:"DELETE",headers:H()});if(!r.ok)throw Error(await r.text())}
const ym=(y,m)=>`${y}-${String(m).padStart(2,"0")}`;
const iso=(y,m,d)=>`${ym(y,m)}-${String(d).padStart(2,"0")}`;
const colors=["#ef4444","#eab308","#22c55e","#06b6d4","#8b5cf6","#ec4899"];
function inMonth(date,y,m){return !!date && String(date).startsWith(`${ym(y,m)}-`)}

let n=new Date();
const q=new URLSearchParams(location.search);
let Y=Number(q.get("year"))||n.getFullYear(), M=Number(q.get("month"))||n.getMonth()+1;
let lastSystemYM=`${n.getFullYear()}-${n.getMonth()+1}`;

function updateMonthLabel(){const el=document.getElementById("monthNavLabel");if(el)el.textContent=`${Y}年${M}月`}
async function changeMonth(d){M+=d;if(M<1){M=12;Y--}if(M>12){M=1;Y++}updateMonthLabel();await load()}
async function goCurrentMonth(){const d=new Date();Y=d.getFullYear();M=d.getMonth()+1;updateMonthLabel();await load()}
function autoMonthCheck(){const d=new Date(),sys=`${d.getFullYear()}-${d.getMonth()+1}`;if(sys!==lastSystemYM){lastSystemYM=sys;Y=d.getFullYear();M=d.getMonth()+1;updateMonthLabel();load()}}

async function load(){
  const st=document.getElementById("syncStatus");
  if(!ok()){if(st)st.textContent="設定エラー";return}
  try{
    let [all,e,h,noticeRows]=await Promise.all([
      get("schedule_jobs","?select=*&due_date=not.is.null&order=due_date.asc,id.asc"),
      get("schedule_events","?select=*&order=event_date.asc"),
      get("schedule_holidays","?select=*"),
      get("schedule_notices","?id=eq.1&select=notice_text,updated_at")
    ]);
    let j=all.filter(x=>inMonth(x.due_date,Y,M));
    e=e.filter(x=>inMonth(x.event_date,Y,M));
    h=h.filter(x=>inMonth(x.holiday_date,Y,M));
    draw(j,e,h,noticeRows?.[0]?.notice_text||"");
    if(st)st.textContent=`同期済み ${new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"})} / 案件 ${j.length}件`;
  }catch(err){
    console.error(err);
    if(st)st.textContent="読込エラー";
  }
}
function draw(j,e,h,noticeText){
  const titleEl=document.getElementById("title");
  const topEl=document.getElementById("boardTop");
  const bottomEl=document.getElementById("boardBottom");
  const noticesEl=document.getElementById("notices");
  if(!titleEl||!topEl||!bottomEl||!noticesEl){console.error("monitor DOM missing");return}
  titleEl.textContent=`${Y}年 ${M}月　納期予定`;
  let last=new Date(Y,M,0).getDate(),split=Math.ceil(last/2);
  drawHalf(topEl,1,split,j,e,h);
  drawHalf(bottomEl,split+1,last,j,e,h);
  noticesEl.innerHTML=noticeText
    ? `<div class="notice">${esc(noticeText).replaceAll("\n","<br>")}</div>`
    : '<div class="notice">連絡事項なし</div>';
}
function groupKey(x){return x.job_group_id?`g:${x.job_group_id}`:`s:${x.id}`}
function groupedRows(a){const m=new Map();a.forEach(x=>{const k=groupKey(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});return [...m.values()].map(g=>g.sort((a,b)=>Number(a.id)-Number(b.id)))}
function drawHalf(el,a,b,j,e,h){let cnt=b-a+1;el.style.gridTemplateColumns=`repeat(${cnt},1fr)`;let s="";for(let d=a;d<=b;d++){let date=iso(Y,M,d),hol=new Date(Y,M-1,d).getDay()===0||h.some(x=>x.holiday_date===date);s+=`<div class="day ${hol?"holiday":""}"><div class="num">${d}日</div>`;groupedRows(j.filter(x=>x.due_date===date)).forEach(g=>s+=item(g));e.filter(x=>x.event_date===date).forEach(x=>s+=`<div class="it" style="${x.accent_color?`border:2px solid ${x.accent_color}`:""}">◆ ${esc(x.title)}</div>`);s+="</div>"}el.innerHTML=s}
function item(g){
  const x=g[0],accentStyle=x.accent_color?`outline:2px solid ${x.accent_color};outline-offset:1px;`:"";
  const parts=g.map(v=>`<div class="part">${esc(v.part_no)}</div>`).join("");
  return `<div class="it" style="${accentStyle}"><div class="company">${esc(x.company_name)}</div>${parts}${x.machine_name?`<div class="machine">${esc(x.machine_name)}</div>`:""}${x.memo?`<div class="memo">${esc(x.memo)}</div>`:""}</div>`;
}

updateMonthLabel();setInterval(autoMonthCheck,60000);

load();setInterval(load,10000);

function autoCompressBusyDays(){
  document.querySelectorAll(".day").forEach(day=>{
    day.classList.remove("compress-1","compress-2","compress-3");
    if(day.scrollHeight<=day.clientHeight+1)return;
    day.classList.add("compress-1");
    if(day.scrollHeight<=day.clientHeight+1)return;
    day.classList.add("compress-2");
    if(day.scrollHeight<=day.clientHeight+1)return;
    day.classList.add("compress-3");
  });
}
function scheduleAutoCompress(){
  requestAnimationFrame(()=>requestAnimationFrame(autoCompressBusyDays));
}
window.addEventListener("resize",scheduleAutoCompress);


const busyDayObserver=new MutationObserver(()=>scheduleAutoCompress());
busyDayObserver.observe(document.body,{childList:true,subtree:true,characterData:true});
scheduleAutoCompress();

</script></body></html>
