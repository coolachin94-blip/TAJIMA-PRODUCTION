<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAJIMA 工場表示 TEST</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fafc;font-family:"Yu Gothic",Meiryo,sans-serif;color:#0f172a}.screen{height:100%;display:grid;grid-template-columns:4fr 1fr}.main{display:flex;flex-direction:column;min-width:0}.title{height:7vh;display:flex;align-items:center;justify-content:center;font-size:3.2vh;font-weight:900;background:#0f3d91;color:#fff;position:relative}.clock{position:absolute;right:1.2vw;font-size:1.5vh}.rows{height:93vh;display:grid;grid-template-rows:1fr 1fr;gap:.7vh;padding:.7vh}.calrow{display:grid;gap:.25vw}.day{background:#fff;border:1px solid #cbd5e1;border-radius:.35vw;min-width:0;overflow:hidden;display:flex;flex-direction:column}.day.off{background:#fff1f2;border-color:#fca5a5}.date{font-size:1.45vh;font-weight:900;padding:.28vh .18vw;text-align:center;background:#eff6ff;border-bottom:1px solid #dbeafe;white-space:nowrap}.off .date{background:#fee2e2;color:#b91c1c}.items{padding:.24vh .16vw;display:flex;flex-direction:column;gap:.22vh;overflow:hidden}.item{font-size:1.08vh;line-height:1.18;padding:.28vh .2vw;border:1.7px solid transparent;border-radius:.24vw;background:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}.item.done{opacity:.55}.stamp{font-size:.8em;color:#b91c1c}.event{background:#fefce8}.side{border-left:.25vw solid #0f3d91;background:#fff;display:flex;flex-direction:column}.side h2{font-size:2.1vh;margin:0;padding:1.2vh 1vw;background:#eff6ff;color:#0f3d91}.notice{padding:1.2vh 1vw;font-size:1.55vh;line-height:1.65;white-space:pre-wrap;overflow:hidden}.legend{margin-top:auto;padding:1vh 1vw;font-size:1.05vh;color:#64748b;border-top:1px solid #e2e8f0}.ink{position:fixed;inset:0;pointer-events:none}</style></head><body><div class="screen"><main class="main"><div class="title"><span id="monthTitle"></span><span id="clock" class="clock"></span></div><div class="rows"><div id="top" class="calrow"></div><div id="bottom" class="calrow"></div></div></main><aside class="side"><h2>連絡事項</h2><div id="notice" class="notice"></div><div class="legend">入＝入荷　出＝納期/出荷　済＝完了<br>赤背景＝休日</div></aside></div><canvas id="ink" class="ink"></canvas><script src="config.js"></script><script>
const C=window.TAJIMA_CONFIG||{},URL=C.SUPABASE_URL||"",KEY=C.SUPABASE_KEY||"",H={"apikey":KEY,"Authorization":`Bearer ${KEY}`,"Content-Type":"application/json"},api=n=>`${URL}/rest/v1/${n}`;let jobs=[],events=[],holidays=[],strokes=[];const now=new Date(),Y=now.getFullYear(),M=now.getMonth()+1;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function get(n,q=""){const r=await fetch(api(n)+(q?"?"+q:""),{headers:H});if(!r.ok)throw Error(await r.text());return r.json()}function dk(d){return `${Y}-${String(M).padStart(2,"0")}-${String(d).padStart(2,"0")}`}function isOff(d){const k=dk(d);return new Date(Y,M-1,d).getDay()===0||holidays.some(x=>x.holiday_date===k)}
function itemsFor(d){const k=dk(d),a=[];jobs.forEach(j=>{if(j.arrival_date===k)a.push({t:`入 ${j.company_name} ${j.part_no}${j.machine_name?" "+j.machine_name:""}`,c:j.highlight_color,done:j.status==="done"});if(j.due_date===k)a.push({t:`出 ${j.company_name} ${j.part_no}${j.machine_name?" "+j.machine_name:""}`,c:j.highlight_color,done:j.status==="done"})});events.filter(e=>e.event_date===k).forEach(e=>a.push({t:`◆ ${e.event_text}`,c:e.highlight_color,event:true}));return a}function cell(d){const a=itemsFor(d);return `<div class="day ${isOff(d)?"off":""}"><div class="date">${d}日</div><div class="items">${a.slice(0,7).map(x=>`<div class="item ${x.done?"done":""} ${x.event?"event":""}" style="${x.c?`border-color:${x.c}`:""}">${x.done?'<span class="stamp">済 </span>':""}${esc(x.t)}</div>`).join("")}${a.length>7?`<div class="item">＋${a.length-7}件</div>`:""}</div></div>`}function draw(){const days=new Date(Y,M,0).getDate(),split=15;top.style.gridTemplateColumns=`repeat(${split},1fr)`;bottom.style.gridTemplateColumns=`repeat(${days-split},1fr)`;top.innerHTML=Array.from({length:split},(_,i)=>cell(i+1)).join("");bottom.innerHTML=Array.from({length:days-split},(_,i)=>cell(i+16)).join("");monthTitle.textContent=`${Y}年 ${M}月　入荷・納期予定`}
function resizeInk(){const r=document.body.getBoundingClientRect();ink.width=r.width*devicePixelRatio;ink.height=r.height*devicePixelRatio;ink.style.width=r.width+"px";ink.style.height=r.height+"px";const x=ink.getContext("2d");x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);drawInk()}function drawInk(){const x=ink.getContext("2d"),r=ink.getBoundingClientRect();x.clearRect(0,0,r.width,r.height);strokes.forEach(s=>{const p=s.stroke_data||s;if(!p.points?.length)return;x.strokeStyle=p.color||"#111";x.lineWidth=p.width||3;x.lineCap="round";x.lineJoin="round";x.beginPath();p.points.forEach((q,i)=>i?x.lineTo(q.x*r.width,q.y*r.height):x.moveTo(q.x*r.width,q.y*r.height));x.stroke()})}
async function load(){const a=`${Y}-${String(M).padStart(2,"0")}-01`,b=M===12?`${Y+1}-01-01`:`${Y}-${String(M+1).padStart(2,"0")}-01`,m=`${Y}-${String(M).padStart(2,"0")}`;const [j,e,h,n,s]=await Promise.all([get("board_test_jobs","select=*"),get("board_test_events",`select=*&event_date=gte.${a}&event_date=lt.${b}`),get("board_test_holidays",`select=*&holiday_date=gte.${a}&holiday_date=lt.${b}`),get("board_test_notices","select=*&id=eq.1"),get("board_test_strokes",`select=*&month_key=eq.${m}&order=id.asc`)]);jobs=j;events=e;holidays=h;strokes=s;notice.textContent=n[0]?.content||"";draw();drawInk()}function tick(){clock.textContent=new Date().toLocaleString("ja-JP",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}addEventListener("resize",resizeInk);resizeInk();tick();setInterval(tick,30000);load().catch(console.error);setInterval(()=>load().catch(()=>{}),15000);
</script></body></html>
