<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TAJIMA 勤怠</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif;background:#f1f5f9;color:#0f172a}.wrap{max-width:430px;margin:auto;padding:28px 16px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 32px rgba(15,23,42,.09)}h1{text-align:center;font-size:27px;margin:5px 0 22px}.code{width:100%;font-size:34px;text-align:center;padding:15px;border:2px solid #cbd5e1;border-radius:15px;font-weight:900}.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}button{min-height:88px;border:0;border-radius:19px;color:#fff;font-size:23px;font-weight:900}.in{background:#16a34a}.out{background:#2563eb}.msg{text-align:center;min-height:78px;padding-top:18px;font-weight:900;font-size:17px;white-space:pre-line}.small{text-align:center;color:#94a3b8;font-size:11px}</style></head><body><div class="wrap"><div class="card"><h1>TAJIMA 勤怠</h1><input id="code" class="code" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="社員番号"><div class="btns"><button class="in" onclick="punch('in')">出勤</button><button class="out" onclick="punch('out')">退勤</button></div><div id="msg" class="msg"></div><div class="small">タイムカード集計補助</div></div></div><script src="config.js"></script><script>const C=window.TAJIMA_CONFIG||{},U=C.SUPABASE_URL||"",K=C.SUPABASE_KEY||"",E=`${U}/rest/v1/attendance_employees`,P=`${U}/rest/v1/attendance_punches`;const H=()=>({apikey:K,Authorization:`Bearer ${K}`,"Content-Type":"application/json",Prefer:"return=representation"});let busy=false;async function punch(t){if(busy)return;const c=code.value.trim();if(!c){msg.textContent="社員番号を入力してください";return}busy=true;msg.textContent="記録中…";try{let r=await fetch(`${E}?select=id,employee_name&employee_code=eq.${encodeURIComponent(c)}&is_active=eq.true`,{headers:H()});if(!r.ok)throw 0;let a=await r.json();if(!a.length){msg.textContent="社員番号が見つかりません";return}let e=a[0];r=await fetch(P,{method:"POST",headers:H(),body:JSON.stringify([{employee_id:e.id,punch_type:t,punched_at:new Date().toISOString(),source:"qr"}])});if(!r.ok)throw 0;let n=new Date();msg.textContent=`${e.employee_name}さん\n${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")} ${t==="in"?"出勤":"退勤"}を記録しました ✓`;code.value=""}catch(e){msg.textContent="通信・記録エラーです"}finally{busy=false}}</script></body></html>
