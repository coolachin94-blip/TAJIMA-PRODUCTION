<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAJIMA 事務所ボード TEST</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Yu Gothic",Meiryo,sans-serif}.bar{height:48px;background:#0f172a;color:#fff;display:flex;align-items:center;gap:7px;padding:5px 10px}.bar button{border:0;border-radius:8px;padding:7px 10px;font-weight:800}.wrap{position:relative;height:calc(100% - 48px)}iframe{width:100%;height:100%;border:0}.draw{position:absolute;inset:0;touch-action:none;pointer-events:none}.draw.active{pointer-events:auto}.penon{background:#ef4444;color:white}.penoff{background:#e2e8f0}</style></head><body><div class="bar"><b>事務所ボード TEST</b><button id="penBtn" class="penoff" onclick="togglePen()">✎ ペン OFF</button><button onclick="setPen('#111827')">黒</button><button onclick="setPen('#ef4444')">赤</button><button onclick="undo()">↶ 戻す</button><button onclick="clearAll()">全消去</button><button onclick="location.href='board-test-admin.html'">管理へ</button><span style="margin-left:auto;font-size:12px">RICOH実機確認前のTEST</span></div><div class="wrap"><iframe src="board-test-monitor.html?office=1"></iframe><canvas id="cv" class="draw"></canvas></div><script src="config.js"></script><script>
const C=window.TAJIMA_CONFIG||{},URL=C.SUPABASE_URL||"",KEY=C.SUPABASE_KEY||"",API=`${URL}/rest/v1/board_test_strokes`,H={"apikey":KEY,"Authorization":`Bearer ${KEY}`,"Content-Type":"application/json","Prefer":"return=representation"};const cv=document.getElementById("cv"),penBtnEl=document.getElementById("penBtn"),ctx=cv.getContext("2d");let active=false,color="#111827",drawing=false,current=[],strokes=[];
function resize(){const r=cv.parentElement.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;cv.style.width=r.width+"px";cv.style.height=r.height+"px";ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);redraw()}addEventListener("resize",resize);function togglePen(){active=!active;cv.classList.toggle("active",active);penBtnEl.textContent=active?"✎ ペン ON":"✎ ペン OFF";penBtnEl.className=active?"penon":"penoff"}function setPen(c){color=c}function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
cv.addEventListener("pointerdown",e=>{if(!active)return;drawing=true;current=[pt(e)];cv.setPointerCapture(e.pointerId);e.preventDefault()});cv.addEventListener("pointermove",e=>{if(!drawing)return;current.push(pt(e));redraw();drawStroke({points:current,color,width:3});e.preventDefault()});cv.addEventListener("pointerup",async e=>{if(!drawing)return;drawing=false;if(current.length>1){const s={points:current,color,width:3};strokes.push(s);await saveStroke(s)}current=[];redraw();e.preventDefault()});
function drawStroke(s){if(!s.points?.length)return;const r=cv.getBoundingClientRect();ctx.strokeStyle=s.color||"#111";ctx.lineWidth=s.width||3;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();s.points.forEach((p,i)=>i?ctx.lineTo(p.x*r.width,p.y*r.height):ctx.moveTo(p.x*r.width,p.y*r.height));ctx.stroke()}function redraw(){ctx.clearRect(0,0,cv.width/devicePixelRatio,cv.height/devicePixelRatio);strokes.forEach(drawStroke)}
async function saveStroke(s){await fetch(API,{method:"POST",headers:H,body:JSON.stringify([{month_key:new Date().toISOString().slice(0,7),stroke_data:s,created_at:new Date().toISOString()}])})}async function loadStrokes(){const m=new Date().toISOString().slice(0,7),r=await fetch(`${API}?month_key=eq.${m}&select=*&order=id.asc`,{headers:H});if(r.ok){strokes=(await r.json()).map(x=>x.stroke_data);redraw()}}async function undo(){const m=new Date().toISOString().slice(0,7),r=await fetch(`${API}?month_key=eq.${m}&select=*&order=id.desc&limit=1`,{headers:H});if(!r.ok)return;const a=await r.json();if(a.length){await fetch(`${API}?id=eq.${a[0].id}`,{method:"DELETE",headers:H});await loadStrokes()}}async function clearAll(){if(!confirm("今月の手書きを全部消しますか？"))return;const m=new Date().toISOString().slice(0,7);await fetch(`${API}?month_key=eq.${m}`,{method:"DELETE",headers:H});strokes=[];redraw()}resize();loadStrokes();setInterval(loadStrokes,15000);
</script></body></html>
