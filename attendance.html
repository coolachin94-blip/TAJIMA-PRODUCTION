<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAJIMA 勤怠</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif;background:#f1f5f9}.wrap{max-width:430px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px #0f172a14}h1{text-align:center}.code{width:100%;font-size:32px;text-align:center;padding:14px;border:2px solid #cbd5e1;border-radius:14px;font-weight:900}.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}button{min-height:82px;border:0;border-radius:18px;color:#fff;font-size:22px;font-weight:900}.i{background:#16a34a}.o{background:#2563eb}.msg{text-align:center;min-height:70px;padding-top:16px;font-weight:800}.small{text-align:center;color:#64748b;font-size:12px}</style></head><body><div class="wrap"><div class="card"><h1>TAJIMA 勤怠</h1><input id="code" class="code" inputmode="numeric" placeholder="社員番号"><div class="btns"><button class="i" onclick="punch('in')">出勤</button><button class="o" onclick="punch('out')">退勤</button></div><div id="msg" class="msg"></div><div class="small">タイムカード集計補助</div></div></div><script src="config.js"></script><script>const C=window.TAJIMA_CONFIG||{},U=C.SUPABASE_URL||"",K=C.SUPABASE_KEY||"",E=`${U}/rest/v1/attendance_employees`,P=`${U}/rest/v1/attendance_punches`;const H=()=>({apikey:K,Authorization:`Bearer ${K}`,"Content-Type":"application/json",Prefer:"return=representation"});async function punch(t){let c=code.value.trim();if(!c){msg.textContent="社員番号を入力してください";return}msg.textContent="記録中…";try{let r=await fetch(`${E}?select=id,employee_name&employee_code=eq.${encodeURIComponent(c)}&is_active=eq.true`,{headers:H()}),a=await r.json();if(!a.length){msg.textContent="社員番号が見つかりません";return}let e=a[0];r=await fetch(P,{method:"POST",headers:H(),body:JSON.stringify([{employee_id:e.id,punch_type:t,punched_at:new Date().toISOString(),source:"qr"}])});if(!r.ok){msg.textContent="記録エラー";return}let n=new Date();msg.textContent=`${e.employee_name}さん　${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")} ${t==="in"?"出勤":"退勤"} ✓`;code.value=""}catch(e){msg.textContent="通信エラー"}}</script></body></html>
