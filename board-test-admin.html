<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAJIMA 工場モニター TEST 管理 v11.20</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8ff;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 13px;font-weight:800}.btn{background:#2563eb;color:#fff}.light{background:#eff6ff;color:#0f3d91;border:1px solid #bfdbfe}.green{background:#16a34a;color:white}.red{background:#dc2626;color:white}.purple{background:#7c3aed;color:white}.card{background:#fff;border:2px solid #dbeafe;border-radius:17px;padding:14px;margin-bottom:12px}input,select,textarea{width:100%;padding:10px;border:2px solid #dbeafe;border-radius:10px;background:#fff}label{font-size:12px;font-weight:800;color:#475569;display:block;margin:7px 0 4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hidden{display:none!important}.muted{font-size:12px;color:#64748b}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:900}@media(max-width:650px){.grid2{grid-template-columns:1fr}}
body{padding:12px}.wrap{max-width:1100px;margin:auto}.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.head h1{font-size:22px;margin:0 auto 0 0;color:#991b1b}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tabs button.active{background:#1d4ed8;color:white}.colors{display:flex;gap:7px;flex-wrap:wrap}.color{width:31px;height:31px;border-radius:8px;border:3px solid transparent;padding:0}.color.selected{border-color:#111827;transform:scale(1.08)}.job{border:1px solid #dbeafe;border-radius:13px;padding:10px;margin:8px 0}.job.done{opacity:.65}.jobtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.job b{font-size:17px}.company-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.company-btn{text-align:left;background:#f8fbff;border:1px solid #bfdbfe;color:#1e3a8a}.holiday-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.hday{min-height:45px;background:#fff;border:1px solid #dbeafe;border-radius:8px;padding:5px}.hday.off{background:#fee2e2;color:#991b1b;border-color:#fca5a5}.dow{text-align:center;font-size:11px;font-weight:900;color:#64748b}.event{border-left:5px solid #64748b;background:#f8fafc;padding:9px;border-radius:9px;margin:7px 0}</style></head><body><div class="wrap">
<div class="head"><h1>工場モニター TEST 管理 <span style="font-size:12px;background:#fee2e2;color:#991b1b;padding:3px 7px;border-radius:999px">v11.20</span></h1><button class="light" onclick="location.href='index.html'">TAJIMAへ戻る</button><button class="purple" onclick="location.href='board-test-office.html?v=1120'">事務所ボードを開く</button><button class="light" onclick="window.open('board-test-monitor.html?v=1120','_blank')">工場表示を開く</button></div>
<div class="muted">TEST専用。既存の生産・材料発注・勤怠とは別データです。</div>
<div class="tabs"><button id="tabJobs" class="active" onclick="showTab('jobs')">仕事登録・編集</button><button id="tabCompanies" onclick="showTab('companies')">会社別履歴</button><button id="tabEvents" onclick="showTab('events')">行事・点検</button><button id="tabHolidays" onclick="showTab('holidays')">休日設定</button><button id="tabNotices" onclick="showTab('notices')">伝達事項</button></div>
<section id="secJobs"><div class="card"><h3>仕事登録</h3><div class="grid2"><div><label>会社名 *</label><input id="company" list="companyList"><datalist id="companyList"></datalist></div><div><label>品番 *</label><input id="partNo"></div><div><label>担当機械（未定可）</label><input id="machine" list="machineList"><datalist id="machineList"></datalist></div><div><label>納期日 *</label><input id="dueDate" type="date"></div><div><label>入荷日（未定可）</label><input id="arrivalDate" type="date"></div><div><label>予定入荷情報</label><input id="arrivalPlan" placeholder="例：納期5日前予定"></div></div><label>メモ</label><textarea id="jobMemo" rows="2"></textarea><label>強調色</label><div id="jobColors" class="colors"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="green" onclick="saveJob()">登録</button><button class="light" onclick="clearJobForm()">クリア</button></div></div><div class="card"><h3>進行中</h3><div id="jobList"></div></div></section>
<section id="secCompanies" class="hidden"><div class="card"><h3>会社別ページ</h3><div id="companies" class="company-list"></div></div><div class="card"><div id="companyDetail" class="muted">会社名を選択してください。</div></div></section>
<section id="secEvents" class="hidden"><div class="card"><h3>行事・点検・イベント</h3><div class="grid2"><div><label>日付</label><input id="eventDate" type="date"></div><div><label>内容</label><input id="eventText"></div></div><label>強調色</label><div id="eventColors" class="colors"></div><button class="green" style="margin-top:12px" onclick="saveEvent()">登録</button></div><div class="card"><div id="eventList"></div></div></section>
<section id="secHolidays" class="hidden"><div class="card"><div style="display:flex;gap:8px;align-items:center"><button class="light" onclick="changeHolMonth(-1)">◀</button><h3 id="holTitle" style="margin:auto"></h3><button class="light" onclick="changeHolMonth(1)">▶</button></div><div class="muted">日曜は自動休日。会社休日・休みの土曜は日付を押して赤く設定。</div><div id="holidayCal" class="holiday-grid"></div></div></section>
<section id="secNotices" class="hidden"><div class="card"><h3>伝達事項</h3><textarea id="noticeText" rows="8"></textarea><button class="green" style="margin-top:10px" onclick="saveNotice()">保存</button></div></section></div>
<script src="config.js"></script><script>
const C=window.TAJIMA_CONFIG||{},URL=C.SUPABASE_URL||"",KEY=C.SUPABASE_KEY||"";const api=n=>`${URL}/rest/v1/${n}`;const hdr=(pref="return=representation")=>({"apikey":KEY,"Authorization":`Bearer ${KEY}`,"Content-Type":"application/json","Prefer":pref});
const COLORS=["","#ef4444","#f97316","#eab308","#22c55e","#06b6d4","#3b82f6","#8b5cf6","#ec4899"];let jobs=[],events=[],holidays=[],notice=[],jobColor="",eventColor="",editingId=null,hy=new Date().getFullYear(),hm=new Date().getMonth()+1;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function get(t,q=""){const r=await fetch(api(t)+(q?"?"+q:""),{headers:hdr()});if(!r.ok)throw Error(await r.text());return r.json()}async function post(t,row){const r=await fetch(api(t),{method:"POST",headers:hdr(),body:JSON.stringify(Array.isArray(row)?row:[row])});if(!r.ok)throw Error(await r.text());return r.json()}async function patch(t,id,row){const r=await fetch(`${api(t)}?id=eq.${id}`,{method:"PATCH",headers:hdr(),body:JSON.stringify(row)});if(!r.ok)throw Error(await r.text())}async function del(t,id){const r=await fetch(`${api(t)}?id=eq.${id}`,{method:"DELETE",headers:hdr()});if(!r.ok)throw Error(await r.text())}
function colorButtons(el,type){document.getElementById(el).innerHTML=COLORS.map((c,i)=>`<button class="color ${(type==="j"?jobColor:eventColor)===c?"selected":""}" title="${c?"強調色":"強調なし"}" aria-label="${c?"強調色":"強調なし"}" style="background:${c||"#fff"};border-color:${c?"transparent":"#cbd5e1"}" onclick="${type==="j"?"setJobColor":"setEventColor"}('${c}')"></button>`).join("")}function setJobColor(c){jobColor=c;colorButtons("jobColors","j")}function setEventColor(c){eventColor=c;colorButtons("eventColors","e")}
function showTab(x){["jobs","companies","events","holidays","notices"].forEach(n=>{document.getElementById("sec"+n[0].toUpperCase()+n.slice(1)).classList.toggle("hidden",n!==x);document.getElementById("tab"+n[0].toUpperCase()+n.slice(1)).classList.toggle("active",n===x)});if(x==="holidays")drawHoliday();if(x==="companies")drawCompanies()}
async function load(){[jobs,events,holidays,notice]=await Promise.all([get("board_test_jobs","select=*&order=created_at.desc"),get("board_test_events","select=*&order=event_date.asc"),get("board_test_holidays","select=*"),get("board_test_notices","select=*&id=eq.1")]);drawJobs();drawEvents();drawCompanies();drawHoliday();noticeText.value=notice[0]?.content||"";fillLists()}
function fillLists(){const cs=[...new Set(jobs.map(x=>x.company_name).filter(Boolean))].sort(),ms=[...new Set(jobs.map(x=>x.machine_name).filter(Boolean))].sort();companyList.innerHTML=cs.map(x=>`<option value="${esc(x)}">`).join("");machineList.innerHTML=ms.map(x=>`<option value="${esc(x)}">`).join("")}
async function saveJob(){const row={company_name:company.value.trim(),part_no:partNo.value.trim(),machine_name:machine.value.trim()||null,due_date:dueDate.value||null,arrival_date:arrivalDate.value||null,arrival_plan:arrivalPlan.value.trim()||null,memo:jobMemo.value.trim()||null,highlight_color:jobColor||null,status:"active",updated_at:new Date().toISOString()};if(!row.company_name||!row.part_no||!row.due_date){alert("会社名・品番・納期日は入力してください");return}try{if(editingId)await patch("board_test_jobs",editingId,row);else await post("board_test_jobs",row);clearJobForm();await load()}catch(e){alert("保存エラー: "+e.message)}}
function clearJobForm(){editingId=null;company.value=partNo.value=machine.value=dueDate.value=arrivalDate.value=arrivalPlan.value=jobMemo.value="";jobColor="";colorButtons("jobColors","j")}
function drawJobs(){const a=jobs.filter(x=>x.status!=="done");jobList.innerHTML=a.length?a.map(j=>`<div class="job"><div class="jobtop"><div><b>${esc(j.company_name)} / ${esc(j.part_no)}</b><div class="muted">納期 ${j.due_date} ｜ 入荷 ${j.arrival_date||j.arrival_plan||"未定"} ｜ 機械 ${esc(j.machine_name||"未定")}</div></div></div><div style="display:flex;gap:6px;margin-top:8px"><button class="light" onclick="editJob(${j.id})">編集</button><button class="green" onclick="completeJob(${j.id})">完了</button><button class="red" onclick="deleteJob(${j.id})">削除</button></div></div>`).join(""):'<div class="muted">進行中なし</div>'}
function editJob(id){const j=jobs.find(x=>x.id===id);if(!j)return;editingId=id;company.value=j.company_name;partNo.value=j.part_no;machine.value=j.machine_name||"";dueDate.value=j.due_date||"";arrivalDate.value=j.arrival_date||"";arrivalPlan.value=j.arrival_plan||"";jobMemo.value=j.memo||"";jobColor=j.highlight_color||"";colorButtons("jobColors","j");scrollTo({top:0,behavior:"smooth"})}async function completeJob(id){if(confirm("完了にしますか？")){await patch("board_test_jobs",id,{status:"done",completed_at:new Date().toISOString(),updated_at:new Date().toISOString()});await load()}}async function deleteJob(id){if(confirm("削除しますか？")){await del("board_test_jobs",id);await load()}}
function drawCompanies(){const cs=[...new Set(jobs.map(x=>x.company_name).filter(Boolean))].sort();companies.innerHTML=cs.map(c=>`<button class="company-btn" onclick="showCompany('${encodeURIComponent(c)}')"><b>${esc(c)}</b><br><span class="muted">${jobs.filter(j=>j.company_name===c).length}件</span></button>`).join("")||'<div class="muted">会社データなし</div>'}function showCompany(enc){const c=decodeURIComponent(enc),list=jobs.filter(j=>j.company_name===c);companyDetail.innerHTML=`<h3>${esc(c)}</h3>`+list.map(j=>`<div class="job ${j.status==="done"?"done":""}"><b>${esc(j.part_no)}</b> <span class="pill">${j.status==="done"?"完了":"進行中"}</span><div class="muted">入荷 ${j.arrival_date||j.arrival_plan||"未定"} / 納期 ${j.due_date} / 機械 ${esc(j.machine_name||"未定")}</div><button class="light" onclick="showTab('jobs');editJob(${j.id})">編集</button></div>`).join("")}
async function saveEvent(){if(!eventDate.value||!eventText.value.trim())return alert("日付と内容を入力してください");await post("board_test_events",{event_date:eventDate.value,event_text:eventText.value.trim(),highlight_color:eventColor||null,updated_at:new Date().toISOString()});eventText.value="";eventColor="";colorButtons("eventColors","e");await load()}function drawEvents(){eventList.innerHTML=events.map(e=>`<div class="event" style="border-color:${e.highlight_color||"#64748b"}"><b>${e.event_date}</b> ${esc(e.event_text)} <button class="red" style="float:right;padding:4px 8px" onclick="deleteEvent(${e.id})">削除</button></div>`).join("")||'<div class="muted">イベントなし</div>'}async function deleteEvent(id){await del("board_test_events",id);await load()}
function changeHolMonth(d){hm+=d;if(hm<1){hm=12;hy--}if(hm>12){hm=1;hy++}drawHoliday()}function dk(y,m,d){return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`}function drawHoliday(){holTitle.textContent=`${hy}年${hm}月`;const days=new Date(hy,hm,0).getDate(),dows=["日","月","火","水","木","金","土"];let x=dows.map(v=>`<div class="dow">${v}</div>`).join("");const first=new Date(hy,hm-1,1).getDay();for(let i=0;i<first;i++)x+='<div></div>';for(let d=1;d<=days;d++){const k=dk(hy,hm,d),sun=new Date(hy,hm-1,d).getDay()===0,saved=holidays.some(v=>v.holiday_date===k);x+=`<button class="hday ${sun||saved?"off":""}" onclick="toggleHoliday('${k}',${sun})">${d}</button>`}holidayCal.innerHTML=x}async function toggleHoliday(k,sun){if(sun)return alert("日曜は自動休日です");const x=holidays.find(v=>v.holiday_date===k);if(x)await del("board_test_holidays",x.id);else await post("board_test_holidays",{holiday_date:k,note:"会社休日"});await load()}
async function saveNotice(){const r=await fetch(`${api("board_test_notices")}?on_conflict=id`,{method:"POST",headers:hdr("resolution=merge-duplicates,return=representation"),body:JSON.stringify([{id:1,content:noticeText.value,updated_at:new Date().toISOString()}])});if(!r.ok)alert(await r.text());else alert("保存しました")}
colorButtons("jobColors","j");colorButtons("eventColors","e");load().catch(e=>alert("TESTデータ読み込みエラー: "+e.message));
</script></body></html>
